<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les marchandises – théorie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theorie.css">
<style>



:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1e2226; --muted:#6a6f76; --line:#e2ddd2; --soft:#efebe3;
  --charge:#c2671f; --charge-bg:#fcefe3;
  --produit:#2b8352; --produit-bg:#e6f4eb;
  --res:#6d48b3; --res-bg:#efe9f9;
  --passif:#a3333d; --passif-bg:#f8e8ea;
  --bilan:#20394f; --bilan-bg:#e6ecf1;
  --actif:#2a52be; --actif-bg:#e8eefb;
  --accent:#c98a10; --accent-bg:#fff3d6;
  --y1:#e8eefb; --y2:#fff3d6;
}
.calc.q{background:var(--bilan-bg)}
.ch.ko{background:var(--charge);border-color:var(--charge);color:#fff;opacity:1}
.fb.ko{border-left:4px solid var(--charge)}
.ch.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(32,57,79,0)}50%{box-shadow:0 0 0 5px rgba(201,138,16,.75);background:var(--accent-bg)}}
.tag.at{background:var(--actif-bg);color:var(--actif)}
.tag.pt{background:var(--passif-bg);color:var(--passif)}
.journal td.dt{color:var(--muted);white-space:nowrap}
.journal tr.todo td{opacity:.38}
.btn.quiz{display:flex;align-items:center;justify-content:center;background:#037DFF;color:#fff;border-color:#037DFF;text-align:center;text-decoration:none}

/* Ligne du temps */
.t{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px 8px;position:relative;min-width:0}
.t-head{font-weight:700;font-size:13.5px;text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-body{display:grid;grid-template-columns:1fr 1fr;min-height:46px}
.col{padding:4px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ln{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px;font-size:11.5px;border-radius:4px;padding:1px 2px}
.ln .lb{color:var(--muted);line-height:1.25;min-width:0}
.ln.ext .lb{font-style:italic}
.eff .tag{font-size:11.5px}

/* Introduction et résumé */
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:14px}
.quad .hd.pt{background:var(--passif-bg);color:var(--passif)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:12px 12px 90px}
  aside{position:static;max-height:none;overflow:visible}
  .nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(245,243,238,.95);backdrop-filter:blur(6px);padding:10px 12px;border-top:1px solid var(--line)}
  .two,.quad{grid-template-columns:1fr}
}

/* --- Amortissements --- */
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity .3s,box-shadow .3s}
.card.on{box-shadow:0 0 0 2px var(--accent)}
.card.off{opacity:.45}
.card .lt{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-weight:700;font-size:12px;margin-right:6px}
.card h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center}
.card .ex{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.ecr{display:flex;justify-content:space-between;gap:8px;font-size:13px;background:var(--soft);border-radius:8px;padding:6px 10px;font-weight:600}
.ecr span:last-child{color:var(--muted);font-weight:500}
.vocab tr.cur td{background:var(--hl)}
.tab tr.todo td{color:transparent}
.tab tr.cur td{background:var(--hl);font-weight:700}
.tab tr.cur td.am{color:var(--charge)}
.tab td.am{color:var(--charge)}.bil .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:2px 0}
.bil .row.sub{color:var(--passif)}
.bil .row.tot{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:4px}
.k-fac .t-head{color:var(--passif)}
.t-head{white-space:normal !important;line-height:1.2;overflow:visible !important;text-overflow:clip !important;hyphens:auto;-webkit-hyphens:auto}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){ .split{grid-template-columns:1fr} }

/* --- Bilan et journal --- */
.inv td.am{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.inv td.tg2,.inv td.acc{width:1%;white-space:nowrap}
@keyframes fadein{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.pill.a{background:var(--actif-bg);color:var(--actif)}.pill.p{background:var(--passif-bg);color:var(--passif)}
.pill.acc{background:var(--soft);color:var(--ink)}
.bl{display:grid;grid-template-columns:1fr 1fr;max-width:720px;margin:0 auto}
.bl-title{grid-column:1/-1;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;padding-bottom:4px}
.bl-head.a{color:var(--actif)}.bl-head.p{color:var(--passif);text-align:right}
.bl-side.a{border-right:3px solid var(--ink)}
.br{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;padding:2px 4px;border-radius:4px}
.br.new{animation:pop 1.6s ease-out}
.br.cap{color:var(--res);font-weight:700}
.br.dec{color:var(--charge);font-weight:700}
.bt.bad{color:var(--charge)}
.qa.off{opacity:.25}
.acct td.n{text-align:right;font-variant-numeric:tabular-nums}
.acct th.n{text-align:right}
.rule .pm{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);font-size:22px;font-weight:700}
.rule .pm span:first-child{border-right:2px solid var(--ink)}
.rule .pm small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.plus{color:var(--produit)}.case{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity .3s,box-shadow .3s}
.case.on{box-shadow:0 0 0 2px var(--accent)}.case.off{opacity:.4}
.case p{margin:0 0 8px;font-size:14.5px}
.t-sides .sg{font-weight:700}
.bl-side.p .bg.hl{color:var(--passif)}
.bl-side.dim,.bl-head.dim{opacity:.3}
.t-head{white-space:normal !important;line-height:1.2;overflow:visible !important;text-overflow:clip !important;hyphens:auto;-webkit-hyphens:auto}

/* --- Salaires --- */
.taux{border:3px solid var(--accent);border-radius:14px;padding:12px 16px;background:#fffdf6}
.taux h3{margin:0 0 8px;font-family:Fraunces,Georgia,serif;color:var(--accent);display:flex;justify-content:space-between;align-items:baseline}
.taux h3 small{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:500}
.tt td.n,.tt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt tr.hl td{background:var(--hl);font-weight:600}
.slip td{padding:6px 10px;border-bottom:1px dashed var(--line)}
.slip td.n{text-align:right;white-space:nowrap}
.slip tr.sub td:first-child{border-left:4px solid var(--charge)}
.slip tr.add td.n{color:var(--produit)}.slip tr.sub td.n{color:var(--charge)}.slip tr.pay td.n{color:var(--actif)}
.slip tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.slip tr.cur td{background:var(--hl)}
.chip{display:inline-block;padding:2px 9px;border-radius:7px;font-weight:600;font-size:13px}
.chip.charge{background:var(--charge-bg);color:var(--charge)}
.chip.passif{background:var(--passif-bg);color:var(--passif)}
.chip.actif{background:var(--actif-bg);color:var(--actif)}
.jl2 th.n,.jl2 td.n{text-align:right}
.jl2 td{padding:6px 8px;border-bottom:1px dashed var(--line)}
.jl2 tr.cur td{background:var(--hl)}
.jl2 tr.new td{animation:pop 1.6s ease-out}
.jl2 tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.arrows{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.arw.off{opacity:.12}
.arw .line{height:4px;border-radius:2px;position:relative}
.arw .line::after{content:"";position:absolute;top:-6px;border:8px solid transparent}
.arw.r .line::after{right:-4px;border-left-color:inherit;border-left-width:12px;border-right-width:0}
.arw.l .line::after{left:-4px;border-right-color:inherit;border-right-width:12px;border-left-width:0}
.arw .lab{text-align:center;font-weight:600}
.arw .amt{font-variant-numeric:tabular-nums;font-weight:700}
.arw.new{animation:pop 1.6s ease-out}
.bal{display:flex;flex-direction:column;gap:6px;max-width:520px;margin:14px auto 0;font-size:14px}
.bal .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px}
.bal .row.tot{font-weight:700;border-top:2px solid var(--ink)}
.due{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.due h4{margin:0 0 6px;font-size:14px;color:var(--passif)}
.due .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:13.5px}
.due .row.tot{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:4px}
.due.on{box-shadow:0 0 0 2px var(--accent)}
/* --- Titres --- */
.acrow{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;margin-bottom:10px}
.acrow .t-body{min-height:26px}
.acx{font-size:14px}
.acgrp{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.jr-stage{max-width:760px;margin-bottom:16px}
.lk{display:inline-block;padding:1px 8px;border-radius:7px;border:1.5px solid;font-weight:700}
.code{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;justify-content:center;padding:10px 0}
.cpart{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:170px;text-align:center}
.ctok{font:700 30px/1 'Courier New',monospace;border:3px solid;border-radius:10px;padding:10px 14px;background:#fff}
.clab{font-size:13px;font-weight:600;color:var(--ink)}
.icbar{display:flex;height:40px;border-radius:8px;overflow:hidden;margin-top:10px;color:#fff;font-weight:600;font-size:13px}
.ics{display:flex;align-items:center;justify-content:center;transition:background .4s}
.icdates{position:relative;height:44px;font-size:12px;color:var(--muted);margin-top:6px}
.icdates span{position:absolute;top:0;white-space:nowrap}
.icdates span:nth-child(2){transform:translateX(-50%);text-align:center;color:var(--ink);font-weight:600}
.steps3{display:flex;flex-direction:column;gap:4px;max-width:620px}
.steps3 .calc{margin:6px 0}
/* Action vs Obligation */
.syn{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.syn th,.syn td{padding:8px 10px;border-bottom:1px dashed #9c9282;vertical-align:top;text-align:left}
.syn tr>th:first-child{width:130px;font-weight:600;color:var(--muted);font-size:12.5px}
.syn th.hd{font-family:Fraunces,Georgia,serif;font-size:19px;text-align:center;border-radius:10px 10px 0 0}
.syn th.hd.a{background:var(--actif-bg);color:var(--actif)}.syn th.hd.o{background:var(--produit-bg);color:var(--produit)}
.syn td.cur{background:var(--hl)}
.syn .code{justify-content:flex-start;gap:8px;padding:0}.syn .ctok{font-size:20px;padding:6px 8px}.syn .clab{font-size:11.5px}.syn .cpart{max-width:110px}
/* Dividendes et intérêts */
.divt{max-width:620px}.divt td{font-size:15px}
/* Donnée et jours */
/* --- Intérêts --- */
.tab.cal td,.tab.cal th{text-align:left}
.jt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.jt th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink)}
.jt td{padding:6px 8px;border-bottom:1px dashed #9c9282;vertical-align:top}
.jt .n{text-align:right}
.jt td.dates{white-space:nowrap}
.jt tr.cur td{background:var(--hl)}
.jt tr.why td{font-size:12.5px;color:var(--muted);padding-top:0;border-bottom:1px dashed #9c9282}
.jt tr.why td{border-top:0}
.an{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--actif-bg);color:var(--actif);margin-left:4px}
.an.bis{background:var(--passif-bg);color:var(--passif)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 6px}
.frac span:last-child{padding:0 6px}
.fml{font-size:20px;font-weight:600;text-align:center;margin:10px 0}
.fx2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fx2 .calc{margin:0}
.lets{display:grid;grid-template-columns:repeat(4,minmax(0,140px));gap:10px;margin-top:12px}
.let{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:18px}
.let span{color:var(--muted);font-weight:600}
.let.x{border:2px solid var(--accent);background:var(--accent-bg)}
.cards.feb .card h4{font-size:17px}.cards.feb .card .ex{font-size:15.5px;color:var(--ink);line-height:1.5}
.jt td.c{white-space:nowrap}
.jt{table-layout:fixed}
.jt s{color:var(--muted)}.jt .d2{color:var(--passif)}
.donnee{font-size:14.5px;background:#f6f3ec;border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px}
.jours{border-collapse:collapse;font-size:13px;margin-top:4px;width:100%}
.jours td{padding:2px 6px;border-bottom:1px dashed #9c9282}
.jours td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.jours tr.tot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.jnote{font-size:12px;color:var(--muted);margin-top:4px}


/* --- Marchandises --- */
.chip.produit{background:var(--produit-bg);color:var(--produit)}
.crt{border:1px solid var(--line);border-radius:12px;padding:8px 12px 10px;font-variant-numeric:tabular-nums}
.crh{text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:16px;margin-bottom:4px}
.crc{display:grid;grid-template-columns:1fr 1fr}
.crs{display:flex;flex-direction:column;gap:2px;padding:4px 8px}
.crs.d{border-right:2px solid var(--ink)}
.crc.head{border-bottom:2px solid var(--ink);margin-bottom:2px}
.crk{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 14px 2px}
.crk.r{text-align:right}
.crdeg{font-size:12px;font-weight:700;color:var(--accent);text-align:center;margin:8px 0 2px}
.crl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:2px 6px;border-radius:4px;transition:background .5s}
.crl.bn{font-weight:700;color:var(--res)}
.crl.bb{font-weight:700;color:var(--actif)}
.crc.tot .crl{font-weight:800}
.crc.tot{border-top:2px solid var(--ink)}
.crc.tot .crl{border-bottom:4px double var(--ink);border-radius:0}
.crsep{height:14px}
.cr2{width:100%;max-width:760px;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.cr2 td{padding:5px 10px;border-bottom:1px dashed var(--line)}
.cr2 td.n{text-align:right;width:130px;white-space:nowrap}
.cr2 tr.res td{font-weight:700;border-bottom:2px solid var(--ink)}
.cr2 tr.big td{font-size:16px}
.cr2 tr.hide{display:none}
.cr2 tr.cur td{background:var(--hl)}
.donnee{font-size:14.5px;background:#f6f3ec;border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;margin-bottom:12px}
.inh{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.sch{display:grid;grid-template-columns:1fr 1fr;max-width:620px;font-variant-numeric:tabular-nums}
.scol{display:flex;flex-direction:column}
.sc{display:flex;justify-content:space-between;gap:10px;min-height:32px;align-items:center;padding:4px 12px;font-size:15px;animation:cellin .6s ease-out}
.sc.empty{animation:none}
.sc.vs{border-bottom:2px solid var(--ink)}
.sc.b{font-weight:700}
.sch1{max-width:310px;margin-top:14px}
@keyframes cellin{from{opacity:0}}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sums .calc{margin:0}
@media (max-width:1100px){ .sums{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="panel">
      <h1>Les marchandises</h1>
      <p class="sub">Entreprise de service ou commerce · comptes de marchandises · CAN, PRAMV et bénéfice brut · variation de stock</p>
      <div class="dots" id="dots"></div>
    </div>

    <div class="panel" id="explain"></div>

    <div class="nav-wrap">
      <div class="nav">
        <button class="btn" id="prev">← Précédent</button>
        <button class="btn primary" id="next">Suite →</button>
      </div>
    </div>

    <div class="nav exit">
      <button class="btn quit" id="quit">Quitter</button>
    </div>
    <p class="note" id="quit-msg" style="display:none;color:#fff">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : fermer l'onglet.</p>
  </aside>

  <main class="stage" id="stage"></main>
</div>
<div class="zoombar"><button id="zm" title="Réduire la taille" aria-label="Réduire la taille">A−</button><button id="zp" title="Agrandir la taille" aria-label="Agrandir la taille">A+</button></div>

<script>
/* ---------- Réglages ---------- */
const Y = new Date().getFullYear();                 // année des exemples
const ANS = {};
const fmt = n => { const neg=n<0; n=Math.abs(Math.round(n*100)/100); const [i,d]=n.toFixed(2).split('.');
  return (neg?'−':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,"'") + (d!=='00' ? '.'+d : ''); };
const $ = id => document.getElementById(id);
const KIND = {'Ventes de marchandises':'produit','Déductions accordées':'charge','Achats de marchandises':'charge','Frais d\'achat':'charge',
  'Déductions obtenues':'produit','Prestations propres':'produit','Variation de stock':'charge','Stock de marchandises':'actif'};
const PLUS_D = k => k==='actif' || k==='charge';
const chip = a => `<span class="chip ${KIND[a]}">${a}</span>`;

/* ---------- Comptes en T ---------- */
// J : écritures {ph, n, d, c, amt}  ·  soldes {ph, open:compte, side, amt, lab}
function postings(J, acc, ph){
  const P = {d:[], c:[]};
  J.forEach(e=>{
    if (e.ph>ph) return;
    const fresh = e.ph===ph;
    if (e.open){ if (e.open===acc) P[e.side].push({lb:e.lab||'sàn', amt:e.amt, fresh}); return; }
    if (e.d===acc) P.d.push({lb:e.n, amt:e.amt, fresh});
    if (e.c===acc) P.c.push({lb:e.n, amt:e.amt, fresh});
  });
  return P;
}
function tHTML(acc, P, focus, eff){
  const k = KIND[acc], pd = PLUS_D(k);
  const col = arr => arr.map(l=>`<div class="ln ${l.fresh?'fresh':''}"><span class="lb">${l.lb}</span><span class="am">${fmt(l.amt)}</span></div>`).join('');
  return `<div class="t k-${k} ${focus?'focus':''}">
    <div class="t-sides"><span>D <b class="sg ${pd?'plus':'minus'}">${pd?'+':'−'}</b></span><span class="t-head" title="${acc}">${acc}</span><span><b class="sg ${pd?'minus':'plus'}">${pd?'−':'+'}</b> C</span></div>
    <div class="t-body"><div class="col d">${col(P.d)}</div><div class="col c">${col(P.c)}</div></div>
    ${eff?`<div class="eff">${eff}</div>`:''}</div>`;
}
function journalHTML(J, ph){
  const rows = J.filter(e=>!e.open);
  return `<table class="jl2"><tr><th>N°</th><th>Compte débité</th><th>Compte crédité</th><th class="n">Montant</th></tr>
    ${rows.map(e=>`<tr class="${e.ph>ph?'hide':''}"><td>${e.n}</td><td>${chip(e.d)}</td><td>${chip(e.c)}</td><td class="n">${fmt(e.amt)}</td></tr>`).join('')}</table>`;
}
function compta(J, accs, ph, eff){
  const ts = accs.map(acc=>{ const P = postings(J, acc, ph);
    const focus = J.some(e=>e.ph===ph && !e.open && (e.d===acc||e.c===acc));
    return tHTML(acc, P, focus, eff ? eff(acc,P,ph) : ''); }).join('');
  return `<section class="sec"><h2>Dans la comptabilité</h2><div class="jr-stage">${journalHTML(J, ph)}</div><div class="tg">${ts}</div></section>`;
}

/* ---------- Compte de résultat en T ---------- */
// rows : [libellé, montant, groupe]  ·  groupe : 'can' (chiffre d'affaires), 'pr' (prix de revient), '' (autres)
const GRP = {can:'#d9efdf', pr:'#fde6cf', pp:'#ece4f8', bb:'#dfe8fb', vs:'#f4ad85'};
function crT(title, D, C, opts={}){
  // D et C : une liste de lignes, ou une liste de blocs (un bloc par degré) si opts.blocks
  const side = rows => rows.map(([l,v,g,tag])=>`<div class="crl ${tag||''}" style="${opts.col&&opts.col.includes(g)?`background:${GRP[g]}`:''}"><span>${l}</span><span>${v===''?'':fmt(v)}</span></div>`).join('');
  const tot = rows => rows.reduce((t,r)=>t+(+r[1]||0),0);
  const DB = opts.blocks ? D : [D], CB = opts.blocks ? C : [C];
  return `<div class="crt"><div class="crh">${title}</div>
    <div class="crc head"><div class="crk">Charges</div><div class="crk r">Produits</div></div>
    ${DB.map((d,i)=>`${opts.blocks&&i?`<div class="crsep"></div>`:''}
      <div class="crc"><div class="crs d">${side(d)}</div><div class="crs c">${side(CB[i])}</div></div>
      ${(Array.isArray(opts.tot)?opts.tot[i]:opts.tot)?`<div class="crc tot"><div class="crs d"><div class="crl"><span>Total</span><span>${fmt(tot(d))}</span></div></div><div class="crs c"><div class="crl"><span>Total</span><span>${fmt(tot(CB[i]))}</span></div></div></div>`:''}`).join('')}</div>`;
}

/* ---------- La librairie de l'exemple ---------- */
const L = {ven:300000, dac:10000, ach:180000, fra:6000, dob:8000, pp:2000, vs:2000,          // vs > 0 : augmentation de stock
  sal:60000, loy:24000, adm:4000, ent:3000, ace:5000, amo:6000, chf:2000, prf:1000};
L.can = L.ven - L.dac; L.prama = L.ach + L.fra - L.dob; L.pramv = L.prama - L.vs; L.bb = L.can - L.pramv + L.pp;   // BB = solde du 1er degré
L.ch = L.sal+L.loy+L.adm+L.ent+L.ace+L.amo+L.chf; L.bn = L.bb + L.prf - L.ch;

/* Compte de résultat à 2 degrés, palier par palier (upto : 0 = CAN · 1 = PRAMA · 2 = PRAMV · 3 = BB · 4 = BN) */
function cr2(upto){
  const R = [
    [0,'Ventes de marchandises', L.ven,'',''], [0,'− Déductions accordées', -L.dac,'s',''], [0,'= Chiffre d\'affaires net (CAN)', L.can,'r','can'],
    [1,'Achats de marchandises', L.ach,'',''], [1,'+ Frais d\'achat', L.fra,'s',''], [1,'− Déductions obtenues', -L.dob,'s',''],
    [1,'= Prix de revient d\'achat des marchandises achetées (PRAMA)', L.prama,'r','pr'],
    [2,'− Augmentation de stock', -L.vs,'s',''], [2,'= Prix de revient d\'achat des marchandises vendues (PRAMV)', L.pramv,'r','pr'],
    [3,'+ Prestations propres', L.pp,'s',''], [3,'= Bénéfice brut (BB)', L.bb,'r big','bb'],
    [4,'+ Produits financiers', L.prf,'s',''], [4,'− Charges d\'exploitation et financières', -L.ch,'s',''], [4,'= Bénéfice net (BN)', L.bn,'r big','bn']];
  return `<table class="cr2">${R.map(([p,l,v,k,g])=>`<tr class="${k.includes('r')?'res':''} ${k.includes('big')?'big':''} ${p>upto?'hide':''} ${p===upto?'cur':''}"><td style="${g?`box-shadow:inset 5px 0 0 ${{can:'#2b8352',pr:'#c2671f',bb:'#2a52be',bn:'#6d48b3'}[g]}`:''}">${l}</td><td class="n">${fmt(v)}</td></tr>`).join('')}</table>`;
}

/* ---------- Les étapes ---------- */
const STEPS = [
 { title:'Service ou commerce ?',
   ph:[{btn:'Un commerce →', text:`Une <b>entreprise de service</b> vend son travail : coupe de cheveux, conseil, comptabilité…<br><br>Elle achète parfois des produits (shampoing, laque), mais elle les <b>utilise</b> pour son travail : ce sont des charges, comme les salaires ou les loyers.`},
       {btn:'Suite →', text:`Un <b>commerce</b> achète des marchandises pour les <b>revendre</b> : une librairie achète des livres et les revend plus cher.<br><br>Son compte de résultat a donc des comptes de plus : les <b>comptes de marchandises</b>.`,
        q:{text:'Pour une librairie, les livres achetés sont…', opts:[['m','des marchandises à revendre'],['u','des produits utilisés pour son travail']], ok:'m',
           fb:'la librairie revend les livres : ce sont des <b>marchandises</b>.'}}],
   stage: ph => `<section class="sec"><h2>Compte de résultat d'une entreprise de services</h2><div class="two">
       ${crT('Salon de coiffure',[['Achat de produits',''],['Salaires',''],['Loyers',''],['Bénéfice net','','','bn']],[['Produits de coiffure','']])}
       ${crT('Fiduciaire, avocat',[['Salaires',''],['Loyers',''],['ACE',''],['Bénéfice net','','','bn']],[['Honoraires','']])}</div></section>
     ${ph>=1?`<section class="sec"><h2>Compte de résultat d'un commerce, exemple : une librairie</h2>${crT('Librairie',
       [['Achats de marchandises',''],['Frais d\'achat',''],['Déductions accordées',''],['Variation de stock',''],['Salaires',''],['Loyers',''],['…',''],['Bénéfice net','','','bn']],
       [['Ventes de marchandises',''],['Déductions obtenues',''],['Prestations propres',''],['Variation de stock',''],['Produits financiers','']])}
       <p class="note">Les nouveaux comptes sont expliqués dans les étapes suivantes.</p></section>`:''}` },

 { title:'Les comptes de marchandises',
   ph:[{btn:'Le stock →', text:`Les comptes de marchandises sont des <b>comptes de gestion</b> : des charges ou des produits.`},
       {btn:'Suite →', text:`Le compte <b>Stock de marchandises</b> est différent : c'est un compte d'<b>actif</b>.<br><br>On ne l'utilise qu'<b>une fois par an</b>, en fin d'exercice, pour enregistrer l'inventaire.`}],
   stage: ph => { const row = (acc, txt) => `<div class="acrow">${tHTML(acc,{d:[],c:[]},false,'')}<div class="acx">${txt}</div></div>`;
     return `<section class="sec"><h2>Les comptes de gestion liés aux marchandises</h2>
       <div class="acgrp" style="color:var(--produit)">Produits</div>
       ${row('Ventes de marchandises','Le prix des marchandises vendues.')}
       ${row('Déductions obtenues','Les rabais, escomptes et ristournes de nos fournisseurs.')}
       ${row('Prestations propres','Les marchandises prélevées par le propriétaire.')}
       <div class="acgrp" style="color:var(--charge)">Charges</div>
       ${row('Achats de marchandises','Le prix des marchandises achetées.')}
       ${row('Frais d\'achat','Les frais pour recevoir les marchandises : transport, douane…')}
       ${row('Déductions accordées','Les rabais, escomptes et ristournes faits à nos clients.')}
       ${row('Variation de stock','La différence entre le stock du début et celui de la fin de l\'année.')}</section>
     ${ph>=1?`<section class="sec"><h2>Un compte du bilan</h2><div class="acgrp" style="color:var(--actif)">Actif</div>
       ${row('Stock de marchandises','La valeur des marchandises en magasin. Utilisé une fois par an, à l\'inventaire du 31.12.')}</section>`:''}`; } },

 { title:'Les déductions',
   ph:[{btn:'Accordées ou obtenues →', text:`Lors d'une vente ou d'un achat, le prix peut être <b>réduit</b>. Il existe trois sortes de déductions.`},
       {btn:'Suite →', text:`• Quand <b>nous</b> faisons une déduction à un client, ce sont des <b>déductions accordées</b>. Elles diminuent nos ventes.<br>• Quand un fournisseur nous fait une déduction, ce sont des <b>déductions obtenues</b>. Elles diminuent nos achats.<br><br>Ces comptes servent <b>uniquement pour les marchandises</b>.`}],
   stage: ph => `<section class="sec"><h2>Les trois déductions</h2><div class="cards">
       <div class="card"><div class="ico">🏷️</div><h4>Le rabais</h4><div class="ex">Pour une grande quantité, un défaut, une promotion, une liquidation.</div></div>
       <div class="card"><div class="ico">⏱️</div><h4>L'escompte</h4><div class="ex">Pour un paiement rapide.</div></div>
       <div class="card"><div class="ico">🔁</div><h4>La ristourne</h4><div class="ex">Un retour d'argent sur les achats cumulés de l'année.</div></div></div></section>
     ${ph>=1?`<section class="sec"><h2>Accordées ou obtenues ?</h2><div class="two">
       <div class="box"><h4 style="color:var(--charge)">Déductions accordées</h4>Nous réduisons le prix à <b>notre client</b>.<br>Elles <b>diminuent les ventes</b>.</div>
       <div class="box"><h4 style="color:var(--produit)">Déductions obtenues</h4><b>Notre fournisseur</b> nous réduit le prix.<br>Elles <b>diminuent les achats</b>.</div></div></section>`:''}` },

 { title:'Les prestations propres',
   ph:[{btn:'Suite →', text:`Le propriétaire de la librairie emporte des livres pour lui-même : c'est un <b>prélèvement de marchandises</b>, appelé <b>prestations propres</b>.<br><br>Ce n'est <b>ni une vente</b>, <b>ni une diminution d'achat</b> : les prestations propres n'entrent pas dans le calcul du CAN ni du PRAMA / PRAMV. Leur calcul ne sert que pour la <b>TVA</b>.`}],
   stage: () => `<section class="sec"><h2>Un prélèvement du propriétaire</h2><div class="cards">
       <div class="card"><div class="ico">📚</div><h4>Ce qui se passe</h4><div class="ex">Le propriétaire prend des livres du magasin pour son usage privé.</div></div>
       <div class="card"><div class="ico">🚫</div><h4>Ni une vente, ni une diminution d'achat</h4><div class="ex">Elles n'entrent ni dans le calcul du CAN, ni dans celui du PRAMA ou du PRAMV.</div></div>
       <div class="card"><div class="ico">🧾</div><h4>Pour la TVA</h4><div class="ex">Le compte <b>Prestations propres</b> est un compte de produit. Son calcul ne sert que pour la TVA.</div></div></div></section>` },

 { title:'La variation de stock', vs:[{deb:6000, fin:8000}, {deb:8500, fin:7000}] },

 { title:'Le compte de résultat à 2 degrés',
   ph:[{btn:'Les ventes →', text:`Le compte de résultat d'un commerce se présente en <b>deux degrés</b> : le 1<sup>er</sup> donne le <b>bénéfice brut</b>, le 2<sup>e</sup> le <b>bénéfice net</b>.<br><br>On va le remplir étape par étape.`},
       {btn:'Les prestations propres →', text:`Les <b>ventes de marchandises</b> et les <b>déductions accordées</b>. Elles donnent le <b>chiffre d'affaires net (CAN)</b>.`},
       {btn:'Les achats →', text:`Les <b>prestations propres</b>, sous les ventes. Ce n'est ni une vente, ni une diminution d'achat : elles n'entrent ni dans le CAN, ni dans le PRAMV.`},
       {btn:'La variation de stock →', text:`Les <b>achats</b> : achats de marchandises, frais d'achat et déductions obtenues. Ils donnent le <b>prix de revient d'achat des marchandises achetées (PRAMA)</b>.<br><br>Les déductions obtenues sont du côté des produits : elles <b>diminuent</b> les achats.`},
       {btn:'Le bénéfice brut →', text:`La <b>variation de stock</b>. Avec le PRAMA, elle donne le <b>prix de revient d'achat des marchandises vendues (PRAMV)</b>.<br><br>Ici, le stock a augmenté : la variation est du côté des produits, elle <b>diminue</b> les achats.`},
       {btn:'Le report →', text:`Le <b>bénéfice brut</b> est la différence entre les deux côtés du 1<sup>er</sup> degré : ${fmt(L.bb)}.`},
       {btn:'Le 2e degré →', text:`Le bénéfice brut est <b>reporté</b> au 2<sup>e</sup> degré, du côté des produits.`},
       {btn:'Suite →', text:`On ajoute les <b>autres comptes</b> : les charges d'exploitation et financières, les produits financiers. Leur total net forme les <b>frais généraux (FG)</b>. La différence est le <b>bénéfice net</b> : ${fmt(L.bn)}.`}],
   stage: ph => { const R = rows => rows.filter(r=>ph>=r[3]).map(([l,v,g,p,t])=>[l,v,g,t]);
     const FG = L.ch - L.prf;
     const cell = (txt, v, p, bg, cls='') => ph>=p ? `<div class="sc ${cls}" style="background:${bg}"><span>${txt}</span><span>${v===''?'':fmt(v)}</span></div>` : `<div class="sc empty"></div>`;
     const schema = `<div class="sch">
         <div class="scol">${cell('','',99,'')}${cell('','',99,'')}${cell('PRAMA',L.prama,3,'#fde6cf')}${cell(`− augmentation de stock`,L.vs,4,'#f4ad85','vs')}</div>
         <div class="scol">${cell('CAN',L.can,1,'#d9efdf')}${cell('+ Prestations propres',L.pp,2,'#ece4f8')}<div class="sc empty"></div>${cell('− PRAMV',L.pramv,4,'#f4ad85','vs')}
           ${cell('= BB',L.bb,5,'#dfe8fb','line b')}${cell('− FG',FG,7,'')}${cell('= BN',L.bn,7,'','b')}</div></div>
       ${ph>=4?`<div class="sch1"><div class="sc" style="background:#f4ad85"><span>+ diminution de stock</span></div><div class="sc" style="background:#f4ad85"><span>− augmentation de stock</span></div></div>`:''}`;
     return `<section class="sec"><h2>Compte de résultat ${Y} de la librairie</h2>${crT('Librairie',
       [R([['Déductions accordées',L.dac,'can',1],['Achats de marchandises',L.ach,'pr',3],['Frais d\'achat',L.fra,'pr',3],['Bénéfice brut',L.bb,'bb',5,'bb']]),
        R([['Salaires',L.sal,'',7],['Loyers',L.loy,'',7],['Frais d\'administration',L.adm,'',7],['Entretien et réparation',L.ent,'',7],['ACE',L.ace,'',7],['Amortissements',L.amo,'',7],['Charges financières',L.chf,'',7],['Bénéfice net',L.bn,'',7,'bn']])],
       [R([['Ventes de marchandises',L.ven,'can',1],['Prestations propres',L.pp,'pp',2],['Déductions obtenues',L.dob,'pr',3],['Variation de stock (augmentation)',L.pp,'vs',4]]),
        R([['Bénéfice brut',L.bb,'bb',6,'bb'],['Produits financiers',L.prf,'',7]])],
       {col:['can','pp','pr','bb','vs'], tot:[ph>=5, ph>=7], blocks:true})}</section>
       <section class="sec"><h2>Le calcul du bénéfice brut et du bénéfice net</h2>${schema}
       ${ph>=7?`<p class="note">FG (frais généraux) = total des charges du 2<sup>e</sup> degré − les produits du 2<sup>e</sup> degré (sans le bénéfice brut) : ${fmt(L.ch)} − ${fmt(L.prf)} = ${fmt(FG)}.</p>`:''}</section>`; } }
];

/* Variation de stock : deux situations l'une sous l'autre, 2 phases chacune */
STEPS.forEach(s=>{ if (!s.vs) return;
  const sit = s.vs.map(({deb, fin}, k)=>{ const aug = fin>deb, d = Math.abs(fin-deb), o = 2*k;
    return {deb, fin, aug, d, o,
      J:[{ph:0, open:'Stock de marchandises', side:'d', amt:deb},
         aug ? {ph:1, n:1, d:'Stock de marchandises', c:'Variation de stock', amt:d} : {ph:1, n:1, d:'Variation de stock', c:'Stock de marchandises', amt:d}],
      ph:[
        {btn:'Comptabiliser →', text: k===0 ? `À la fin de l'année, on compte les marchandises en magasin : c'est l'<b>inventaire</b>. On compare le stock final au stock du début.` : `Deuxième situation.`,
         q:{text:`De ${fmt(deb)} à ${fmt(fin)}, le stock a…`, opts:[['a','augmenté'],['d','diminué']], ok: aug?'a':'d',
            fb: aug ? `le stock a <b>augmenté</b> de ${fmt(fin)} − ${fmt(deb)} = <b>${fmt(d)}</b>.` : `le stock a <b>diminué</b> de ${fmt(deb)} − ${fmt(fin)} = <b>${fmt(d)}</b>.`}},
        {btn: k===0 ? 'Deuxième situation →' : 'Suite →', text: aug
          ? `<b>Stock de marchandises / Variation de stock</b> ${fmt(d)}.<br><br>L'augmentation (AS) est au crédit de la Variation de stock : elle <b>diminue les charges</b> de marchandises.`
          : `<b>Variation de stock / Stock de marchandises</b> ${fmt(d)}.<br><br>La diminution (DS) est au débit de la Variation de stock : elle <b>augmente les charges</b> de marchandises.`}]}; });
  s.ph = sit.flatMap(x=>x.ph);
  s.stage = ph => sit.filter(x=>ph>=x.o).map((x,k)=>{ const p = ph - x.o > 1 ? 99 : ph - x.o;   // 99 : situation terminée, plus rien en évidence
    const inner = compta(x.J, ['Stock de marchandises','Variation de stock'], p, (acc,P,q)=> acc==='Stock de marchandises'
        ? `Solde : <span class="tag ${q>=1?'good':'neutral'}">${fmt(P.d.reduce((t,l)=>t+l.amt,0)-P.c.reduce((t,l)=>t+l.amt,0))}</span>${q>=1?` · inventaire : <b>${fmt(x.fin)}</b>`:''}` : '')
      .replace('<section class="sec"><h2>Dans la comptabilité</h2>','<div class="inh">Dans la comptabilité</div>').replace(/<\/section>$/,'');
    return `<section class="sec"><h2>Situation ${k+1} : ${x.aug?'augmentation':'diminution'} de stock</h2>
      <div class="donnee">À l'inventaire du 31.12.${Y}, le stock final est de <b>${fmt(x.fin)}</b>. Au 1.1, il était de <b>${fmt(x.deb)}</b> (le solde à nouveau).</div>${inner}</section>`; }).join('');
});
const LAST = STEPS.length-1;

/* ---------- Actions ---------- */
const A = [];
STEPS.forEach((s,i)=>s.ph.forEach((_,p)=>A.push({step:i, ph:p})));
let pos = 0;

/* ---------- Rendu ---------- */
function qBox(key, q){
  const ch = ANS[key];
  const btn = (a,lb) => `<button class="ch ${ch===a?(a===q.ok?'ok':'ko'):''} ${ch?'':'blink'}" data-a="${a}" ${ch?'disabled':''}>${lb}</button>`;
  const fb = ch ? `<div class="fb ${ch===q.ok?'ok':'ko'}">${ch===q.ok?'✓ En effet':'✗ En fait'}, ${q.fb}</div>` : `<div class="hint">Cliquer sur la bonne réponse.</div>`;
  return `<div class="calc q"><div style="font-weight:600;margin-bottom:4px">La question à se poser</div>${q.text}
    <div class="choices" style="flex-wrap:wrap">${q.opts.map(([a,lb])=>btn(a,lb)).join('')}</div>${fb}</div>`;
}
const LET = i => String.fromCharCode(65+i);   // A, B, C…
function render(){
  pos = Math.max(0, Math.min(A.length-1, pos));
  const {step, ph} = A[pos], S = STEPS[step], P = S.ph[ph], key = step+'.'+ph;
  document.querySelectorAll('.dot').forEach((b,i)=>{ b.classList.toggle('cur', i===step); b.classList.toggle('done', i<step); });
  $('prev').disabled = pos===0;
  $('next').disabled = pos===A.length-1 || (P.q && !ANS[key]);
  $('next').textContent = pos===A.length-1 ? 'Terminé ✓' : P.btn;
  $('explain').innerHTML = `<h2 class="steptitle">${LET(step)}. ${S.title}</h2>
    <p class="steptext">${P.text}</p>${P.q?qBox(key,P.q):''}`;
  $('stage').innerHTML = S.stage(ph);
}

/* ---------- Navigation ---------- */
function goTo(p){ pos = p; render(); }
function goStep(s){ goTo(A.findIndex(a=>a.step===s)); }
let Z = 1;
try { Z = +localStorage.getItem('marchandises-zoom') || 1; } catch(e){}
function applyZoom(){
  Z = Math.round(Math.max(0.8, Math.min(1.6, Z))*10)/10;
  document.documentElement.style.setProperty('--z', Z);
  try { localStorage.setItem('marchandises-zoom', Z); } catch(e){}
}
$('dots').innerHTML = STEPS.map((s,i)=>`<button class="dot" data-s="${i}" title="${LET(i)}. ${s.title}" aria-label="${LET(i)}. ${s.title}"></button>`).join('');
$('zm').addEventListener('click', ()=>{ Z -= 0.1; applyZoom(); });
$('zp').addEventListener('click', ()=>{ Z += 0.1; applyZoom(); });
$('next').addEventListener('click', ()=>goTo(pos+1));
$('prev').addEventListener('click', ()=>goTo(pos-1));
$('explain').addEventListener('click', e=>{ const b=e.target.closest('.ch'); if (!b || b.disabled) return; const {step,ph}=A[pos]; ANS[step+'.'+ph] = b.dataset.a; render(); });
$('quit').addEventListener('click', ()=>{ window.close(); setTimeout(()=>{ $('quit-msg').style.display='block'; }, 300); });
$('dots').addEventListener('click', e=>{ const b=e.target.closest('.dot'); if (b) goStep(+b.dataset.s); });
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' && !$('next').disabled) goTo(pos+1);
  if (e.key==='ArrowLeft') goTo(pos-1);
});
render();
applyZoom();
</script>
