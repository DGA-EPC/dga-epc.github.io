<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introduction à la comptabilité</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theorie.css">
<style>

:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1e2226; --muted:#6a6f76; --line:#e2ddd2; --soft:#efebe3;
  --charge:#c2671f; --charge-bg:#fcefe3;
  --produit:#2b8352; --produit-bg:#e6f4eb;
  --res:#6d48b3; --res-bg:#efe9f9;
  --passif:#a3333d; --passif-bg:#f8e8ea;
  --bilan:#20394f; --bilan-bg:#e6ecf1;
  --actif:#2a52be; --actif-bg:#e8eefb;
  --accent:#c98a10; --accent-bg:#fff3d6;
  --y1:#e8eefb; --y2:#fff3d6;
}
.calc.q{background:var(--bilan-bg)}
.ch.ko{background:var(--charge);border-color:var(--charge);color:#fff;opacity:1}
.fb.ko{border-left:4px solid var(--charge)}
.ch.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(32,57,79,0)}50%{box-shadow:0 0 0 5px rgba(201,138,16,.75);background:var(--accent-bg)}}
.tag.at{background:var(--actif-bg);color:var(--actif)}
.tag.pt{background:var(--passif-bg);color:var(--passif)}
.journal td.dt{color:var(--muted);white-space:nowrap}
.journal tr.todo td{opacity:.38}
.btn.quiz{display:flex;align-items:center;justify-content:center;background:#037DFF;color:#fff;border-color:#037DFF;text-align:center;text-decoration:none}

/* Ligne du temps */
.t{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px 8px;position:relative;min-width:0}
.t-head{font-weight:700;font-size:13.5px;text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-body{display:grid;grid-template-columns:1fr 1fr;min-height:46px}
.col{padding:4px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ln{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px;font-size:11.5px;border-radius:4px;padding:1px 2px}
.ln .lb{color:var(--muted);line-height:1.25;min-width:0}
.ln.ext .lb{font-style:italic}
.eff .tag{font-size:11.5px}

/* Introduction et résumé */
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:14px}
.quad .hd.pt{background:var(--passif-bg);color:var(--passif)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:12px 12px 90px}
  aside{position:static;max-height:none;overflow:visible}
  .nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(245,243,238,.95);backdrop-filter:blur(6px);padding:10px 12px;border-top:1px solid var(--line)}
  .two,.quad{grid-template-columns:1fr}
}

/* --- Amortissements --- */
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity .3s,box-shadow .3s}
.card.on{box-shadow:0 0 0 2px var(--accent)}
.card.off{opacity:.45}
.card .lt{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-weight:700;font-size:12px;margin-right:6px}
.card h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center}
.card .ex{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.ecr{display:flex;justify-content:space-between;gap:8px;font-size:13px;background:var(--soft);border-radius:8px;padding:6px 10px;font-weight:600}
.ecr span:last-child{color:var(--muted);font-weight:500}
.vocab tr.cur td{background:var(--hl)}
.tab tr.todo td{color:transparent}
.tab tr.cur td{background:var(--hl);font-weight:700}
.tab tr.cur td.am{color:var(--charge)}
.tab td.am{color:var(--charge)}.bil .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:2px 0}
.bil .row.sub{color:var(--passif)}
.bil .row.tot{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:4px}
.k-fac .t-head{color:var(--passif)}
.t-head{white-space:normal !important;line-height:1.2;overflow:visible !important;text-overflow:clip !important;hyphens:auto;-webkit-hyphens:auto}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){ .split{grid-template-columns:1fr} }

/* --- Bilan et journal --- */
.inv td.am{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.inv td.tg2,.inv td.acc{width:1%;white-space:nowrap}
@keyframes fadein{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.pill.a{background:var(--actif-bg);color:var(--actif)}.pill.p{background:var(--passif-bg);color:var(--passif)}
.pill.acc{background:var(--soft);color:var(--ink)}
.bl{display:grid;grid-template-columns:52px 1fr 1fr 52px;max-width:824px;margin:0 auto}
.bl-title{grid-row:1;grid-column:2/4}
.bl-head{grid-row:2}.bl-side{grid-row:3}.bt{grid-row:4}
.bl-head.a,.bl-side.a,.bt.ta{grid-column:2}.bl-head.p,.bl-side.p,.bt.tp{grid-column:3}
.ordv{grid-row:3;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 0;color:var(--accent);animation:fadein .6s ease-out}
.ordv.a{grid-column:1}.ordv.p{grid-column:4}
.ordv span{writing-mode:vertical-rl;font-size:16px;font-weight:700;white-space:nowrap}
.ordv i{flex:1;width:3px;background:var(--accent);min-height:20px}
.ordv b{font-size:18px;line-height:.7;margin-top:-4px}
.bl-title{text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;padding-bottom:4px}
.bl-head{font-weight:700;padding:4px 12px;border-bottom:3px solid var(--ink)}
.bl-head.a{color:var(--actif)}.bl-head.p{color:var(--passif);text-align:right}
.bl-side{padding:6px 12px 8px;display:flex;flex-direction:column;gap:2px;min-height:60px}
.bl-side.a{border-right:3px solid var(--ink)}
.br{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;padding:2px 4px;border-radius:4px}
.br.new{animation:pop 1.6s ease-out}
.br.cap{color:var(--res);font-weight:700}
.br.dec{color:var(--charge);font-weight:700}
.bt{display:flex;justify-content:space-between;font-weight:700;border-top:2px solid var(--ink);padding:4px 16px;font-variant-numeric:tabular-nums}
.bt.bad{color:var(--charge)}
.qa.off{opacity:.25}
.acct td.n{text-align:right;font-variant-numeric:tabular-nums}
.acct th.n{text-align:right}
.rule .pm{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);font-size:22px;font-weight:700}
.rule .pm span:first-child{border-right:2px solid var(--ink)}
.rule .pm small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.plus{color:var(--produit)}.case{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity .3s,box-shadow .3s}
.case.on{box-shadow:0 0 0 2px var(--accent)}.case.off{opacity:.4}
.rules.kg{margin-top:0}
.note{font-size:12px;color:var(--muted);margin-top:8px}
/* Inventaire : lignes plus basses, données ramenées vers le centre */
.inv-sec h2{margin-bottom:4px}
.inv{width:auto;margin:0 auto}
.inv td{padding:3px 8px;border-bottom:1px dashed #9c9282}
.inv td:first-child{padding-right:36px}
.inv td.tg2,.inv td.acc{width:auto}
/* Le problème des factures */
.fx h3{font-size:14px;margin:0 0 4px}
.fx .sit{font-size:13.5px;margin:10px 0 6px}
.fx .tg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.tnote{font-size:12.5px;font-weight:700;color:var(--passif);margin:4px 4px 0}
.tg.tw{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.tt2 .col{min-height:70px}
.ln.txt{display:block;font-size:13px;line-height:1.35;padding:4px 8px}
.ln.vf{font-style:italic;color:var(--produit);font-weight:600}
.ln.df{color:var(--charge)}
.cards.pv{grid-template-columns:1fr 1fr}
.cards.pv .card h4{margin:0 0 4px}
.case p{margin:0 0 8px;font-size:14.5px}
.t-sides .sg{font-weight:700}
.tab.jl th{text-align:left}
.tab.jl th:last-child{text-align:right}
.bl-side.p .bg.hl{color:var(--passif)}
.bl-side.dim,.bl-head.dim{opacity:.3}
.t-head{white-space:normal !important;line-height:1.2;overflow:visible !important;text-overflow:clip !important;hyphens:auto;-webkit-hyphens:auto}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="panel">
      <h1>Introduction à la compta</h1>
      <p class="sub">Le bilan, le résultat, les comptes et le journal.</p>
      <div class="dots" id="dots"></div>
    </div>

    <div class="panel" id="explain"></div>

    <div class="nav-wrap">
      <div class="nav">
        <button class="btn" id="prev">← Précédent</button>
        <button class="btn primary" id="next">Suite →</button>
      </div>
    </div>

    <div class="nav exit">
      <button class="btn quit" id="quit">Quitter</button>
    </div>
    <p class="note" id="quit-msg" style="display:none;color:#fff">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : fermer l'onglet.</p>
  </aside>

  <main class="stage" id="stage"></main>
</div>
<div class="zoombar"><button id="zm" title="Réduire la taille" aria-label="Réduire la taille">A−</button><button id="zp" title="Agrandir la taille" aria-label="Agrandir la taille">A+</button></div>

<script>
/* ---------- Réglages ---------- */
const Y = new Date().getFullYear();            // exercice = année en cours
const ANS = {};                                // réponses choisies, clé "étape.phase"
const fmt = n => { const neg=n<0; n=Math.abs(Math.round(n*100)/100); const [i,d]=n.toFixed(2).split('.');
  return (neg?'−':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,"'") + (d!=='00' ? '.'+d : ''); };
const $ = id => document.getElementById(id);

/* ---------- L'entreprise : un atelier de menuiserie ---------- */
// Inventaire dans le désordre (comme on le trouve dans l'atelier)
const INV = [
  {txt:'Une scie',                                         amt:2500, acc:'Machines',                 s:'A'},
  {txt:'Une raboteuse',                                    amt:2800, acc:'Machines',                 s:'A'},
  {txt:'Un compresseur',                                   amt:700,  acc:'Machines',                 s:'A'},
  {txt:'La facture du garagiste, pas encore payée',          amt:3200, acc:'Autres dettes',            s:'P'},
  {txt:'Les billets et les pièces dans le tiroir-caisse',    amt:500,  acc:'Caisse',                   s:'A'},
  {txt:'Les factures envoyées aux clients, pas encore payées', amt:2300, acc:'Créances clients',       s:'A'},
  {txt:'Le prêt de la banque, à rembourser dans 5 ans',      amt:4000, acc:'Crédit d\'investissement', s:'P'},
  {txt:'L\'argent sur le compte postal',                      amt:1200, acc:'Poste',                    s:'A'},
  {txt:'Le bureau',                                        amt:800,  acc:'Mobilier',                 s:'A'},
  {txt:'Les chaises',                                      amt:400,  acc:'Mobilier',                 s:'A'},
  {txt:'L\'armoire',                                        amt:300,  acc:'Mobilier',                 s:'A'}];
const AMT = {};  INV.forEach(i=>{ AMT[i.acc] = (AMT[i.acc]||0) + i.amt; });   // plusieurs éléments peuvent aller dans le même compte
const TA = INV.filter(i=>i.s==='A').reduce((s,i)=>s+i.amt,0);   // 11'500
const TD = INV.filter(i=>i.s==='P').reduce((s,i)=>s+i.amt,0);   // 7'200
const CAP = TA-TD;                                                // 4'300
AMT['Capital'] = CAP;

// Structure du bilan (ordre de liquidité / d'exigibilité)
const BA = [['Actifs circulants',['Caisse','Poste','Créances clients']],['Actifs immobilisés',['Machines','Mobilier']]];
const BP = [['Dettes à court terme',['Autres dettes']],['Dettes à long terme',['Crédit d\'investissement']],['Capitaux propres',['Capital']]];
const ACCS = ['Caisse','Poste','Créances clients','Machines','Mobilier','Autres dettes','Crédit d\'investissement','Capital'];
const KIND = a => ['Autres dettes','Crédit d\'investissement','Capital','Privé'].includes(a) ? 'passif'
  : ['Loyers','Frais d\'administration','Salaires'].includes(a) ? 'charge'
  : a.startsWith('Produits') ? 'produit' : 'actif';
const PLUS_D = a => ['actif','charge'].includes(KIND(a));   // augmente au débit

// Les opérations (N° 1 = solde à nouveau)
const OPS = [
  {n:2, dt:'15.01', d:'Autres dettes', c:'Caisse',           lib:'Paiement d\'une dette en espèces', amt:200},
  {n:3, dt:'05.03', d:'Machines',      c:'Autres dettes',    lib:'Achat d\'une machine à crédit',    amt:1200},
  {n:4, dt:'20.03', d:'Poste',         c:'Créances clients', lib:'Un client paie sa facture par poste', amt:800}];

/* ---------- Briques d'affichage ---------- */
function bilanHTML(o){
  // o : {a, p, cap, groups, order, fresh:'a'|'p'|'cap', title}
  const side = (G, show) => !show ? '' : G.map(([g,L])=>{
    const rows = L.filter(a=>a!=='Capital' || o.cap).map(a=>`<div class="br ${a==='Capital'?'cap':''} ${o.fresh===(a==='Capital'?'cap':(KIND(a)==='actif'?'a':'p'))?'new':''}"><span>${a}</span><span>${fmt(AMT[a])}</span></div>`).join('');
    const grp = G===BA ? (o.groups||o.groupsA) : (o.groups||o.groupsP);
    return rows ? (grp?`<div class="bg ${o.hl?'hl':''}">${g}</div>`:'') + rows : '';
  }).join('');
  const tA = o.a ? TA : 0, tP = (o.p?TD:0) + (o.cap?CAP:0), ok = tA===tP;
  return `<div class="bl"><div class="bl-title">${o.title||`Bilan au 1.1.${Y}`}</div>
    <div class="bl-head a">ACTIF<small>Avoirs : ce que l'entreprise possède${o.funds?'<br>Emploi des fonds':''}</small></div>
    <div class="bl-head p ${o.dimP?'dim':''}">PASSIF<small>Dettes : ce que l'entreprise doit${o.funds?'<br>Source des fonds':''}</small></div>
    ${o.order||o.orderA?'<div class="ordv a"><span>Ordre de liquidité</span><i></i><b>▼</b></div>':''}
    <div class="bl-side a">${side(BA,o.a)}</div>
    <div class="bl-side p ${o.dimP?'dim':''}">${side(BP,o.p)}</div>
    ${o.order||o.orderP?'<div class="ordv p"><span>Ordre d\'exigibilité</span><i></i><b>▼</b></div>':''}
    <div class="bt ta ${o.a&&o.p&&!ok?'bad':''}" style="border-right:3px solid var(--ink)"><span>Total</span><span>${o.a?fmt(tA):''}</span></div>
    <div class="bt tp ${o.a&&o.p&&!ok?'bad':''}"><span>Total</span><span>${o.p?fmt(tP):''}</span></div></div>`;
}

// Écritures passées dans les comptes : liste {acc, side, lb, amt, n, fresh}
function postings(nOps, extra){
  const L = ACCS.map(a=>({acc:a, side:KIND(a)==='actif'?'d':'c', lb:'sàn', amt:AMT[a], n:1}));
  OPS.slice(0,nOps).forEach(o=>{ L.push({acc:o.d, side:'d', lb:o.n, amt:o.amt, n:o.n}); L.push({acc:o.c, side:'c', lb:o.n, amt:o.amt, n:o.n}); });
  (extra||[]).forEach(e=>L.push(e));
  return L;
}
function tHTML(acc, L, focus){
  const act = PLUS_D(acc);
  const col = s => L.filter(l=>l.acc===acc && l.side===s).map(l=>`<div class="ln ${l.fresh?'fresh':''}"><span class="lb">${l.lb}</span><span class="am">${fmt(l.amt)}</span></div>`).join('');
  return `<div class="t k-${KIND(acc)} ${focus?'focus':''}">
    <div class="t-sides"><span>D <b class="sg ${act?'plus':'minus'}">${act?'+':'−'}</b></span><span class="t-head" title="${acc}">${acc}</span><span><b class="sg ${act?'minus':'plus'}">${act?'−':'+'}</b> C</span></div>
    <div class="t-body"><div class="col d">${col('d')}</div><div class="col c">${col('c')}</div></div></div>`;
}
const tGrid = (L, focus=[], accs=ACCS) => `<div class="tg">${accs.map(a=>tHTML(a, L, focus.includes(a))).join('')}</div>`;

function acctTable(acc, nOps){
  const act = KIND(acc)==='actif';
  const rows = [{n:1, dt:'01.01', lib:'Solde à nouveau', d:act?AMT[acc]:'', c:act?'':AMT[acc]}];
  OPS.slice(0,nOps).forEach(o=>{ if (o.d===acc) rows.push({n:o.n, dt:o.dt, lib:o.lib, d:o.amt, c:''}); if (o.c===acc) rows.push({n:o.n, dt:o.dt, lib:o.lib, d:'', c:o.amt}); });
  return `<table class="acct"><caption class="${act?'':'p'}" style="color:var(--${KIND(acc)})">${acc}</caption>
    <tr><th>N°</th><th>Date</th><th>Libellé (texte)</th><th class="n">Débit (${act?'+':'−'})</th><th class="n">Crédit (${act?'−':'+'})</th></tr>
    ${rows.map(r=>`<tr><td>${r.n}</td><td>${r.dt}</td><td>${r.lib}</td><td class="n">${r.d===''?'':fmt(r.d)}</td><td class="n">${r.c===''?'':fmt(r.c)}</td></tr>`).join('')}</table>`;
}

function journalHTML(nOps, cur){
  return `<table class="journal"><caption>Journal</caption><tr><th>N°</th><th>Date</th><th>Débit</th><th>Crédit</th><th class="am">Montant</th></tr>
    ${OPS.map((o,i)=>`<tr class="${i+1===cur?'cur':i+1>nOps?'todo':''}"><td>${o.n}</td><td class="dt">${o.dt}</td><td>${o.d}</td><td>${o.c}</td><td class="am">${fmt(o.amt)}</td></tr>`).join('')}</table>`;
}
function journalBig(nOps, cur){
  return `<table class="tab"><tr><th>N°</th><th>Date</th><th>Compte débité</th><th>Compte crédité</th><th>Libellé</th><th>Montant</th></tr>
    ${OPS.map((o,i)=>`<tr class="${i+1===cur?'cur':i+1>nOps?'todo':''}"><td>${o.n}</td><td style="text-align:left">${o.dt}</td><td style="text-align:left">${o.d}</td><td style="text-align:left">${o.c}</td><td style="text-align:left">${o.lib}</td><td>${fmt(o.amt)}</td></tr>`).join('')}</table>`;
}

/* Inventaire : ph = degré d'avancement, arrow = flèche animée, hl(i) = ligne surlignée */
const invHTML = (ph, arrow, hl) => `<section class="sec inv-sec"><h2>Inventaire au 1.1.${Y}</h2><table class="inv">
     ${ph>=3?`<tr class="invhead"><td></td><td></td><td></td><td class="acc"><span class="colbox">Comptes${arrow?'<span class="colarrow">↓</span>':''}</span></td></tr>`:''}
     ${INV.map(i=>`<tr class="${hl(i)?'hl':''}"><td>${i.txt}</td><td class="am">${fmt(i.amt)}</td>
       <td class="tg2">${ph>=2?`<span class="pill ${i.s==='A'?'a':'p'}">${i.s==='A'?'possède · actif':'doit · passif'}</span>`:''}</td>
       <td class="acc">${ph>=3?`<span class="pill acc">${i.acc}</span>`:''}</td></tr>`).join('')}</table></section>`;

/* ---------- Les étapes ---------- */
const QA = [
  ['Où trouve-t-on les règles de la comptabilité ?','Dans le <b>Code des obligations</b> (CO, art. 957 et suivants).'],
  ['Qui doit tenir une comptabilité ?','Les <b>personnes morales</b> (SA, Sàrl, coopérative) : toujours.<br>Les <b>entreprises individuelles</b> et les <b>sociétés de personnes</b> (p. ex. SNC) : dès un chiffre d\'affaires de plus de CHF 500\'000. En dessous, une comptabilité simplifiée (recettes, dépenses, patrimoine) suffit.'],
  ['Quels documents établir ?','Le <b>bilan</b> et le <b>compte de résultat</b>.'],
  ['À quelle fréquence ?','<b>Une fois par an</b>, généralement pour l\'année civile (du 1.1 au 31.12).']];

// Le problème des factures : l'exemple de l'imprimante (Infra. informatique)
const FX = [
  {part:'a', dt:'12.02', txt:'Le 12 février, on achète à crédit une imprimante pour un montant de CHF 550.', d:'Infra. informatique', c:'Autres dettes', lib:'Achat à crédit',
   opts:['Infra. informatique','Autres dettes','Banque'],
   fbD:'l\'imprimante est un <b>actif</b> : l\'avoir augmente au <b>débit</b>.',
   fbC:'la facture n\'est pas encore payée : la <b>dette augmente</b> au <b>crédit</b>.',
   notes:{'Infra. informatique':'L\'avoir augmente de 550 ↗','Autres dettes':'La dette augmente de 550 ↗'}},
  {part:'a', dt:'10.03', txt:'Le 10 mars, on paie par virement bancaire la facture de l\'imprimante, soit CHF 550. <b>La facture est déjà comptabilisée.</b>', d:'Autres dettes', c:'Banque', lib:'Paiement',
   opts:['Infra. informatique','Autres dettes','Banque'],
   fbD:'l\'imprimante est déjà comptée. La facture est dans les Autres dettes : on <b>diminue la dette</b> au <b>débit</b>.',

   notes:{'Infra. informatique':'L\'avoir augmente de 550 ↗','Banque':'L\'avoir en banque diminue de 550 ↘'}}];
const FX_ACC = ['Infra. informatique','Autres dettes','Banque'];
// Chaque cas = 2 phases : 2i = question du débit, 2i+1 = question du crédit
function fxPart(part, upto, ph){
  const cur = Math.floor(ph/2), sub = ph%2;                       // cas en cours, 0 = débit / 1 = crédit
  const E = FX.map((e,i)=>({...e, i})).filter(e=>e.part===part);
  const key = p => SI('Le problème des factures')+'.'+p;
  const shown = E.filter(e=>e.i<=cur);
  const dOK = e => ANS[key(2*e.i)], cOK = e => ANS[key(2*e.i+1)];   // débit / crédit trouvé
  const jr = `<table class="tab jl"><tr><th>Date</th><th>Compte à débiter</th><th>Compte à créditer</th><th>Libellé</th><th>Somme au débit</th><th>Somme au crédit</th></tr>
    ${shown.map(e=>{ const d = dOK(e), c = cOK(e); return `<tr class="${e.i===cur?'cur':''}"><td>${e.dt}</td><td style="text-align:left">${d?e.d:'…'}</td><td style="text-align:left">${c?e.c:'…'}</td><td style="text-align:left">${e.lib}</td><td>${d?'550':''}</td><td>${c?'550':''}</td></tr>`; }).join('')}</table>`;
  const L = [], fresh = [], notes = {};
  shown.forEach(e=>{
    const now = e.i===cur;
    if (dOK(e)){ const f = now && sub===0; L.push({acc:e.d, side:'d', lb:e.dt, amt:550, fresh:f}); if (f) fresh.push(e.d); if (now) notes[e.d] = e.notes[e.d]; }
    if (cOK(e)){ const f = now && sub===1; L.push({acc:e.c, side:'c', lb:e.dt, amt:550, fresh:f}); if (f) fresh.push(e.c); if (now) notes[e.c] = e.notes[e.c]; }
  });
  const ts = FX_ACC.map(a=>`<div>${tHTML(a, L, fresh.includes(a))}${notes[a] ? `<div class="tnote">${notes[a]}</div>` : ''}</div>`).join('');
  return `${shown.map(e=>`<p class="sit">${e.txt}</p>`).join('')}${jr}<div style="font-weight:600;font-size:13px;margin-top:10px">Écritures dans les comptes :</div><div class="tg3">${ts}</div>`;
}

function kStage(ph){
  const k = ph===0 ? -1 : Math.floor((ph-1)/4), st = ph===0 ? -1 : (ph-1)%4;   // opération en cours, sous-phase 0-3
  const doneJ = k<0 ? 0 : k, doneT = k<0 ? 0 : k + (st===3?1:0);              // écritures terminées au journal / reportées
  const o = OPS2[k];
  const row = k<0 ? null : {d: (o.first==='d'?st>=1:st>=2) ? o.d : '…', c: (o.first==='c'?st>=1:st>=2) ? o.c : '…'};
  const L = postings(3).filter(l=>ACCS2.includes(l.acc));
  OPS2.slice(0,doneT).forEach((x,i)=>{ const fr = st===3 && i===k;
    L.push({acc:x.d, side:'d', lb:x.n, amt:x.amt, fresh:fr}); L.push({acc:x.c, side:'c', lb:x.n, amt:x.amt, fresh:fr}); });
  const focus = k<0 ? [] : st===0 ? [] : st===1 ? [o[o.first]] : st===2 ? [o[o.first==='d'?'c':'d']] : [o.d, o.c];
  const tr = (x, cls='', r=x) => `<tr class="${cls}"><td>${x.n}</td><td style="text-align:left">${x.dt}</td><td style="text-align:left">${r.d}</td><td style="text-align:left">${r.c}</td><td style="text-align:left">${x.lib}</td><td>${fmt(x.amt)}</td></tr>`;
  const jr = `<table class="tab jl"><tr><th>N°</th><th>Date</th><th>Compte débité</th><th>Compte crédité</th><th>Libellé</th><th>Montant</th></tr>
    ${OPS2.slice(0,doneJ).map(x=>tr(x)).join('')}${row?tr(o,'cur',row):''}</table>`;
  return `<section class="sec"><h2>D'abord : le journal</h2>${jr}</section>
    <section class="sec"><h2>Ensuite : les comptes${k>=0&&st<3?' · pas encore reportée':''}</h2>${tGrid(L, focus, ACCS2)}</section>`;
}

}

 { title:'Le journal',
   ph:[{btn:'Nouvelle opération →', text:`Le <b>journal</b> enregistre toutes les opérations dans l'<b>ordre chronologique</b>. Pour chacune, on écrit le <b>compte débité</b>, puis le <b>compte crédité</b>, et le montant. On écrit « Autres dettes / Caisse ».<br><br>L'ordre est toujours le même : on écrit <b>d'abord au journal</b>, <b>puis on reporte</b> dans les comptes.<br><br>Les opérations 2 et 3 sont déjà écrites et reportées.`},
       {btn:'Suite →', text:`<b>20 mars</b> : un client paie sa facture par poste, CHF 800.<br><br>On cherche d'abord les <b>deux comptes touchés</b>. Ici <b>Poste</b> et <b>Créances clients</b>.`,
        q:{text:'1<sup>er</sup> compte touché : le compte <b>Poste</b> augmente ou diminue ?', opts:[['+','augmente'],['-','diminue']], ok:'+',
           fb:'l\'argent arrive sur le compte postal : la <b>Poste augmente</b>.'}},
       {btn:'Suite →', text:`Poste est un <b>actif</b> : il augmente au <b>débit</b>. C'est le <b>compte débité</b>.`,
        q:{text:'2<sup>e</sup> compte touché : le compte <b>Créances clients</b> augmente ou diminue ?', opts:[['+','augmente'],['-','diminue']], ok:'-',
           fb:'le client a payé, il nous doit 800 de moins : les <b>créances clients diminuent</b>.'}},
       {btn:'Reporter →', text:`Créances clients est un <b>actif</b> : il diminue au <b>crédit</b>. C'est le <b>compte crédité</b>.<br><br>L'écriture est complète dans le journal : <b>Poste / Créances clients</b> 800. Les comptes, eux, n'ont pas encore changé.`},
       {btn:'Suite →', text:`On <b>reporte</b> maintenant l'écriture dans les comptes : 800 au débit de la Poste, 800 au crédit des Créances clients.`}],
   stage: ph => {
     const o = OPS[2], row = ph===0 ? null : {d: ph>=2?o.d:'…', c: ph>=3?o.c:'…'};
     const L = postings(ph>=4?3:2).map(l=>({...l, fresh: ph>=4 && l.n===4}));
     const focus = ph===2 ? ['Poste'] : ph===3 ? ['Créances clients'] : ph>=4 ? ['Poste','Créances clients'] : [];
     const jr = `<table class="tab jl"><tr><th>N°</th><th>Date</th><th>Compte débité</th><th>Compte crédité</th><th>Libellé</th><th>Montant</th></tr>
       ${OPS.slice(0,2).map(x=>`<tr><td>${x.n}</td><td style="text-align:left">${x.dt}</td><td style="text-align:left">${x.d}</td><td style="text-align:left">${x.c}</td><td style="text-align:left">${x.lib}</td><td>${fmt(x.amt)}</td></tr>`).join('')}
       ${row?`<tr class="cur"><td>${o.n}</td><td style="text-align:left">${o.dt}</td><td style="text-align:left">${row.d}</td><td style="text-align:left">${row.c}</td><td style="text-align:left">${o.lib}</td><td>${fmt(o.amt)}</td></tr>`:''}</table>`;
     return `<section class="sec"><h2>D'abord : le journal</h2>${jr}</section>
       <section class="sec"><h2>Ensuite : les comptes${ph>=1&&ph<4?' · pas encore reportée':''}</h2>${tGrid(L, focus)}</section>`; } },

 { title:'Le problème des factures',
   ph: FX.flatMap((e,i)=>[
        {btn:'Suite →',
         text: i===0 ? `Les factures reviennent tout le temps. La question clé : la facture est-elle <b>déjà comptabilisée</b> ?<br><br>Exemple : Achat <b>à crédit</b> (= on ne paie pas!)`
             : i===1 ? `Un mois plus tard, on paie la facture.` : `Autre cas : la facture d'achat n'avait <b>pas été comptabilisée</b> le 12 février.`,
         q:{text:'Quel compte est débité ?', opts:e.opts.map(o=>[o,o]), ok:e.d, fb:e.fbD}},
        {btn: i<FX.length-1 ? 'Cas suivant →' : 'Suite →',
         text:`Le compte débité est <b>${e.d}</b> : 550 au débit.<br><br>Il reste à trouver le compte crédité.`,
         q:{text:'Quel compte est crédité ?', opts:e.opts.map(o=>[o,o]), ok:e.c, fb:e.fbC}}]),
   stage: ph => `<section class="sec fx"><h2>a) Écriture déjà comptabilisée</h2>${fxPart('a', 0, ph)}</section>
     ${ph>=4?`<section class="sec fx"><h2>b) Écriture non comptabilisée</h2>${fxPart('b', 0, ph)}</section>`:''}`,
   scroll:true },

 { title:'Les comptes de gestion', scroll:true,
   ph:[{btn:'Suite →', text:`Jusqu'ici, nous avons utilisé les <b>comptes du bilan</b> : les actifs (ce que l'entreprise possède) et les passifs (ce qu'elle doit).<br><br>Rappel : l'<b>actif</b> augmente au <b>débit</b>, le <b>passif</b> augmente au <b>crédit</b>.`},
       {btn:'Les principaux comptes →', text:`Pendant l'année, l'entreprise a aussi des <b>charges</b> (ce qu'elle consomme : salaires, loyer…) et des <b>produits</b> (ce qu'elle gagne avec son travail). Ce sont les <b>comptes de gestion</b>. Ils forment le <b>compte de résultat</b>.<br><br>• Les <b>charges</b> augmentent au <b>débit</b> (+), à gauche.<br>• Les <b>produits</b> augmentent au <b>crédit</b> (+), à droite.`},
       {btn:'Suite →', text:`Les principaux comptes de charges sont à gauche.<br><br>À droite, deux produits : les <b>honoraires</b> (ce que gagne une entreprise de services : avocat, fiduciaire, médecin…) et les <b>produits financiers</b> (les intérêts reçus).`},
       {btn:'Suite →', text:`Les autres comptes de produits dépendent de l'<b>activité</b> de l'entreprise : chacune nomme ses produits selon ce qu'elle fait.`}],
   stage: ph => {
     const rule = (t, col, plusD) => `<div class="rule"><h4 style="color:var(--${col})">${t}</h4><div class="pm">${plusD
       ? '<span class="plus">+<small>débit</small></span><span class="minus">−<small>crédit</small></span>'
       : '<span class="minus">−<small>débit</small></span><span class="plus">+<small>crédit</small></span>'}</div></div>`;
     const row = (t, cls='', sub='') => `<div class="br ${cls}"><span>${t}${sub?` <small style="color:var(--muted)">(${sub})</small>`:''}</span></div>`;
     let h = `<section class="sec"><h2>Les comptes du bilan</h2><div class="rules">${rule('ACTIFS','actif',true)}${rule('PASSIFS','passif',false)}</div>
       ${ph>=1?`<h2 style="margin-top:16px">Les comptes de gestion</h2><div class="rules kg">${rule('CHARGES','charge',true)}${rule('PRODUITS','produit',false)}</div>`:''}</section>`;
     if (ph>=2) h += `<section class="sec"><h2>Les principaux comptes de gestion</h2>
       <div class="bl" style="grid-template-columns:0 1fr 1fr 0"><div class="bl-title">Compte de résultat</div>
       <div class="bl-head a" style="color:var(--charge)">CHARGES</div><div class="bl-head p" style="color:var(--produit)">PRODUITS</div>
       <div class="bl-side a">${CHARGES.map(c=>row(c)).join('')}</div>
       <div class="bl-side p">${PRODUITS.map(c=>row(c)).join('')}
         ${ph>=3?`<div class="bg" style="margin-top:8px">Selon l'activité de l'entreprise</div>${PRODUITS_ACT.map(([c,a])=>row(c, ph===3?'new':'', a)).join('')}`:''}</div></div>
       <div class="note">* papier, stylos, matériel de bureau &nbsp;·&nbsp; ** perte de valeur des immobilisations</div></section>`;
     return h; } },

 { title:'Journalisation', ph:K_PH, stage:kStage },

 { title:'Le compte privé',
   ph:[{btn:'Suite →', text:`Dans une <b>entreprise individuelle</b>, le patrimoine privé du propriétaire et celui de l'entreprise se mélangent facilement.<br><br>Il faut séparer ses <b>opérations personnelles</b> (p. ex. un prélèvement dans la caisse pour un usage privé) des <b>opérations commerciales</b> (p. ex. l'achat de marchandises destinées à la vente). On utilise pour cela le compte <b>Privé</b>.`},
       {btn:'Le débit →', text:`Le compte Privé est un <b>compte de passif</b> : c'est un <b>sous-compte du Capital</b>.`,
        q:{text:'Le compte Privé augmente…', opts:[['d','au débit'],['c','au crédit']], ok:'c',
           fb:'comme tout passif, il <b>augmente au crédit</b> et diminue au débit.'}},
       {btn:'Le crédit →', text:`Au <b>débit</b> (−) : tout ce que le propriétaire <b>prend</b> dans l'entreprise.<br><br>• les <b>prélèvements personnels</b>, en liquidités ou en nature (p. ex. il emporte des marchandises) ;<br>• les <b>factures privées</b> payées par l'entreprise.`},
       {btn:'Le solde →', text:`Au <b>crédit</b> (+) : ce que l'entreprise <b>doit</b> au propriétaire.<br><br>• son <b>salaire</b> : la rémunération de son travail ;<br>• les <b>intérêts sur le capital</b> : la rémunération du capital qu'il a investi ;<br>• le <b>bénéfice</b> : la rémunération du risque d'entreprise.`},
       {btn:'Le compte Capital →', text:`Le solde du compte Privé s'appelle la <b>variation de fortune</b> (VF).<br><br>À la clôture, il est <b>viré au compte Capital</b>.`},
       {btn:'Un exemple →', text:`Dans le compte Capital :<br><br>• si le propriétaire a reçu <b>plus</b> qu'il n'a pris, sa fortune augmente : <b>AF</b> (augmentation de fortune), au crédit ;<br>• s'il a pris <b>plus</b> qu'il n'a reçu, sa fortune diminue : <b>DF</b> (diminution de fortune), au débit.`},
       {btn:'Suite →', text:`Pendant l'année, le propriétaire a prélevé <b>48'000</b>. Au crédit du Privé : salaire 40'000, intérêts 2'000, bénéfice 9'000, soit <b>51'000</b>.`,
        q:{text:'Sa fortune augmente ou diminue ?', opts:[['+','augmente (AF)'],['-','diminue (DF)']], ok:'+',
           fb:`il a reçu 51'000 et pris 48'000 : sa fortune <b>augmente de 3'000</b>. Écriture : <b>Privé / Capital</b> 3'000.`}}],
   stage: ph => {
     const D = [], C = [], K = {d:[], c:[{t:'Sàn'}]};
     if (ph>=2) D.push({t:'Prélèvements personnels (en liquidités ou en nature)', cls:ph===2?'fresh':''}, {t:'Factures privées payées par l\'entreprise', cls:ph===2?'fresh':''});
     if (ph>=3) C.push({t:'Salaire du propriétaire', cls:ph===3?'fresh':''}, {t:'Intérêts sur le capital investi', cls:ph===3?'fresh':''}, {t:'<b>Bénéfice (BN)</b>', cls:ph===3?'fresh':''});
     if (ph>=4) { D.push({t:'Variation de fortune virée à Capital (VF)', cls:'vf '+(ph===4?'fresh':'')}); C.push({t:'Variation de fortune virée à Capital (VF)', cls:'vf df '+(ph===4?'fresh':'')}); }
     if (ph>=5) { K.d.push({t:'DF (diminution)', cls:'vf df '+(ph===5?'fresh':'')}, {t:'Spb'}); K.c.push({t:'AF (augmentation)', cls:'vf '+(ph===5?'fresh':'')}); }
     const ex = ph>=6 ? `<section class="sec"><h2>Exemple</h2><div class="tg tw">
         ${tHTML('Privé', [{acc:'Privé',side:'d',lb:'prél.',amt:48000},{acc:'Privé',side:'c',lb:'salaire',amt:40000},{acc:'Privé',side:'c',lb:'intérêts',amt:2000},{acc:'Privé',side:'c',lb:'BN',amt:9000},
           ...(ANS[SI('Le compte privé')+'.6'] ? [{acc:'Privé',side:'d',lb:'VF',amt:3000,fresh:true}] : [])])}
         ${tHTML('Capital', [{acc:'Capital',side:'c',lb:'sàn',amt:CAP}, ...(ANS[SI('Le compte privé')+'.6'] ? [{acc:'Capital',side:'c',lb:'AF',amt:3000,fresh:true}] : [])])}</div></section>` : '';
     return `<section class="sec"><h2>Opérations personnelles ou commerciales</h2><div class="cards pv">
         <div class="card"><h4>Opération personnelle</h4><div class="ex">Salaire du propriétaire.<p>Prélèvement à la caisse pour un usage personnel.</div><div class="ecr"><span>→ compte Privé</span></div></div>
         <div class="card"><h4>Opération commerciale</h4><div class="ex">Achat de marchandises destinées à la vente.<p>Loyer des locaux commerciaux.</div><div class="ecr"><span>→ comptes de l'entreprise</span></div></div></div></section>
       ${ph>=1?`<section class="sec"><h2>Le compte privé</h2><div class="tg tw">${tTxt('Privé', D, C)}${ph>=5?tTxt('Capital', K.d, K.c):''}</div></section>`:''}${ex}`; },
   scroll:true }
];
const LAST = STEPS.length-1;
const SI = t => STEPS.findIndex(x=>x.title===t);   // index d'une partie d'après son titre

/* ---------- Actions ---------- */
const A = [];
STEPS.forEach((s,i)=>s.ph.forEach((_,p)=>A.push({step:i, ph:p})));
let pos = 0;

/* ---------- Rendu ---------- */
function qBox(key, q){
  const ch = ANS[key];
  const btn = (a,lb) => `<button class="ch ${ch===a?(a===q.ok?'ok':'ko'):''} ${ch?'':'blink'}" data-a="${a}" ${ch?'disabled':''}>${lb}</button>`;
  const fb = ch ? `<div class="fb ${ch===q.ok?'ok':'ko'}">${ch===q.ok?'✓ En effet':'✗ En fait'}, ${q.fb}</div>` : `<div class="hint">Cliquer sur la bonne réponse.</div>`;
  return `<div class="calc q"><div style="font-weight:600;margin-bottom:4px">La question à se poser</div>${q.text}
    <div class="choices" style="flex-wrap:wrap">${q.opts.map(([a,lb])=>btn(a,lb)).join('')}</div>${fb}</div>`;
}
const LET = i => String.fromCharCode(65+i);   // A, B, C…
function render(){
  pos = Math.max(0, Math.min(A.length-1, pos));
  const {step, ph} = A[pos], S = STEPS[step], P = S.ph[ph], key = step+'.'+ph;
  document.querySelectorAll('.dot').forEach((b,i)=>{ b.classList.toggle('cur', i===step); b.classList.toggle('done', i<step); });
  $('prev').disabled = pos===0;
  $('next').disabled = pos===A.length-1 || (P.q && !ANS[key]);
  $('next').textContent = pos===A.length-1 ? 'Terminé ✓' : P.btn;
  $('explain').innerHTML = `<h2 class="steptitle">${LET(step)}. ${S.title}</h2>
    <p class="steptext">${P.text}</p>${P.q?qBox(key,P.q):''}${S.extra?S.extra(ph):''}${S.entry!==undefined ? lastEntry(S.entry,ph) : ''}`;
  $('stage').innerHTML = S.stage(ph);
  if (S.scroll && ph>0){ const secs = $('stage').querySelectorAll('section.sec'); requestAnimationFrame(()=>{ const el = secs[secs.length-1]; if (el.getBoundingClientRect().bottom > innerHeight) el.scrollIntoView({block:'end', behavior:'smooth'}); })   /* remonte seulement si le bas est caché */; }
}
// « Une opération, deux comptes » et « Un achat à crédit » : l'écriture se construit au fil des réponses
function lastEntry(k, ph){   // k : 0 = opération 2 (crédit trouvé d'abord), 1 = opération 3 (débit d'abord)
  const o = OPS[k];
  const dd = k===0 ? (ph>=2 ? o.d : '…') : (ph>=1 ? o.d : '…');
  const cc = k===0 ? (ph>=1 ? o.c : '…') : (ph>=2 ? o.c : '…');
  return `<table class="journal"><caption>Écriture</caption><tr><th>N°</th><th>Débit</th><th>Crédit</th><th class="am">Montant</th></tr>
    <tr class="cur"><td>${o.n}</td><td>${dd}</td><td>${cc}</td><td class="am">${fmt(o.amt)}</td></tr></table>`;
}

/* ---------- Navigation ---------- */
function goTo(p){ pos = p; render(); }
function goStep(s){ goTo(A.findIndex(a=>a.step===s)); }
let Z = 1;
try { Z = +localStorage.getItem('bilanjournal-zoom') || 1; } catch(e){}
function applyZoom(){
  Z = Math.round(Math.max(0.8, Math.min(1.6, Z))*10)/10;
  document.documentElement.style.setProperty('--z', Z);
  try { localStorage.setItem('bilanjournal-zoom', Z); } catch(e){}
}
$('dots').innerHTML = STEPS.map((s,i)=>`<button class="dot" data-s="${i}" title="${LET(i)}. ${s.title}" aria-label="${LET(i)}. ${s.title}"></button>`).join('');
$('zm').addEventListener('click', ()=>{ Z -= 0.1; applyZoom(); });
$('zp').addEventListener('click', ()=>{ Z += 0.1; applyZoom(); });
$('next').addEventListener('click', ()=>goTo(pos+1));
$('prev').addEventListener('click', ()=>goTo(pos-1));
$('explain').addEventListener('click', e=>{ const b=e.target.closest('.ch'); if (!b || b.disabled) return; const {step,ph}=A[pos]; ANS[step+'.'+ph] = b.dataset.a; render(); });
$('quit').addEventListener('click', ()=>{ window.close(); setTimeout(()=>{ $('quit-msg').style.display='block'; }, 300); });
$('dots').addEventListener('click', e=>{ const b=e.target.closest('.dot'); if (b) goStep(+b.dataset.s); });
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' && !$('next').disabled) goTo(pos+1);
  if (e.key==='ArrowLeft') goTo(pos-1);
});
render();
applyZoom();
</script>
<script src="theorie.js"></script>
</body>
</html>
