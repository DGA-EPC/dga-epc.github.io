<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seuil de rentabilité – théorie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theorie.css">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1e2226; --muted:#6a6f76; --line:#e2ddd2; --soft:#efebe3;
  --charge:#c2671f; --charge-bg:#fcefe3;
  --produit:#2b8352; --produit-bg:#e6f4eb;
  --res:#6d48b3; --res-bg:#efe9f9;
  --passif:#a3333d; --passif-bg:#f8e8ea;
  --bilan:#20394f; --bilan-bg:#e6ecf1;
  --actif:#2a52be; --actif-bg:#e8eefb;
  --accent:#c98a10; --accent-bg:#fff3d6;
}
.calc.q{background:var(--bilan-bg)}
.ch.ko{background:var(--charge);border-color:var(--charge);color:#fff;opacity:1}
.fb.ko{border-left:4px solid var(--charge)}
.ch.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(32,57,79,0)}50%{box-shadow:0 0 0 5px rgba(201,138,16,.75);background:var(--accent-bg)}}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:14px}
.donnee{font-size:14.5px;background:#f6f3ec;border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px}
.steps3{display:flex;flex-direction:column;gap:4px;max-width:620px}
.steps3 .calc{margin:6px 0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;text-align:center}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 6px 2px}
.frac>span:last-child{padding:2px 6px 0}
.calc .row.fr{align-items:center}
.rems{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;max-width:760px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h4{margin:0 0 6px;font-size:15px}
.card ul{margin:0;padding-left:18px;font-size:14px}
.card.cv h4{color:var(--charge)}.card.ff h4{color:var(--passif)}

/* Couleurs des grandeurs */
.c-can{color:var(--actif)}.c-pramv{color:var(--charge)}.c-bb{color:var(--produit)}.c-ff{color:var(--passif)}.c-bn{color:var(--res)}

/* Compte de résultat */
.cr{width:100%;max-width:760px;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.cr .cr-title{text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:17px;padding:0 0 4px;border-bottom:2px solid var(--ink)}
.cr td{padding:3px 8px;vertical-align:top}
.cr td.am{text-align:right;white-space:nowrap;width:1%}
.cr td.am.l{border-right:2px solid var(--ink)}
.cr td.k{font-weight:700}
.cr td.tot{border-top:1px solid var(--ink);font-weight:700}
.cr td.lb.tot{border-top:0}
.cr .tg2{font-size:11px;font-weight:700;margin-left:6px}
.cr td.bg-can{background:#e2efda}.cr td.bg-pramv{background:#fff2cc}.cr td.bg-ff{background:#ddebf7}

/* Schéma CAN − PRAMV = BB − FF = BN */
.sch{border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums;min-width:min(100%,460px)}
.sch th{color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;padding:4px 12px;border-bottom:2px solid var(--ink)}
.sch th:first-child{text-align:left}
.sch td{padding:5px 12px;border-bottom:1px dashed var(--line);text-align:right;white-space:nowrap}
.sch td:first-child{text-align:left;font-weight:600}
.sch tr.eq td{border-top:1.5px solid var(--ink)}
.sch td.ar{color:var(--accent);font-weight:700;text-align:center;padding:5px 2px}
.sch td.seuil{background:var(--accent-bg);font-weight:700}
.sch td.pc{color:var(--muted)}
.sch td.new{animation:pop 1.4s ease-out}
.sch td.qm{color:var(--accent);font-weight:700}

/* Graphique */
.gwrap{max-width:820px}
.graph{width:100%;height:auto;display:block;font-family:Inter,sans-serif}
.graph .grid line{stroke:#e8e3d8;stroke-width:1}
.graph .axis{stroke:var(--ink);stroke-width:1.6}
.graph .tick{font-size:11px;fill:var(--muted)}
.graph .lab{font-size:12.5px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.graph .badge{font-size:12.5px;font-weight:700;fill:#fff}
.graph .ln{stroke-width:3;fill:none;stroke-linecap:round}
.graph .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease forwards}
.graph .draw.late{animation-delay:.2s}
.graph .fade{animation:fade .8s ease both}
.graph .fade.late{animation-delay:1.2s}
.graph .fade.later{animation-delay:2.6s}
.graph .slide{animation:slide 1.6s cubic-bezier(.4,0,.2,1) 1.1s both}
.graph .ghost{stroke-dasharray:6 5;opacity:.55}
.graph .arw{stroke-width:2;fill:none}
.graph .arw.grow{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(var(--dy))}to{transform:none}}

@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:12px 12px 90px}
  aside{position:static;max-height:none;overflow:visible}
  .nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(245,243,238,.95);backdrop-filter:blur(6px);padding:10px 12px;border-top:1px solid var(--line)}
  .cr{grid-template-columns:1fr}.cr-side.l{border-right:0;border-bottom:2px solid var(--ink)}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="panel">
      <h1>Seuil de rentabilité</h1>
      <p class="sub">Bénéfice brut · Marge · Coûts fixes et coûts variables · Graphique · Calcul du point mort</p>
      <div class="dots" id="dots"></div>
    </div>

    <div class="panel" id="explain"></div>

    <div class="nav-wrap">
      <div class="nav">
        <button class="btn" id="prev">← Précédent</button>
        <button class="btn primary" id="next">Suite →</button>
      </div>
    </div>

    <div class="nav exit">
      <button class="btn quit" id="quit">Quitter</button>
    </div>
    <p class="note" id="quit-msg" style="display:none;color:#fff">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : fermer l'onglet.</p>
  </aside>

  <main class="stage" id="stage"></main>
</div>
<div class="zoombar"><button id="zm" title="Réduire la taille" aria-label="Réduire la taille">A−</button><button id="zp" title="Agrandir la taille" aria-label="Agrandir la taille">A+</button></div>

<script>
/* ---------- Réglages ---------- */
const ANS = {};
let ANSWERED = false;
const fmt = n => { const neg=n<0; n=Math.abs(Math.round(n*100)/100); const [i,d]=n.toFixed(2).split('.');
  return (neg?'−':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,"'") + (d!=='00' ? '.'+d : ''); };
const $ = id => document.getElementById(id);
const frac = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const TIERS = '33&nbsp;⅓&nbsp;%', T133 = '133&nbsp;⅓&nbsp;%';

/* ---------- Compte de résultat ---------- */
// rows : [libellé, montant, classe, étiquette] ; gauche et droite ligne à ligne (tableau : alignement garanti)
const crCells = (r, side) => { if (!r) return `<td class="lb ${side}"></td><td class="am ${side}"></td>`;
  const [lb,a,k,tg] = r, m = (tg ? tg[1] : (k||'')).match(/c-(can|pramv|ff)\b/), bg = m ? `bg-${m[1]}` : '';
  return `<td class="lb ${side} ${k||''} ${bg}">${lb}</td><td class="am ${side} ${k||''} ${bg}">${a==null?'':fmt(a)}</td>`; };
const crHTML = (title, L, R) => `<div style="overflow-x:auto"><table class="cr"><tr><th colspan="4" class="cr-title">${title}</th></tr>
  ${L.map((l,i)=>`<tr>${crCells(l,'l')}${crCells(R[i],'r')}</tr>`).join('')}</table></div>`;

/* ---------- Schéma en liste ---------- */
// cols : en-têtes ; rows : {lb, cls, eq, c:[cellules]} ; cellule = nombre, texte, '' (vide) ou {v, k}
const cell = x => { if (x==null || x==='') return '<td></td>';
  const o = typeof x==='object' ? x : {v:x};
  return `<td class="${o.k||''}">${typeof o.v==='number'?fmt(o.v):o.v}</td>`; };
const sch = (cols, rows) => `<div style="overflow-x:auto"><table class="sch"><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>
  ${rows.map(r=>`<tr class="${r.eq?'eq':''}"><td class="${r.cls||''}">${r.lb}</td>${r.c.map(cell).join('')}</tr>`).join('')}</table></div>`;
const L5 = ['CAN','− PRAMV','= Bénéfice brut','− Coûts fixes','= Bénéfice net'], C5 = ['c-can','c-pramv','c-bb','c-ff','c-bn'];
const rows5 = cells => L5.map((lb,i)=>({lb, cls:C5[i], eq:i===2||i===4, c:cells[i]}));
// cellule du seuil : mise en évidence, animée à la phase où elle apparaît
const S = (v, show, isNew) => show ? {v, k:'seuil'+(isNew?' new':'')} : '';
const AR = show => show ? {v:'⇒', k:'ar'} : '';

/* ---------- Données ---------- */
const CR = {ventes:83000, dedAcc:2000, pertes:3000, achats:50000, fraisA:1000, dedObt:3000, prestP:2000, varS:6000,
            sal:12000, loyers:4000, amort:1000, ace:5000};
CR.can = CR.ventes-CR.dedAcc-CR.pertes; CR.pramv = CR.achats+CR.fraisA-CR.dedObt-CR.prestP+CR.varS;
CR.bb = CR.can-CR.pramv; CR.ff = CR.sal+CR.loyers+CR.amort+CR.ace; CR.bn = CR.bb-CR.ff;
const M1 = {can:CR.can, pramv:CR.pramv, bb:CR.bb, ff:CR.ff, bn:CR.bn}; M1.sCan = M1.can*M1.ff/M1.bb; M1.sPramv = M1.sCan-M1.ff;
const M2 = {can:80000, taux:25, ff:24000}; M2.sCan = M2.ff*100/M2.taux; M2.sPramv = M2.sCan-M2.ff; M2.bnAct = M2.can*M2.taux/100-M2.ff;
const M3 = {can:90000, ff:24000}; M3.sCan = M3.ff*(400/3)/(100/3); M3.sPramv = M3.sCan-M3.ff;
const PO = {pv:18.75, cv:8.75, ff:800}; PO.bb = PO.pv-PO.cv; PO.q = PO.ff/PO.bb; PO.seuil = PO.q*PO.pv;

/* ---------- Graphique (poulets) ---------- */
const G = {qmax:120, ymax:2500, x0:70, x1:610, y0:380, y1:30};
const XT = Array.from({length:13},(_,i)=>i*10), YT = Array.from({length:11},(_,i)=>i*250);
const gx = q => G.x0 + q*(G.x1-G.x0)/G.qmax;
const gy = v => G.y0 - v*(G.y0-G.y1)/G.ymax;
const COL = {can:'#2a52be', ff:'#a3333d', cv:'#c2671f', ct:'#6d48b3', bb:'#2b8352'};
const CA = q => PO.pv*q, CV = q => PO.cv*q, CT = q => PO.ff+PO.cv*q;
function graphHTML(ph){
  const an = (i, cls) => ph===i ? cls : '';
  const seg = (q1,v1,q2,v2,col,cls='',extra='') => `<line x1="${gx(q1)}" y1="${gy(v1)}" x2="${gx(q2)}" y2="${gy(v2)}" stroke="${col}" class="ln ${cls}" pathLength="1" ${extra}/>`;
  const lab = (q,v,txt,col,cls='',anchor='start',dx=6,dy=4) => `<text x="${gx(q)+dx}" y="${gy(v)+dy}" fill="${col}" class="lab ${cls}" text-anchor="${anchor}">${txt}</text>`;
  const varrow = (q,v1,v2,col,cls='',dx=0,both=false) => `<line x1="${gx(q)+dx}" y1="${gy(v1)}" x2="${gx(q)+dx}" y2="${gy(v2)}" stroke="${col}" class="arw ${cls}" pathLength="1" marker-end="url(#ah-${col.slice(1)})" ${both?`marker-start="url(#ahs-${col.slice(1)})"`:''}/>`;
  let s = '';
  // grille et axes
  s += `<g class="grid">${XT.map(q=>`<line x1="${gx(q)}" y1="${G.y1}" x2="${gx(q)}" y2="${G.y0}"/>`).join('')}
        ${YT.filter(v=>v>0).map(v=>`<line x1="${G.x0}" y1="${gy(v)}" x2="${G.x1}" y2="${gy(v)}"/>`).join('')}</g>`;
  s += XT.filter(q=>ph<5 || Math.abs(q-PO.q)>=6).map(q=>`<text class="tick" x="${gx(q)}" y="${G.y0+17}" text-anchor="middle">${q}</text>`).join('');
  s += YT.filter(v=>ph<5 || Math.abs(v-PO.seuil)>=120).map(v=>`<text class="tick" x="${G.x0-8}" y="${gy(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('');
  s += `<line class="axis" x1="${G.x0}" y1="${G.y0}" x2="${G.x1+8}" y2="${G.y0}" marker-end="url(#ah-1e2226)"/><line class="axis" x1="${G.x0}" y1="${G.y0}" x2="${G.x0}" y2="${G.y1-10}" marker-end="url(#ah-1e2226)"/>`;
  s += `<text class="tick" x="${G.x0-8}" y="${G.y1-14}" text-anchor="end" style="font-weight:700;fill:#1e2226">CHF</text>
        <text class="tick" x="${G.x1+10}" y="${G.y0+32}" text-anchor="end" style="font-weight:700;fill:#1e2226">quantité (poulets)</text>`;
  // zones (sous les droites)
  if (ph>=6) s += `<polygon points="${gx(0)},${gy(0)} ${gx(0)},${gy(PO.ff)} ${gx(PO.q)},${gy(PO.seuil)}" fill="${COL.ff}" fill-opacity=".16" class="${an(6,'fade')}"/>
        <text x="${gx(16)}" y="${gy(560)}" fill="${COL.ff}" class="lab ${an(6,'fade')}" text-anchor="middle">zone de</text><text x="${gx(16)}" y="${gy(560)+15}" fill="${COL.ff}" class="lab ${an(6,'fade')}" text-anchor="middle">perte nette</text>`;
  if (ph>=7) s += `<polygon points="${gx(PO.q)},${gy(PO.seuil)} ${gx(120)},${gy(CA(120))} ${gx(120)},${gy(CT(120))}" fill="${COL.bb}" fill-opacity=".18" class="${an(7,'fade')}"/>
        <text x="${gx(104)}" y="${gy(2060)}" fill="${COL.bb}" class="lab ${an(7,'fade')}" text-anchor="end">zone de bénéfice net</text>`;
  // 1. chiffre d'affaires
  if (ph>=1) s += seg(0,0,120,CA(120),COL.can,an(1,'draw')) + lab(120,CA(120),'CAN',COL.can,an(1,'fade late'));
  // 2. coûts fixes
  if (ph>=2) s += seg(0,PO.ff,120,PO.ff,COL.ff,an(2,'draw')) + lab(120,PO.ff,'coûts fixes',COL.ff,an(2,'fade late'),'start',6,14);
  // 3. coûts variables
  if (ph>=3) s += seg(0,0,120,CV(120),COL.cv,an(3,'draw')) + lab(120,CV(120),'Coûts variables',COL.cv,an(3,'fade late'));
  // 4. coûts totaux = coûts variables déplacés de la hauteur des coûts fixes
  const showCT = ph>4 || (ph===4 && ANSWERED);
  if (ph===4 && ANSWERED){
    const dy = gy(0)-gy(PO.ff);
    s += [10,45,80,115].map(q=>varrow(q,CV(q),CT(q),COL.ct,'grow')).join('');
    s += [10,45,80,115].map(q=>`<text x="${gx(q)+5}" y="${(gy(CV(q))+gy(CT(q)))/2+4}" fill="${COL.ct}" class="lab fade" style="font-size:11px">+ ${fmt(PO.ff)}</text>`).join('');
    s += seg(0,0,120,CV(120),COL.ct,'ghost');
    s += `<g class="slide" style="--dy:${dy}px">${seg(0,PO.ff,120,CT(120),COL.ct)}</g>`;
    s += lab(120,CT(120),'Coûts totaux',COL.ct,'fade later');
  } else if (showCT) s += seg(0,PO.ff,120,CT(120),COL.ct) + lab(120,CT(120),'Coûts totaux',COL.ct);
  // 5. seuil de rentabilité
  if (ph>=5){ const c = an(5,'fade');
    s += `<line x1="${gx(PO.q)}" y1="${gy(PO.seuil)}" x2="${gx(PO.q)}" y2="${G.y0}" stroke="#1e2226" stroke-dasharray="4 4" class="${c}"/>
      <line x1="${G.x0}" y1="${gy(PO.seuil)}" x2="${gx(PO.q)}" y2="${gy(PO.seuil)}" stroke="#1e2226" stroke-dasharray="4 4" class="${c}"/>
      <circle cx="${gx(PO.q)}" cy="${gy(PO.seuil)}" r="7" fill="#c98a10" stroke="#fff" stroke-width="2" class="${c}"/>
      <text x="${gx(PO.q)-12}" y="${gy(PO.seuil)-12}" class="lab ${c}" text-anchor="end" fill="#1e2226">seuil de rentabilité</text>
      <rect x="${gx(PO.q)-17}" y="${G.y0+4}" width="34" height="19" rx="5" fill="#c98a10" class="${c}"/><text x="${gx(PO.q)}" y="${G.y0+18}" text-anchor="middle" class="badge ${c}">${PO.q}</text>
      <rect x="${G.x0-54}" y="${gy(PO.seuil)-10}" width="48" height="19" rx="5" fill="#c98a10" class="${c}"/><text x="${G.x0-30}" y="${gy(PO.seuil)+4}" text-anchor="middle" class="badge ${c}">${fmt(PO.seuil)}</text>`;
  }
  // 9. droite du bénéfice brut : croise les coûts fixes exactement à la quantité au seuil
  if (ph>=9){ const c = an(9,'draw'), c2 = an(9,'fade late');
    s += seg(0,0,120,PO.bb*120,COL.bb,c) + lab(120,PO.bb*120,'Bénéfice brut',COL.bb,c2);
    s += `<line x1="${gx(PO.q)}" y1="${gy(PO.ff)}" x2="${gx(PO.q)}" y2="${G.y0}" stroke="${COL.bb}" stroke-width="2" stroke-dasharray="4 3" class="${c2}"/>
      <circle cx="${gx(PO.q)}" cy="${gy(PO.ff)}" r="7" fill="${COL.bb}" stroke="#fff" stroke-width="2" class="${c2}"/>
      <text x="${gx(PO.q)+12}" y="${gy(PO.ff)+20}" fill="${COL.bb}" class="lab ${c2}">BB = FF</text>`;
  }
  // 8. bénéfice brut à 100 poulets
  if (ph>=8){ const q = 100, c = an(8,'fade'), c2 = an(8,'fade late');
    s += `<line x1="${gx(q)}" y1="${gy(CV(q))}" x2="${gx(q)}" y2="${gy(CA(q))}" stroke="#1e2226" stroke-dasharray="3 4" class="${c}"/>`;
    s += `<g class="${c}">${varrow(q,CV(q),CA(q),COL.bb,'',14,true)}</g><text x="${gx(q)+22}" y="${(gy(CV(q))+gy(CA(q)))/2+4}" fill="${COL.bb}" class="lab ${c}">BB ${fmt(PO.bb*q)}</text>`;
    s += `<g class="${c2}">${varrow(q,CV(q),CT(q),COL.ff,'',-10,true)}${varrow(q,CT(q),CA(q),COL.ct,'',-10,true)}</g>
      <text x="${gx(q)-18}" y="${(gy(CV(q))+gy(CT(q)))/2+4}" fill="${COL.ff}" class="lab ${c2}" text-anchor="end">FF ${fmt(PO.ff)}</text>
      <text x="${gx(q)-18}" y="${(gy(CT(q))+gy(CA(q)))/2+4}" fill="${COL.ct}" class="lab ${c2}" text-anchor="end">BN ${fmt(CA(q)-CT(q))}</text>`;
  }
  const mk = c => `<marker id="ah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#${c}"/></marker>
    <marker id="ahs-${c}" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#${c}"/></marker>`;
  return `<svg class="graph" viewBox="0 0 740 420" role="img" aria-label="Graphique du seuil de rentabilité"><defs>${['1e2226','6d48b3','2b8352','a3333d'].map(mk).join('')}</defs>${s}</svg>`;
}

/* ---------- Les étapes ---------- */
const STEPS = [
 { title:'Le résultat à deux degrés',
   ph:[{btn:'Regrouper →', text:`Le compte de résultat d'une entreprise commerciale se présente en <b>deux degrés</b>.<br><br>Le 1<sup>er</sup> degré donne le <b>bénéfice brut</b>, le 2<sup>e</sup> degré le <b>bénéfice net d'exploitation</b>.`},
       {btn:'En liste →', text:`On regroupe les montants :<br>• <b class="c-can">CAN</b> : chiffre d'affaires net ;<br>• <b class="c-pramv">PRAMV</b> : prix de revient d'achat des marchandises vendues ;<br>• <b class="c-ff">Coûts fixes</b> : les frais généraux (ACE).`},
       {btn:'Suite →', text:`Présenté en liste, on voit le rôle du bénéfice brut.`,
        q:{text:'Le bénéfice brut sert à…', opts:[['f','couvrir les coûts fixes'],['m','payer les marchandises']], ok:'f',
           fb:'les marchandises sont déjà payées par le CAN (PRAMV) : le bénéfice brut sert à <b>couvrir les coûts fixes</b>. Le reste est le bénéfice net.'}}],
   stage: ph => {
     const det = crHTML('Compte de résultat',
       [['Déductions accordées',CR.dedAcc,'',['CAN','c-can']],['Pertes sur créances',CR.pertes,'',['CAN','c-can']],['Achats de marchandises',CR.achats,'',['PRAMV','c-pramv']],['Frais d\'achat',CR.fraisA,'',['PRAMV','c-pramv']],['Variation de stocks',CR.varS,'',['PRAMV','c-pramv']],['Bénéfice brut',CR.bb,'k c-bb'],['',CR.ventes+CR.dedObt+CR.prestP,'tot'],

/* ---------- Actions ---------- */
const A = [];
STEPS.forEach((s,i)=>s.ph.forEach((_,p)=>A.push({step:i, ph:p})));
let pos = 0;

/* ---------- Rendu ---------- */
function qBox(key, q){
  const ch = ANS[key];
  const btn = (a,lb) => `<button class="ch ${ch===a?(a===q.ok?'ok':'ko'):''} ${ch?'':'blink'}" data-a="${a}" ${ch?'disabled':''}>${lb}</button>`;
  const fb = ch ? `<div class="fb ${ch===q.ok?'ok':'ko'}">${ch===q.ok?'✓ En effet':'✗ En fait'}, ${q.fb}</div>` : `<div class="hint">Cliquer sur la bonne réponse.</div>`;
  return `<div class="calc q"><div style="font-weight:600;margin-bottom:4px">La question à se poser</div>${q.text}
    <div class="choices" style="flex-wrap:wrap">${q.opts.map(([a,lb])=>btn(a,lb)).join('')}</div>${fb}</div>`;
}
const LET = i => String.fromCharCode(65+i);   // A, B, C…
function render(){
  pos = Math.max(0, Math.min(A.length-1, pos));
  const {step, ph} = A[pos], St = STEPS[step], P = St.ph[ph], key = step+'.'+ph;
  document.querySelectorAll('#dots .dot').forEach((b,i)=>{ b.classList.toggle('cur', i===step); b.classList.toggle('done', i<step); });
  $('prev').disabled = pos===0;
  $('next').disabled = pos===A.length-1 || (P.q && !ANS[key]);
  $('next').textContent = pos===A.length-1 ? 'Terminé ✓' : P.btn;
  $('explain').innerHTML = `<h2 class="steptitle">${LET(step)}. ${St.title}</h2>
    <p class="steptext">${P.text}</p>${P.q?qBox(key,P.q):''}`;
  ANSWERED = !!ANS[key];
  $('stage').innerHTML = St.stage(ph);
}

/* ---------- Navigation ---------- */
function goTo(p){ pos = p; render(); }
function goStep(s){ goTo(A.findIndex(a=>a.step===s)); }
let Z = 1;
try { Z = +localStorage.getItem('pm-zoom') || 1; } catch(e){}
function applyZoom(){
  Z = Math.round(Math.max(0.8, Math.min(1.6, Z))*10)/10;
  document.documentElement.style.setProperty('--z', Z);
  try { localStorage.setItem('pm-zoom', Z); } catch(e){}
}
$('dots').innerHTML = STEPS.map((s,i)=>`<button class="dot" data-s="${i}" title="${LET(i)}. ${s.title}" aria-label="${LET(i)}. ${s.title}"></button>`).join('');
$('zm').addEventListener('click', ()=>{ Z -= 0.1; applyZoom(); });
$('zp').addEventListener('click', ()=>{ Z += 0.1; applyZoom(); });
$('next').addEventListener('click', ()=>goTo(pos+1));
$('prev').addEventListener('click', ()=>goTo(pos-1));
$('explain').addEventListener('click', e=>{ const b=e.target.closest('.ch'); if (!b || b.disabled) return; const {step,ph}=A[pos]; ANS[step+'.'+ph] = b.dataset.a; render(); });
$('quit').addEventListener('click', ()=>{ window.close(); setTimeout(()=>{ $('quit-msg').style.display='block'; }, 300); });
$('dots').addEventListener('click', e=>{ const b=e.target.closest('.dot'); if (b) goStep(+b.dataset.s); });
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' && !$('next').disabled) goTo(pos+1);
  if (e.key==='ArrowLeft') goTo(pos-1);
});
render();
applyZoom();
</script>
<script src="theorie.js"></script>
</body>
</html>
