<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journalisation - Exercice de Comptabilité</title>
    <link rel="stylesheet" href="style.css">
    <!-- Réglages propres à cette page (le reste est dans style.css) -->
    <style>
        header, footer { border-top: 10px solid #24f400; border-bottom: 6px solid #ffff00; }
        h4 { margin-bottom: 0px; }
    </style>
</head>
<body>
    <header>
        <h2>Journalisation avec écritures multiples</h2>
        <h1>Les marchandises et autres écritures de bases</h1>
    </header>

    <!-- L'exercice est construit ici par journal.js -->
    <div class="container" id="exercice"></div>

    <script>
    const EXERCICE = {

        // ===== Comptes proposés dans les menus déroulants =====
        comptes: {
            "ACTIF": ["Caisse", "Poste", "Banque", "Créances clients", "Créances AFC", "Stock de marchandises", "Mobilier", "Véhicules"],
            "PASSIF": ["Dettes fournisseurs", "Autres dettes", "Dette bancaire", "Capital", "Privé"],
            "MARCHANDISES": ["Ventes de marchandises", "Déductions accordées", "Achats de marchandises", "Prestations propres", "Déductions obtenues", "Frais d'achat"],
            "CHARGES ET PRODUITS": ["Salaires", "Loyers", "Electricité", "Frais de véhicules", "Frais d'administration", "ACE", "Publicité", "Charges financières", "Produits financiers"]
        },

        // ===== Écritures (ajouter les nouvelles à la fin, séparées par une virgule) =====
        // Modèle :  { description: "...", solution: [ { debit: "Compte", credit: "", amount: 100 }, ... ] }
        ecritures: [
            {
                description: "Nous payons par poste une facture d'un fournisseur en déduisant 2% d'escompte. Montant de la facture : CHF 800.-",
                solution: [
                    { debit: "Dettes fournisseurs", credit: "", amount: 800  },
                    { debit: "", credit: "Poste", amount: 784 },
                    { debit: "", credit: "Déductions obtenues", amount: 16 }
                ]
            },
            {
                description: "Nous recevons un avis de débit de la banque concernant notre emprunt :\nAmortissement de la dette\tCHF 5'000.-\nIntérêts annuels\t\tCHF   240.-",
                solution: [
                    { debit: "Dette bancaire", credit: "", amount: 5000  },
                    { debit: "Charges financières", credit: "", amount: 240 },
                    { debit: "", credit: "Banque", amount: 5240 }
                ]
            },
            {
                description: "Nous recevons de la banque les intérêts annuels bruts en notre faveur, CHF 80.-. Tenir compte de l'impôt anticipé.",
                solution: [
                    { debit: "Banque", credit: "", amount: 52 },
                    { debit: "", credit: "Produits financiers", amount: 80 },
                    { debit: "Créances AFC", credit: "", amount: 28 }
                ]
            },
            {
                description: "Comptabilisation des ventes de la semaines :\nEncaissées en espèces :\tCHF   500.-\nFacturées :\t\tCHF 1'000.-\nTotal :\t\t\tCHF 1'500.-",
                solution: [
                    { debit: "Caisse", credit: "", amount: 500 },
                    { debit: "Créances clients", credit: "", amount: 1000 },
                    { debit: "", credit: "Ventes de marchandises", amount: 1500 }
                ]
            },
            {
                description: "Notre client nous verse à la poste CHF 294.- pour une facture, après déduction de 2% d'escompte.",
                solution: [
                    { debit: "Poste", credit: "", amount: 294 },
                    { debit: "Déductions accordées", credit: "", amount: 6 },
                    { debit: "", credit: "Créances clients", amount: 300 }
                ]
            },
            {
                description: "Nous payons au comptant une facture non comptabilisée pour les frais d'importation de marchandises, CHF 100.-.",
                solution: [
                    { debit: "Frais d'achat", credit: "Caisse", amount: 100 }
                                    ]
            },
            {
                description: "Nous retournons de la marchandises à notre fournisseur qui nous remet une note de crédit de CHF 400.-",
                solution: [
                    { debit: "Dettes fournisseurs", credit: "Achats de marchandises", amount: 400 }
                ]
            },
            {
                description: "Paiement du mois par virement bancaire :\nSalaires\t\tCHF 5'000.-\nLoyer\t\t\tCHF 2'200.-\nFacture d'électricité\tCHF 1'000.-\nTotal\t\t\tCHF 8'200.-",
                solution: [
                    { debit: "Salaires", credit: "", amount: 5000 },
                    { debit: "Loyers", credit: "", amount: 2200 },
                    { debit: "Autres dettes", credit: "", amount: 1000 },
                    { debit: "", credit: "Banque", amount: 8200 }
                ]
            },
            {
                description: "Comptabiliser la facture d'électricité du dernier trimestre, CHF 1'000.-.",
                solution: [
                    { debit: "Electricité", credit: "Autres dettes", amount: 1000 }
                ]
            },
            {
                description: "Nous achetons un nouveau véhicule CHF 26'000.-. Le garage reprend l'ancien pour CHF 6'000.-. Nous payons la moitié du solde par poste et le solde sera payé à 30 jours.",
                solution: [
                    { debit: "Véhicules", credit: "", amount: 26000 },
                    { debit: "", credit: "Véhicules", amount: 6000 },
                    { debit: "", credit: "Poste", amount: 10000 },
                    { debit: "", credit: "Autres dettes", amount: 10000 }
                ]
            },
            {
                description: "Nous payons par poste une facture non comptabilisée concernant un achat de matériel de bureau, CHF 200.-.",
                solution: [
                    { debit: "Frais d'administration", credit: "Poste", amount: 200 }
                ]
            },
            {
                description: "Le propriétaire prélève pour ses besoins personnels : CHF 300.- de la caisse et CHF 500.- du stock de marchdandises.",
                solution: [
                    { debit: "Privé", credit: "", amount: 800 },
                    { debit: "", credit: "Prestations propres", amount: 500 },
                    { debit: "", credit: "Caisse", amount: 300 }
                ]
            },
            {
                description: "Nous payons par banque :\nL'assurance ménage du patron\tCHF   200.-\nune campagne de promotion\tCHF   500.-\nune facture d'un fournisseur\tCHF   400.-\nTotal\t\t\t\tCHF 1'100.-",
                solution: [
                    { debit: "Privé", credit: "", amount: 200 },
                    { debit: "Publicité", credit: "", amount: 500 },
                    { debit: "Dettes fournisseurs", credit: "", amount: 400 },
                    { debit: "", credit: "Banque", amount: 1100  }
                ]
            },
            {
                description: "Le propriétaire augmente son apport dans l'entreprise en versant CHF 10'000.- à la banque.",
                solution: [
                    { debit: "Banque", credit: "Capital", amount: 10000 }
                ]
            },
            {
                description: "A la fin de l'année, nous recevons de nos fournisseurs une ristourne de CHF 8'000.- à faire valoir sur nos prochaines commandes.",
                solution: [
                    { debit: "Dettes fournisseurs", credit: "Déductions obtenues", amount: 8000 }
                ]
            }
    
            /* Ajouter d'autres écritures ici par la suite
            ,
            {
                description: "",
                solution: [
                    { debit: "", credit: "", amount:  },
                    { debit: "", credit: "", amount:   }
                ]
            }
            */
        ]
    };
    </script>
    <script src="journal.js"></script>
</body>
</html>
