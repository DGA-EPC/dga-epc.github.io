<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journalisation - Les réserves latentes</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <!-- Réglages propres à cette page (le reste est dans style.css) -->
    <style>
        header, footer { border-top: 6px solid #24b4f2; border-bottom: 6px solid #ffb6f2; }
        .container { border-bottom: 6px solid #24f400; }
        h4 { margin-bottom: 0px; }
    </style>
</head>
<body>
    <header>
        <h2>Journalisation avec écritures multiples</h2>
        <h1>Les réserves latentes</h1>
        <h4>Si vous ne comprenez pas une écriture, prenez une capture d'écran et posez la question dès que possible</h4>
    </header>

    <!-- L'exercice est construit ici par journal.js -->
    <div class="container" id="exercice"></div>

    <script>
    const EXERCICE = {

        // ===== Comptes proposés dans les menus déroulants =====
        comptes: {
            "ACTIF": ["Caisse", "Poste", "Banque", "Créances clients", "Ducroire", "Titres", "Stock de marchandises", "Véhicules", "Machines", "Immeubles", "FAC sur immeubles"],
            "PASSIF": ["Dettes fournisseurs", "Dettes AFC", "Provision pour litiges", "Capital"],
            "MARCHANDISES": ["Ventes de marchandises", "Pertes sur créances", "Achats de marchandises", "Prestations propres", "Déductions obtenues", "Variation de stock"],
            "CHARGES ET PRODUITS": ["Salaires", "Loyers", "Electricité", "Frais de véhicules", "Frais d'administration", "ACE", "Amortissements", "Produits des titres", "Charges des titres", "Charges d'immeuble"]
        },

        // ===== Écritures (ajouter les nouvelles à la fin, séparées par une virgule) =====
        // Modèle :  { description: "...", solution: [ { debit: "Compte", credit: "", amount: 100 }, ... ] }
        ecritures: [
            {
                description: "Au 1er janvier, le stock de marchandises atteint une valeur de 1000 au PRA. Il n'y a pas de réserves latentes.\nA la clôture, le comptable décide de créer une réserve de 30% sur le stock dont l'inventaire atteint 1200.",
                solution: [
                    { debit: "Variation de stock", credit: "Stock de marchandises", amount: 160 }
                    ]
            },
            {
                description: "Afin d'améliorer le résultat, nous dissolvons une réserve sur les machines à hauteur de 500.",
                solution: [
                    { debit: "Machines", credit: "Amortissements", amount: 500 }
                ]
            },
            {
                description: "La valeur des titres à la clôture est de 100. Le solde du compte Titres atteint 80. Nous décidons d'ajuster le compte Titres.",
                solution: [
                    { debit: "Titres", credit: "Produits des titres", amount: 20 }
                ]
            },
            {
                description: "En fin d'année, l'inventaire des stocks au PRA atteint 1000. Le sàn pubilié était de 675, compte tenu d'un abattement de 25%. Comptabiliser l'ajustement en maintenant le taux de réserve latente.",
                solution: [
                    { debit: "Stock de marchandises", credit: "Variation de stock", amount: 75 }
                    ]
            },
            {
                description: "En fin d'année, l'inventaire des stocks au PRA atteint 1200. Au début de l'exercice il atteignait en valeur réelle 900, compte tenu d'un abatement de 30%. Comptabiliser l'ajustement appliquant un abattement de 20%.",
                solution: [
                    { debit: "Stock de marchandises", credit: "Variation de stock", amount: 330 }
                    ]
            },
            {
                description: "En fin d'année, le compte Ducroire atteint 40, alors que le risque réelle sur les clients (solde 600) est de 2%. Passez l'écriture nécessaire pour supprimer la réserve latente.",
                solution: [
                    { debit: "Ducroire", credit: "Pertes sur créances", amount: 28 }
                    ]
            },
            {
                description: "En fin d'exercie, afin de diminuer le résultat final, nous créons une réserve latente sur notre immeuble locatif de 30.",
                solution: [
                    { debit: "Charges d'immeuble", credit: "FAC sur immeubles", amount: 30 }
                    ]
            }            
    
            /* Ajouter d'autres écritures ici par la suite
            ,
            {
                description: "",
                solution: [
                    { debit: "", credit: "", amount:  },
                    { debit: "", credit: "", amount:   }
                ]
            }
            */
        ]
    };
    </script>
    <script src="journal.js"></script>
</body>
</html>
