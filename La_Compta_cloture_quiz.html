<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - La clôture des comptes</title>
    <link rel="stylesheet" href="style.css">
    <!-- Réglages propres à cette page (le reste est dans style.css) -->
    <style>
        header, footer { border-top: 5px solid yellow; border-bottom: 5px solid blue; }
        .question { font-size: 1.15em; font-weight: bold; margin-bottom: 15px; }
        .choix { list-style: none; padding: 0; margin: 0; }
        .choix li { margin-bottom: 10px; }
        .choix label { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
        .choix label:hover { background-color: #f4f8fd; }
        .choix input { width: auto; margin: 0; transform: scale(1.3); }
        .choix label.bonne { background-color: #d4edda; border-color: #8fd19e; }
        .choix label.fausse { background-color: #f8d7da; border-color: #f1a5ad; }
        #validate-btn:disabled { opacity: .45; cursor: default; transform: none; }
        /* Fenêtre d'explication (mauvaise réponse) */
        .modal-fond { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
        .modal { background: white; border-radius: 12px; max-width: 520px; width: 100%; padding: 22px 24px; border-top: 6px solid #ff4747; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
        .modal h3 { color: #c0392b; margin-bottom: 10px; }
        .modal .bonne-rep { background-color: #d4edda; color: #155724; padding: 8px 12px; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }
        .modal .modal-btn { text-align: right; margin-top: 15px; }
        #close-btn { background-color: #037DFF; color: white; }
        #close-btn:hover { background-color: #045BB5; }
    </style>
</head>
<body>
    <header>
        <h2>Quiz</h2>
        <h1>La clôture des comptes</h1>
    </header>

    <div class="container">
        <div class="stats">
            <span id="progression"></span>
            <span id="score"></span>
        </div>

        <div id="zone-question">
            <div class="entry-description question" id="question"></div>
            <ul class="choix" id="choix"></ul>
            <div class="feedback correct" id="feedback">✓ Bonne réponse !</div>
            <div class="buttons">
                <button id="quit-btn">Quitter</button>
                <div>
                    <button id="validate-btn" disabled>Valider</button>
                    <button id="next-btn" style="display:none">Suivant</button>
                </div>
            </div>
        </div>

        <div class="completion-message" id="fin"></div>
        <button id="restart-btn">Recommencer</button>
        <p id="quit-msg" style="display:none;text-align:center;color:#721c24">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : ferme l'onglet.</p>
    </div>

    <!-- Fenêtre d'explication en cas de mauvaise réponse -->
    <div class="modal-fond" id="modal">
        <div class="modal">
            <h3>Pas tout à fait…</h3>
            <div class="bonne-rep" id="modal-reponse"></div>
            <div id="modal-explication"></div>
            <div class="modal-btn"><button id="close-btn">Compris</button></div>
        </div>
    </div>

    <script>
    const QUIZ = {

        // ===== Questions (ajouter les nouvelles à la fin, séparées par une virgule) =====
        // La BONNE réponse est toujours écrite EN PREMIER : l'ordre est mélangé à l'affichage.
        // Modèle :  { question: "...", reponses: ["bonne réponse", "fausse 1", "fausse 2", "fausse 3"], explication: "..." }
        questions: [

            {
                question: "Où sont virés les soldes des comptes de charges ?",
                reponses: ["Au débit du compte de résultat", "Au crédit du compte de résultat", "Au bilan de clôture", "Au compte Privé"],
                explication: "Une charge a son solde au débit. Le V/R s'inscrit au crédit du compte de charge et il est porté au débit du compte de résultat."
            },
            {
                question: "Où sont virés les soldes des comptes de produits ?",
                reponses: ["Au crédit du compte de résultat", "Au débit du compte de résultat", "Au crédit du capital", "Au bilan de clôture"],
                explication: "Un produit a son solde au crédit. Le V/R s'inscrit au débit du compte de produit et il est porté au crédit du compte de résultat."
            },
            {
                question: "De quel côté inscrit-on le solde d'un compte ?",
                reponses: ["Du côté le plus faible", "Du côté le plus fort", "Toujours au débit", "Toujours au crédit"],
                explication: "Le solde complète le côté le plus faible, pour que les deux côtés aient le même total."
            },
            {
                question: "Le compte Honoraires a 125'000.- au crédit et une ristourne de 5'000.- au débit. Que vire-t-on au compte de résultat ?",
                reponses: ["120'000.- au crédit", "125'000.- au crédit", "130'000.- au crédit", "5'000.- au débit"],
                explication: "On vire le solde : 125'000 − 5'000 = 120'000. La ristourne diminue le produit."
            },
            {
                question: "Dans une raison individuelle, où est viré le bénéfice ?",
                reponses: ["Au crédit du compte Privé", "Au débit du compte Privé", "Directement au crédit du capital", "Au bilan de clôture"],
                explication: "Le bénéfice revient au propriétaire. Il passe par son compte Privé : écriture Compte de résultat / Privé."
            },
            {
                question: "Quelle écriture correspond au virement de la perte nette ?",
                reponses: ["Privé / Compte de résultat", "Compte de résultat / Privé", "Capital / Compte de résultat", "Compte de résultat / Capital"],
                explication: "Le propriétaire supporte la perte : elle est débitée sur son compte Privé."
            },
            {
                question: "Que représente le solde du compte Privé ?",
                reponses: ["La variation de fortune du propriétaire", "Le bénéfice de l'entreprise", "Le total des prélèvements", "Le capital de fin d'année"],
                explication: "C'est la VF (variation de fortune) : la différence entre ce que l'entreprise a rapporté au propriétaire et ce qu'il a prélevé."
            },
            {
                question: "Quelle est l'écriture pour une augmentation de fortune ?",
                reponses: ["Privé / Capital", "Capital / Privé", "Compte de résultat / Capital", "Capital / Bilan de clôture"],
                explication: "Le crédit du Privé dépasse son débit : le solde s'inscrit au débit du Privé, puis au crédit du capital."
            },
            {
                question: "Peut-on avoir un bénéfice et une diminution de fortune ?",
                reponses: ["Oui, si les prélèvements dépassent le bénéfice", "Non, un bénéfice augmente toujours la fortune", "Oui, si les charges dépassent les produits", "Non, seulement en cas de perte"],
                explication: "Exemple : bénéfice 12'000, prélèvements 15'000. VF = −3'000 : la fortune diminue."
            },
            {
                question: "Peut-on avoir une perte nette et une augmentation de fortune ?",
                reponses: ["Oui, si le salaire et les intérêts du propriétaire dépassent la perte et les prélèvements", "Non, une perte diminue toujours la fortune", "Oui, si le capital au début est élevé", "Oui, si les prélèvements sont plus grands que la perte"],
                explication: "Le salaire et les intérêts du propriétaire sont crédités au Privé. S'ils dépassent la perte additionnée aux prélèvements, la VF est positive."
            },
            {
                question: "Comment comptabilise-t-on le salaire du propriétaire ?",
                reponses: ["Salaires / Privé", "Privé / Salaires", "Salaires / Banque", "Salaires / Capital"],
                explication: "C'est une charge de l'entreprise (débit Salaires), due au propriétaire (crédit de son compte Privé)."
            },
            {
                question: "Comment comptabilise-t-on les intérêts sur le capital propre du propriétaire ?",
                reponses: ["Charges financières / Privé", "Privé / Charges financières", "Charges financières / Capital", "Capital / Produits financiers"],
                explication: "C'est une charge financière de l'entreprise, créditée au compte Privé du propriétaire."
            },
            {
                question: "Le salaire du propriétaire modifie-t-il la variation de fortune ?",
                reponses: ["Non : le bénéfice baisse, mais le Privé est crédité du même montant", "Oui, il l'augmente", "Oui, il la diminue", "Seulement en cas de perte"],
                explication: "Un salaire de 30'000 réduit le bénéfice de 30'000, mais crédite le Privé de 30'000 : l'effet total est nul."
            },
            {
                question: "Capital sàn 50'000.-, bénéfice 12'000.-, prélèvements 8'000.-. Quel est le capital dans le bilan de clôture ?",
                reponses: ["54'000.-", "62'000.-", "58'000.-", "42'000.-"],
                explication: "VF = 12'000 − 8'000 = +4'000. Capital = 50'000 + 4'000 = 54'000."
            },
            {
                question: "Quel est le bon ordre de clôture ?",
                reponses: ["Charges et produits → Compte de résultat → Privé → Capital → Bilan", "Bilan → Capital → Privé → Compte de résultat", "Privé → Charges et produits → Capital → Bilan", "Compte de résultat → Charges et produits → Bilan → Privé"],
                explication: "On calcule d'abord le résultat, on le vire au Privé, puis la VF au capital. Le bilan vient en dernier."
            }

            /* Ajouter d'autres questions ici par la suite
            ,
            {
                question: "",
                reponses: ["", "", "", ""],
                explication: ""
            }
            */
        ]
    };

    // ===== Fonctionnement du quiz (pas besoin de modifier) =====
    const $ = id => document.getElementById(id);
    const melanger = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    let ordre = [], n = 0, score = 0, bonneTexte = '';

    function demarrer() {
        ordre = melanger(QUIZ.questions);
        n = 0; score = 0;
        $('zone-question').style.display = '';
        $('fin').style.display = 'none';
        $('restart-btn').style.display = 'none';
        afficher();
    }

    function afficher() {
        const q = ordre[n];
        bonneTexte = q.reponses[0];
        $('progression').textContent = `Question ${n + 1} / ${ordre.length}`;
        $('score').textContent = `Bonnes réponses : ${score}`;
        $('question').textContent = q.question;
        $('choix').innerHTML = melanger(q.reponses).map((r, i) =>
            `<li><label><input type="radio" name="rep" value="${i}"><span>${r}</span></label></li>`).join('');
        $('choix').querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => { $('validate-btn').disabled = false; }));
        $('feedback').style.display = 'none';
        $('validate-btn').style.display = '';
        $('validate-btn').disabled = true;
        $('next-btn').style.display = 'none';
    }

    function valider() {
        const coche = $('choix').querySelector('input:checked');
        if (!coche) return;
        const q = ordre[n];
        const labels = [...$('choix').querySelectorAll('label')];
        labels.forEach(l => {
            l.querySelector('input').disabled = true;
            if (l.textContent === bonneTexte) l.classList.add('bonne');
        });
        const juste = coche.parentElement.textContent === bonneTexte;
        if (juste) {
            score++;
            $('feedback').style.display = 'block';
        } else {
            coche.parentElement.classList.add('fausse');
            $('modal-reponse').textContent = 'Bonne réponse : ' + bonneTexte;
            $('modal-explication').textContent = q.explication;
            $('modal').style.display = 'flex';
        }
        $('score').textContent = `Bonnes réponses : ${score}`;
        $('validate-btn').style.display = 'none';
        $('next-btn').style.display = '';
        $('next-btn').textContent = (n === ordre.length - 1) ? 'Voir le résultat' : 'Suivant';
    }

    function suivant() {
        n++;
        if (n < ordre.length) { afficher(); return; }
        $('zone-question').style.display = 'none';
        const pct = Math.round(score / ordre.length * 100);
        const msg = pct === 100 ? 'Parfait, tu maîtrises la clôture !' : pct >= 70 ? 'Très bien, encore un petit effort !' : 'Revois la simulation de clôture, puis recommence.';
        $('fin').innerHTML = `<h3>Quiz terminé</h3><p style="font-size:1.3em"><b>${score} / ${ordre.length}</b> bonnes réponses (${pct} %)</p><p>${msg}</p>`;
        $('fin').style.display = 'block';
        $('restart-btn').style.display = 'block';
        $('progression').textContent = '';
    }

    $('validate-btn').addEventListener('click', valider);
    $('next-btn').addEventListener('click', suivant);
    $('restart-btn').addEventListener('click', demarrer);
    $('close-btn').addEventListener('click', () => { $('modal').style.display = 'none'; });
    $('quit-btn').addEventListener('click', () => { window.close(); setTimeout(() => { $('quit-msg').style.display = 'block'; }, 300); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').style.display = 'none'; });

    demarrer();
    </script>
</body>
</html>
