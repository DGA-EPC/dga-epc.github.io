<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journalisation - Exercice de Comptabilité</title>
    <link rel="stylesheet" href="style.css">
    <!-- Réglages propres à cette page (le reste est dans style.css) -->
    <style>
        header, footer { border-top: 6px solid #24f4b4; border-bottom: 6px solid #ffff00; }
    </style>
</head>
<body>
    <header>
        <h2>Journalisation avec écritures multiples</h2>
        <h1>Pertes sur créances et Provisions</h1>
    </header>

    <!-- L'exercice est construit ici par journal.js -->
    <div class="container" id="exercice"></div>

    <script>
    const EXERCICE = {

        // ===== Comptes proposés dans les menus déroulants =====
        comptes: {
            "ACTIF": ["Caisse", "Poste", "Banque", "Créances clients", "Créances douteuses", "Ducroire", "Stock de marchandises"],
            "PASSIF": ["Dettes fournisseurs", "Capital"],
            "MARCHANDISES": ["Ventes de marchandises", "Achats de marchandises", "Pertes sur créances"],
            "CHARGES ET PRODUITS": ["Salaires", "Charges sociales", "Loyers", "Frais d'administration", "ACE", "Produits financiers", "Produits exceptionnels", "Charges exceptionnelles"]
        },

        // ===== Écritures (ajouter les nouvelles à la fin, séparées par une virgule) =====
        // Modèle :  { description: "...", solution: [ { debit: "Compte", credit: "", amount: 100 }, ... ] }
        ecritures: [
            {
                description: "Nous entamons une poursuite contre un client qui nous doit CHF 1'200.- en avançant en espèces les frais de CHF 80.-",
                solution: [
                    { debit: "Créances clients", credit: "Caisse", amount: 80 }
                ]
            },
            {
                description: "Une poursuite contre un client qui nous devait CHF 2'000.- aboutit à la distribution d'un dividende de CHF 800.- par poste. Le solde est perdu. ",
                solution: [
                    { debit: "Poste", credit: "", amount: 800 },
                    { debit: "Pertes sur créances", credit: "", amount: 1200 },
                    { debit: "", credit: "Créances clients", amount: 2000 }
                 ]
            },
            {
                description: "Nous entamons une poursuite contre un client qui nous doit CHF 2'800.- en payant par poste les frais de CHF 140.-. Nous transférons ensuite la facture dans le compte approprié",
                solution: [
                    { debit: "Créances clients", credit: "Poste", amount: 140 },
                    { debit: "Créances douteuses", credit: "Créances clients", amount: 2940 }
                 ]
            },
            {
                description: "Après une relance, nous récupérons CHF 400.- sur une poursuite achevée cette année. Le montant est versé à la banque",
                solution: [
                    { debit: "Banque", credit: "Pertes sur créances", amount: 400 }
                 ]
            },
           {
                description: "A la suite d'une relance, nous récupérons CHF 800.- sur une poursuite achevée il y a 3 ans. Le montant est versé à la poste",
                solution: [
                    { debit: "Poste", credit: "Produits exceptionnels", amount: 800 }
                 ]
            },
            {
                description: "Les poursuites ayant abouti, nous recevons à la poste un montant de CHF 1'470.- pour une créance de CHF 1'400.-. La différence représente les intérêts moratoires.",
                solution: [
                    { debit: "Poste", credit: "", amount: 1470 },
                    { debit: "", credit: "Créances clients", amount: 1400 },
                    { debit: "", credit: "Produits financiers", amount: 70 }
                 ]
            },
            {
                description: "Nous recevons un ADB des poursuites. Le montant total de la créance douteuse est perdu, soit CHF 600.-. Après avoir enregistré la perte, nous utilisons la provision pour l'amortir.",
                solution: [
                    { debit: "Pertes sur créances", credit: "", amount: 600 },
                    { debit: "", credit: "Créances douteuses", amount: 600 },
                    { debit: "Ducroire", credit: "", amount: 600 },
                    { debit: "", credit: "Pertes sur créances", amount: 600 }
                 ]
            },
            {
                description: "En fin d'exercice, nous créons une provision sur nos clients de CHF 2'400.-.",
                solution: [
                    { debit: "Pertes sur créances", credit: "Ducroire", amount: 2400 }
                 ]
            },
            {
                description: "Ajustement de la provision Ducroire pour qu'elle corresponde au 5% des clients.\nSolde des clients :\t\t\tCHF 40'000.-\nSolde de Ducroire avant ajustement :\tCHF  2'300.-",
                solution: [
                    { debit: "Ducroire", credit: "Pertes sur créances", amount: 300 }
                 ]
            },
            {
                description: "Ajustement de la provision Ducroire pour qu'elle corresponde au 5% des clients.\nSolde des clients :\t\t\tCHF 20'000.-\nSolde de Ducroire avant ajustement :\tCHF    400.-",
                solution: [
                    { debit: "Pertes sur créances", credit: "Ducroire", amount: 600 }
                 ]
            },
            {
                description: "Nous envoyons un 3è rappel à un client douteux et lui facturons CHF 40.- de frais administratif, ainsi que CHF 28.- d'intérêts moratoires.",
                solution: [
                    { debit: "Créances douteuses", credit: "", amount: 68 },
                    { debit: "", credit: "Frais d'administration", amount: 40 },
                    { debit: "", credit: "Produits financiers", amount: 28 },
                 ]
            },
            {
                description: "Nous vendons des ADB d'une valeur de CHF 10'000.- à une entreprise de recouvrement qui nous verse par banque la somme de CHF 4'500.-. Tous ces ADB ont plus de 2 ans.",
                solution: [
                    { debit: "Banque", credit: "Produits exceptionnels", amount: 4500 }
                 ]
            },
            {
                description: "En fin d'exercice, nous augmentons la provision sur créances de CHF 700.-",
                solution: [
                    { debit: "Pertes sur créances", credit: "Ducroire", amount: 700 }
                 ]
            },
            {
                description: "Par précaution, nous transférons une facture d'un client insolvable à l'heure actuelle dans le compte approprié, CHF 900.-",
                solution: [
                    { debit: "Créances douteuses", credit: "Créances clients", amount: 900 }
                 ]
            }
            // Ajouter d'autres écritures ici par la suite
        ]
    };
    </script>
    <script src="journal.js"></script>
</body>
</html>
