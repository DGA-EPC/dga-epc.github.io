<body>
    <header>
        <h2>Journalisation avec écritures multiples</h2>

    <!-- L'exercice est construit ici par journal.js -->
    <div class="container" id="exercice"></div>

    <script>
    const EXERCICE = {

        messageFin: "N'oubliez pas : \"Je fais de la compta et c'est ma joie!\"",

        // ===== Comptes proposés dans les menus déroulants =====
        comptes: {
            "ACTIF": ["Caisse", "Poste", "Banque", "Créances clients", "Créances AFC", "IP sur marchandises", "IP sur inv. et ACE", "Stock de marchandises", "Véhicules"],

        // Modèle :  { description: "...", solution: [ { debit: "Compte", credit: "", amount: 100 }, ... ] }

            {

                    { debit: "Dette bancaire", credit: "", amount: 5000 },
                    { debit: "Charges financières", credit: "", amount: 750 },
                    { debit: "", credit: "Banque", amount: 5750  }

                solution: [
                    { debit: "Banque", credit: "", amount: 26 },
                    { debit: "Créances AFC", credit: "", amount: 14 },
                    { debit: "", credit: "Produits financiers", amount: 40 }
                ]
            },
            {

                    { debit: "Banque", credit: "Produits financiers", amount: 600 }
                ]

                description: "Nous recevons sur notre compte postal les intérêts annuels de 6% sur un placement de CHF 5'000.-. Tenir compte de l'impôt anticipé.",

                    { debit: "Poste", credit: "", amount: 3025  },
                    { debit: "", credit: "Produits financiers", amount: 25 },
                    { debit: "", credit: "Créances clients", amount:  3000 }
