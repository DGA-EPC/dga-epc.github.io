<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Journalisation - Exercice de Comptabilité</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Journalisation avec écritures multiples</h2>
        <h1>La TVA</h1>
        <h4>Comptabilisation au net au taux normal (8.1%)</h4>
    </header>

    <!-- L'exercice est construit ici par journal.js -->
    <div class="container" id="exercice"></div>

    <script>
    const EXERCICE = {

        // ===== Comptes proposés dans les menus déroulants =====
        comptes: {
            "ACTIF": ["Caisse", "Poste", "Banque", "Créances clients", "Créances AFC", "IP sur marchandises", "IP sur inv. et ACE", "Stock de marchandises", "Machines", "Véhicules"],
            "PASSIF": ["Dettes fournisseurs", "Autres dettes", "Dettes AFC", "TVA due", "Capital", "Privé"],
            "MARCHANDISES": ["Ventes de marchandises", "Déductions accordées", "Achats de marchandises", "Prestations propres", "Déductions obtenues"],
            "CHARGES ET PRODUITS": ["Salaires", "Loyers", "Electricité", "Frais de véhicules", "Frais d'administration", "ACE", "Produits financiers"]
        },

        // ===== Écritures (ajouter les nouvelles à la fin, séparées par une virgule) =====
        // Modèle :  { description: "...", solution: [ { debit: "Compte", credit: "", amount: 100 }, ... ] }
        ecritures: [
            {
                description: "Comptabilisation d'une facture de CHF 1'081.- TTC pour un achat de marchandises.",
                solution: [
                    { debit: "Achats de marchandises", credit: "", amount: 1000 },
                    { debit: "IP sur marchandises", credit: "", amount: 81 },
                    { debit: "", credit: "Dettes fournisseurs", amount: 1081 }
                ]
            },
            {
                description: "Nous vendons à crédit des marchandises pour CHF 5'000.-, TVA non comprise.",
                solution: [
                    { debit: "Créances clients", credit: "", amount: 5405 },
                    { debit: "", credit: "Ventes de marchandises", amount: 5000  },
                    { debit: "", credit: "TVA due", amount: 405 }
                ]
            },
            {
                description: "Vous pouvez le faire : Nous achetons un nouveau véhicule CHF 25'000.- (HT). Le vendeur nous reprend l'ancien pour CHF 5'000.- (HT). Nous payons CHF 10'000.- en espèces et recevons une facture à 30 jours pour le solde.",
                solution: [
                    { debit: "Véhicules", credit: "", amount: 25000 },
                    { debit: "", credit: "Véhicules", amount: 5000  },
                    { debit: "", credit: "TVA due", amount: 405 },
                    { debit: "IP sur inv. et ACE", credit: "", amount: 2025 },
                    { debit: "", credit: "Autres dettes", amount: 11620 },
                    { debit: "", credit: "Caisse", amount: 10000 }
                ]
            },
            {
                description: "Nous payons par banque une facture comptabilisée de CHF 1'780.- TTC pour un achat de marchandises.",
                solution: [
                    { debit: "Dettes fournisseurs", credit: "Banque", amount: 1780 }
                ]
            },
            {
                description: "Nous payons poste une facture d'un fournisseur, CHF 2'162.- en déduisant 5% d'escompte.",
                solution: [
                    { debit: "Dettes fournisseurs", credit: "", amount: 2162 },
                    { debit: "", credit: "Poste", amount: 2053.9  },
                    { debit: "", credit: "Déductions obtenues", amount: 100  },
                    { debit: "", credit: "IP sur marchandises", amount: 8.1  }
                ]
            },
            {
                description: "Un client nous rapporte de la marchandise en retour. Nous le remboursons en espèces CHF 875.60. Il n'y a pas de facture ouverte.",
                solution: [
                    { debit: "Ventes de marchandises", credit: "", amount: 810 },
                    { debit: "TVA due", credit: "", amount: 65.6  },
                    { debit: "", credit: "Caisse", amount: 875.6  }
                ]
            },
            {
                description: "A la fin du trimestre, nous transférons les soldes des impôts préalables dans le compte TVA due : IP sur marchandises, CHF 1'800.-. IP sur investissements, CHF 750.-",
                solution: [
                    { debit: "TVA due", credit: "", amount: 2550 },
                    { debit: "", credit: "IP sur marchandises", amount: 1800 },
                    { debit: "", credit: "IP sur inv. et ACE", amount: 750 }
                ]
            },
            {
                description: "Nous recevons à la poste le paiement d'un client pour une vente à crédit, CHF 820.- TVA comprise.",
                solution: [
                    { debit: "Poste", credit: "Créances clients", amount: 820 }
                ]
            },
            {
                description: "Notre fournisseur nous accorde un rabais de 10% sur notre facture de CHF 756.70 TTC, à cause d'une qualité inférieure de la marchandise.",
                solution: [
                    { debit: "Dettes fournisseurs", credit: "", amount: 756.7 },
                    { debit: "", credit: "Déductions obtenues", amount: 700 },
                    { debit: "", credit: "IP sur marchandises", amount: 56.7  }
                ]
            },
            {
                description: "Paiement par banque de l'électricité du trimestre, CHF 648.60 TTC.",
                solution: [
                    { debit: "", credit: "Banque", amount: 648.6 },
                    { debit: "Electricité", credit: "", amount: 600 },
                    { debit: "IP sur inv. et ACE", credit: "", amount: 48.6 }
                ]
            },
            {
                description: "Paiement par poste du montant de TVA due pour le trimestre passé, CHF 300.-.",
                solution: [
                    { debit: "TVA due", credit: "Poste", amount: 300 }
                ]
            },
            {
                description: "Achat d'une machine à crédit, CHF 2'000.- TVA non comprise.",
                solution: [
                    { debit: "Machines", credit: "", amount: 2000 },
                    { debit: "IP sur inv. et ACE", credit: "", amount: 162 },
                    { debit: "", credit: "Autres dettes", amount: 2162 }
                ]
            },
            {
                description: "Vente au comptant de la semaine, CHF 5'405.-.",
                solution: [
                    { debit: "Caisse", credit: "", amount: 5405 },
                    { debit: "", credit: "Ventes de marchandises", amount: 5000 },
                    { debit: "", credit: "TVA due", amount:  405 }
                ]
            },
            {
                description: "Prélèvement de marchandises par le patron pour des besoins personnels, CHF 600.- HT.",
                solution: [
                    { debit: "Privé", credit: "", amount: 648.6 },
                    { debit: "", credit: "Prestations propres", amount: 600 },
                    { debit: "", credit: "IP sur marchandises", amount: 48.6 }
                ]
            }

            /* Ajouter d'autres écritures ici par la suite
            ,
            {
                description: "",
                solution: [
                    { debit: "", credit: "", amount:  },
                    { debit: "", credit: "", amount:   }
                ]
            }
            */
        ]
    };
    </script>
    <script src="journal.js"></script>
</body>
</html>
