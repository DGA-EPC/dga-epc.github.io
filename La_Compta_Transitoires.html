<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journalisation - Exercice de Comptabilité</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <!-- Réglages propres à cette page (le reste est dans style.css) -->
    <style>
        header, footer { border-top: 8px solid #24f400; border-bottom: 6px solid #ffff00; }
        h4 { margin-bottom: 0px; }
    </style>
</head>
<body>
    <header>
        <h2>Journalisation avec écritures multiples</h2>
        <h1>Les transitoires</h1>
        <h4>Les comptes sont clôturés au 31 décembre</h4>
    </header>

    <!-- L'exercice est construit ici par journal.js -->
    <div class="container" id="exercice"></div>

    <script>
    const EXERCICE = {

        // ===== Comptes proposés dans les menus déroulants =====
        comptes: {
            "ACTIF": ["Caisse", "Poste", "Banque", "Créances clients", "Stock de marchandises", "Véhicules", "Actifs transitoires"],
            "PASSIF": ["Dettes fournisseurs", "Autres dettes", "Passifs transitoires", "Capital"],
            "MARCHANDISES": ["Ventes de marchandises", "Déductions accordées", "Achats de marchandises", "Déductions obtenues"],
            "CHARGES ET PRODUITS": ["Salaires", "Charges sociales", "Loyers", "Electricité", "Frais de véhicules", "Frais d'administration", "Assurances", "Publicité", "ACE", "Produits financiers", "Charges financières"]
        },

        // ===== Écritures (ajouter les nouvelles à la fin, séparées par une virgule) =====
        // Modèle :  { description: "...", solution: [ { debit: "Compte", credit: "", amount: 100 }, ... ] }
        ecritures: [

    {
        description: "Extourne des transitoires à l'ouverture des comptes :\nVentes à facturer\t\tCHF 1'300\nÉlectricité à payer\t\tCHF   400\nRistournes à accorder\t\tCHF 3'000\nPublicité payée d'avance\tCHF   700",
        solution: [
            { debit: "Ventes de marchandises", credit: "Actifs transitoires", amount: 1300 },
            { debit: "Passifs transitoires", credit: "Electricité", amount: 400 },
            { debit: "Passifs transitoires", credit: "Déductions accordées", amount: 3000 },
            { debit: "Publicité", credit: "Actifs transitoires", amount: 700 }
        ]
    },
    {
        description: "Nous avons payé par poste l'assurance LAA pour l'année prochaine CHF 5'000",
        solution: [
            { debit: "Actifs transitoires", credit: "Charges sociales", amount: 5000 }
        ]
    },
    {
        description: "Électricité non facturée - Moyenne mensuelle CHF 330, dernière facture au 10 décembre.",
        solution: [
            { debit: "Electricité", credit: "Passifs transitoires", amount: 220 }
        ]
    },
    {
        description: "Nous estimons les ventes à facturées pour décembre à CHF 6'000. En tenir compte",
        solution: [
            { debit: "Actifs transitoires", credit: "Ventes de marchandises", amount: 6000 }
        ]
    },
    {
        description: "Nous avons payé en octobre le loyer semestriel de septembre à février, CHF 4'200",
        solution: [
            { debit: "Actifs transitoires", credit: "Loyers", amount: 1400 }
        ]
    },
    {
        description: "Nous avons payé par poste une campagne de promotion qui couvre la période du 15 novembre au 15 janvier, CHF 2'100",
        solution: [
            { debit: "Actifs transitoires", credit: "Publicité", amount: 525 }
        ]
    },
    {
        description: "Intérêts courus sur un prêt que nous avons accordé à 2%.\nMontant: CHF 25'000, échéance le 6 novembre de chaque année.",
        solution: [
            { debit: "Actifs transitoires", credit: "Produits financiers", amount: 75 }
        ]
    },
    {
        description: "Il nous reste pour CHF 800 de petit matériel de bureau non utilisé",
        solution: [
            { debit: "Actifs transitoires", credit: "Frais d'administration", amount: 800 }
        ]
    },
    {
        description: "Nous recevrons la facture de la redevance Radio-TV en février-mars l'an prochain. Elle concernera la période décembre à mars pour une valeur de CHF 360",
        solution: [
            { debit: "ACE", credit: "Passifs transitoires", amount: 90 }
        ]
    },
    {
        description: "Intérêts courus sur dette bancaire 6% - Montant CHF 40'000, échéance 30 octobre.",
        solution: [
            { debit: "Charges financières", credit: "Passifs transitoires", amount: 400 }
        ]
    },
    {
        description: "Assurance RC payée en décembre par poste, CHF 3'200 (valable pour l'année prochaine)",
        solution: [
            { debit: "Actifs transitoires", credit: "Assurances", amount: 3200 }
        ]
    },
    {
        description: "Nous estimons les ristournes à recevoir des fournisseurs à CHF 4'000",
        solution: [
            { debit: "Actifs transitoires", credit: "Déductions obtenues", amount: 4000 }
        ]
    }
    
            /* Ajouter d'autres écritures ici par la suite
            ,
            {
                description: "",
                solution: [
                    { debit: "", credit: "", amount:  },
                    { debit: "", credit: "", amount:   }
                ]
            }
            */
        ]
    };
    </script>
    <script src="journal.js"></script>
</body>
</html>
