<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'analyse financière – théorie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theorie.css">
<style>


:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1e2226; --muted:#6a6f76; --line:#e2ddd2; --soft:#efebe3;
  --charge:#c2671f; --charge-bg:#fcefe3;
  --produit:#2b8352; --produit-bg:#e6f4eb;
  --res:#6d48b3; --res-bg:#efe9f9;
  --passif:#a3333d; --passif-bg:#f8e8ea;
  --bilan:#20394f; --bilan-bg:#e6ecf1;
  --actif:#2a52be; --actif-bg:#e8eefb;
  --accent:#c98a10; --accent-bg:#fff3d6;
  --y1:#e8eefb; --y2:#fff3d6;
}
.calc.q{background:var(--bilan-bg)}
.ch.ko{background:var(--charge);border-color:var(--charge);color:#fff;opacity:1}
.fb.ko{border-left:4px solid var(--charge)}
.ch.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(32,57,79,0)}50%{box-shadow:0 0 0 5px rgba(201,138,16,.75);background:var(--accent-bg)}}
.tag.at{background:var(--actif-bg);color:var(--actif)}
.tag.pt{background:var(--passif-bg);color:var(--passif)}
.journal td.dt{color:var(--muted);white-space:nowrap}
.journal tr.todo td{opacity:.38}
.btn.quiz{display:flex;align-items:center;justify-content:center;background:#037DFF;color:#fff;border-color:#037DFF;text-align:center;text-decoration:none}

/* Ligne du temps */
.t{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px 8px;position:relative;min-width:0}
.t-head{font-weight:700;font-size:13.5px;text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-body{display:grid;grid-template-columns:1fr 1fr;min-height:46px}
.col{padding:4px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ln{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px;font-size:11.5px;border-radius:4px;padding:1px 2px}
.ln .lb{color:var(--muted);line-height:1.25;min-width:0}
.ln.ext .lb{font-style:italic}
.eff .tag{font-size:11.5px}

/* Introduction et résumé */
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:14px}
.quad .hd.pt{background:var(--passif-bg);color:var(--passif)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:12px 12px 90px}
  aside{position:static;max-height:none;overflow:visible}
  .nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(245,243,238,.95);backdrop-filter:blur(6px);padding:10px 12px;border-top:1px solid var(--line)}
  .two,.quad{grid-template-columns:1fr}
}

/* --- Amortissements --- */
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity .3s,box-shadow .3s}
.card.on{box-shadow:0 0 0 2px var(--accent)}
.card.off{opacity:.45}
.card .lt{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-weight:700;font-size:12px;margin-right:6px}
.card h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center}
.card .ex{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.ecr{display:flex;justify-content:space-between;gap:8px;font-size:13px;background:var(--soft);border-radius:8px;padding:6px 10px;font-weight:600}
.ecr span:last-child{color:var(--muted);font-weight:500}
.vocab tr.cur td{background:var(--hl)}
.tab tr.todo td{color:transparent}
.tab tr.cur td{background:var(--hl);font-weight:700}
.tab tr.cur td.am{color:var(--charge)}
.tab td.am{color:var(--charge)}.bil .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:2px 0}
.bil .row.sub{color:var(--passif)}
.bil .row.tot{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:4px}
.k-fac .t-head{color:var(--passif)}
.t-head{white-space:normal !important;line-height:1.2;overflow:visible !important;text-overflow:clip !important;hyphens:auto;-webkit-hyphens:auto}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){ .split{grid-template-columns:1fr} }

/* --- Bilan et journal --- */
.inv td.am{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.inv td.tg2,.inv td.acc{width:1%;white-space:nowrap}
@keyframes fadein{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.pill.a{background:var(--actif-bg);color:var(--actif)}.pill.p{background:var(--passif-bg);color:var(--passif)}
.pill.acc{background:var(--soft);color:var(--ink)}
.bl{display:grid;grid-template-columns:1fr 1fr;max-width:720px;margin:0 auto}
.bl-title{grid-column:1/-1;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;padding-bottom:4px}
.bl-head.a{color:var(--actif)}.bl-head.p{color:var(--passif);text-align:right}
.bl-side.a{border-right:3px solid var(--ink)}
.br{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;padding:2px 4px;border-radius:4px}
.br.new{animation:pop 1.6s ease-out}
.br.cap{color:var(--res);font-weight:700}
.br.dec{color:var(--charge);font-weight:700}
.bt.bad{color:var(--charge)}
.qa.off{opacity:.25}
.acct td.n{text-align:right;font-variant-numeric:tabular-nums}
.acct th.n{text-align:right}
.rule .pm{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);font-size:22px;font-weight:700}
.rule .pm span:first-child{border-right:2px solid var(--ink)}
.rule .pm small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.plus{color:var(--produit)}.case{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity .3s,box-shadow .3s}
.case.on{box-shadow:0 0 0 2px var(--accent)}.case.off{opacity:.4}
.case p{margin:0 0 8px;font-size:14.5px}
.t-sides .sg{font-weight:700}
.bl-side.p .bg.hl{color:var(--passif)}
.bl-side.dim,.bl-head.dim{opacity:.3}
.t-head{white-space:normal !important;line-height:1.2;overflow:visible !important;text-overflow:clip !important;hyphens:auto;-webkit-hyphens:auto}

/* --- Salaires --- */
.taux{border:3px solid var(--accent);border-radius:14px;padding:12px 16px;background:#fffdf6}
.taux h3{margin:0 0 8px;font-family:Fraunces,Georgia,serif;color:var(--accent);display:flex;justify-content:space-between;align-items:baseline}
.taux h3 small{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:500}
.tt td.n,.tt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt tr.hl td{background:var(--hl);font-weight:600}
.slip td{padding:6px 10px;border-bottom:1px dashed var(--line)}
.slip td.n{text-align:right;white-space:nowrap}
.slip tr.sub td:first-child{border-left:4px solid var(--charge)}
.slip tr.add td.n{color:var(--produit)}.slip tr.sub td.n{color:var(--charge)}.slip tr.pay td.n{color:var(--actif)}
.slip tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.slip tr.cur td{background:var(--hl)}
.chip{display:inline-block;padding:2px 9px;border-radius:7px;font-weight:600;font-size:13px}
.chip.charge{background:var(--charge-bg);color:var(--charge)}
.chip.passif{background:var(--passif-bg);color:var(--passif)}
.chip.actif{background:var(--actif-bg);color:var(--actif)}
.jl2 th.n,.jl2 td.n{text-align:right}
.jl2 td{padding:6px 8px;border-bottom:1px dashed var(--line)}
.jl2 tr.cur td{background:var(--hl)}
.jl2 tr.new td{animation:pop 1.6s ease-out}
.jl2 tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.arrows{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.arw.off{opacity:.12}
.arw .line{height:4px;border-radius:2px;position:relative}
.arw .line::after{content:"";position:absolute;top:-6px;border:8px solid transparent}
.arw.r .line::after{right:-4px;border-left-color:inherit;border-left-width:12px;border-right-width:0}
.arw.l .line::after{left:-4px;border-right-color:inherit;border-right-width:12px;border-left-width:0}
.arw .lab{text-align:center;font-weight:600}
.arw .amt{font-variant-numeric:tabular-nums;font-weight:700}
.arw.new{animation:pop 1.6s ease-out}
.bal{display:flex;flex-direction:column;gap:6px;max-width:520px;margin:14px auto 0;font-size:14px}
.bal .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px}
.bal .row.tot{font-weight:700;border-top:2px solid var(--ink)}
.due{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.due h4{margin:0 0 6px;font-size:14px;color:var(--passif)}
.due .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:13.5px}
.due .row.tot{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:4px}
.due.on{box-shadow:0 0 0 2px var(--accent)}
/* --- Analyse financière --- */
:root{--liq:#DCEDD5;--cre:#B8DCAB;--sto:#95CA82;--circ:#3A7D23;--imm:#A9CBF5;--dct:#FBE3D6;--dlt:#FFFFCC;--csoc:#FFF3AB;--ccr:#FFEC79;--perm:#FFCC66}
.parts{display:flex;gap:6px;margin-top:12px}
.parts button{flex:1;font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 4px;cursor:pointer;line-height:1.2}
.parts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.parts button small{display:block;font-weight:500;font-size:10.5px;opacity:.75}
.dots .sep{width:8px;flex:none}
.bc{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.bc td{padding:4px 8px;border-bottom:1px solid #fff;transition:background .4s}
.bc td.n{text-align:right;white-space:nowrap}
.bc tr.pend td{background:#fff;outline:2px dashed var(--accent);outline-offset:-2px}
.bc th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:4px 8px;border-bottom:2px solid var(--ink)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.ba{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ba .gh{display:flex;justify-content:space-between;font-weight:700;padding:6px 10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.ba .gh.new{animation:ghin .7s ease-out}
@keyframes ghin{from{opacity:0;transform:translateX(16px)}}
.ba .gi{display:flex;justify-content:space-between;padding:2px 10px 2px 22px;font-size:12px;color:#444;font-variant-numeric:tabular-nums}
.ba .tot{display:flex;justify-content:space-between;font-weight:800;padding:7px 10px;border-top:2px solid var(--ink);font-variant-numeric:tabular-nums}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:0;max-width:640px;margin:0 auto;position:relative}
.bcol{display:flex;flex-direction:column;border:2px solid var(--ink)}
.bcol.p{border-left:0}
.blk{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:12.5px;font-weight:700;border-bottom:1px solid rgba(0,0,0,.25);transition:opacity .3s,box-shadow .3s;position:relative;overflow:hidden;min-height:24px}
.blk:last-child{border-bottom:0}
.blk small{font-weight:500;font-size:11.5px}
.blk.dim{opacity:.22}
.blk.num{box-shadow:inset 0 0 0 4px #1f7a4d;opacity:1}
.blk.den{box-shadow:inset 0 0 0 4px #2a52be;opacity:1}
.blk.num.den{box-shadow:inset 0 0 0 4px #1f7a4d,inset 0 0 0 8px #2a52be}
.bhead{display:grid;grid-template-columns:1fr 1fr;max-width:640px;margin:0 auto 4px;font-weight:700;font-size:13px}
.bhead div:last-child{text-align:right}
.brace{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12.5px}
.brace span{padding:3px 10px;border-radius:999px;font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;margin:0 6px}
.frac .nu{padding:0 4px 4px;border-bottom:4px solid var(--ink)}
.frac .de{padding:3px 4px 0}
.gchip{display:inline-block;padding:1px 8px;border-radius:7px;font-weight:700;font-size:13px;margin:1px;border:2px solid transparent}
.gchip.n{border-color:#1f7a4d}.gchip.d{border-color:#2a52be}
.ratio{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px}
.ratio .eq{font-weight:800;font-size:22px}
.gauge{position:relative;height:16px;border-radius:8px;background:#f1d4d4;margin:40px 0 26px;max-width:560px}
.gauge .ok{position:absolute;top:0;bottom:0;background:#bfe3c9;border-radius:8px}
.gauge .mk{position:absolute;top:-8px;width:4px;height:32px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .6s}
.gauge .mk span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-weight:800;font-size:13px;white-space:nowrap}
.gauge .lb{position:absolute;top:20px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.verdict{display:inline-block;margin-top:4px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px}
.verdict.ok{background:var(--produit-bg);color:var(--produit)}.verdict.warn{background:var(--charge-bg);color:var(--charge)}.verdict.info{background:var(--soft);color:var(--muted)}
.casc{width:100%;max-width:760px;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.casc td{padding:5px 8px}
.casc td.n{text-align:right;width:110px;white-space:nowrap}
.casc td.bar{width:44%}
.casc .bx{height:16px;border-radius:4px;transition:width .6s}
.casc tr.sub td:first-child{padding-left:22px;color:#444}
.casc tr.res td{font-weight:800;border-top:2px solid var(--ink)}
.casc tr.hide{visibility:hidden}
.casc tr.hl td{background:var(--hl)}
.casc tr.nu td:first-child{box-shadow:inset 4px 0 0 #1f7a4d}.casc tr.de td:first-child{box-shadow:inset 4px 0 0 #2a52be}
.dtab{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.dtab th,.dtab td{padding:4px 10px;border-bottom:1px dashed var(--line);text-align:right}
.dtab th:first-child,.dtab td:first-child{text-align:left}
.dtab tr.hl td{background:var(--hl);font-weight:700}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.legend b.n{color:#1f7a4d}.legend b.d{color:#2a52be}
.anab{width:100%;max-width:760px;margin:0 auto;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.anab td{width:50%;border:1px solid #fff;padding:6px 12px;font-weight:700;vertical-align:middle;transition:background .5s}
.anab .rb{display:flex;justify-content:space-between;gap:10px}
.anab td.grow{animation:cellin .9s ease-out}
@keyframes cellin{from{opacity:.2}}
.anab tr.t td{background:#fff;border-top:2px solid var(--ink);font-weight:800}
.rubg{display:grid;grid-template-columns:130px 1fr 1fr 130px;gap:0 6px;max-width:820px;margin:0 auto}
.rcol,.rside{display:flex;flex-direction:column;gap:3px}
.rside{padding-top:27px}
.rhead{font-weight:700;font-size:13px;height:24px}
.rcol:nth-child(3) .rhead{text-align:right}
.rub{height:46px;display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:15px;border-radius:4px;transition:background .4s}
.rub.tall{height:95px}
.rub.new{animation:rubin .8s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 0 3px var(--accent)}
@keyframes rubin{from{opacity:0;transform:scale(.85)}}
.rgap{height:16px;flex:none}
.rgrp{height:144px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:14px;border-radius:4px;padding:0 8px;opacity:0;transition:opacity .8s}
.rgrp.on{opacity:1}
.rfill{height:95px}
.rubd{border-radius:12px;padding:12px 16px;max-width:560px;animation:cellin .8s ease-out}
.rubt{font-weight:800;font-size:16px;margin-bottom:6px}
.rubt small{font-weight:500;font-size:13px}
.ruba{font-size:14.5px;padding:2px 0 2px 14px}
.bil2{display:grid;grid-template-columns:1fr 1fr;font-size:12.5px;font-variant-numeric:tabular-nums}
.bcl{display:flex;flex-direction:column;padding-right:12px}
.bcl.r{padding:0 0 0 12px;border-left:2px solid var(--ink)}
.br2{display:flex;justify-content:space-between;gap:10px;padding:2px 8px;border-bottom:1px solid #fff;transition:background-color .5s}
.br2.nw{animation:cellin .9s ease-out;font-weight:700}
.bcl .sp{height:10px;flex:none}
.bt2{display:flex;justify-content:space-between;margin-top:auto;padding:4px 8px 0;font-weight:800;border-top:2px solid var(--ink)}
.bcl .br2:last-of-type{margin-bottom:6px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:1fr 170px;gap:18px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.rnm{font-weight:700;font-size:14.5px;margin-bottom:6px}
.rnm small{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:10px}
.rrow .ratio{font-size:14px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:0 3px;width:170px}
.mc{display:flex;flex-direction:column;gap:2px}
.mb{height:21px;border-radius:2px;background:#e4e1da}
.mb.t{height:44px}
.mg{height:8px}
.rrow3{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 170px;gap:6px 18px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:6px 14px 10px}
.rrow3 .rnm{margin:0 0 4px;color:#2a52be;font-size:15.5px}

.cycf{font-size:15px;margin-bottom:10px;line-height:1.6}
.chart.cyc text{font-size:14px}
.chart.cyc .cyin{animation:cellin .8s ease-out}
.rgold{color:#c0262d;font-weight:800}
section.sec h2 span:not(.n){color:var(--muted)}
.rrow3>div:nth-child(2){padding-top:24px}
.rrow3.cur{box-shadow:0 0 0 2px var(--accent);animation:cellin .7s ease-out}
.rrow3 .ratio{font-size:14px;gap:6px}
.rrow3 .ratio .eq{font-size:19px}
.rnorm{font-size:12.5px;color:var(--muted);margin-top:8px}
.rnorm .verdict{margin:0 0 0 6px;padding:2px 9px;font-size:12px}
.rtxt{grid-column:1/-1;font-size:14px;border-top:1px dashed var(--line);padding-top:7px}
@media (max-width:1100px){ .two2{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="panel">
      <h1>L'analyse financière</h1>
      <p class="sub">Bilan analytique · ratios · EBIT et EBITDA</p>
      <div class="parts" id="parts"></div>
      <div class="dots" id="dots"></div>
    </div>

    <div class="panel" id="explain"></div>

    <div class="nav-wrap">
      <div class="nav">
        <button class="btn" id="prev">← Précédent</button>
        <button class="btn primary" id="next">Suite →</button>
      </div>
    </div>

    <div class="nav exit">
      <button class="btn quit" id="quit">Quitter</button>
    </div>
    <p class="note" id="quit-msg" style="display:none;color:#fff">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : fermer l'onglet.</p>
  </aside>

  <main class="stage" id="stage"></main>
</div>
<div class="zoombar"><button id="zm" title="Réduire la taille" aria-label="Réduire la taille">A−</button><button id="zp" title="Agrandir la taille" aria-label="Agrandir la taille">A+</button></div>

<script>
/* ---------- Réglages ---------- */
const Y = new Date().getFullYear() - 1;          // exercice analysé : l'année précédente
const ANS = {};
const fmt = n => { const neg=n<0; n=Math.abs(Math.round(n*100)/100); const [i,d]=n.toFixed(2).split('.');
  return (neg?'−':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,"'") + (d!=='00' ? '.'+d : ''); };
const pc = (x, d=1) => (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d) + '&nbsp;%';
const $ = id => document.getElementById(id);

/* ---------- Briques d'affichage ---------- */
const chipG = (g, cls='') => `<span class="gchip ${cls}" style="background:${G[g]?G[g].c:'#eee'}">${G[g]?G[g].lb:g}</span>`;
const frac = (nu, de) => `<span class="frac"><span class="nu">${nu}</span><span class="de">${de}</span></span>`;

// Bilan analytique en blocs proportionnels ; hl = {num:[groupes], den:[groupes]}
function blocks(hl, opts={}){
  const H = opts.h || 460, sc = v => Math.min(72, Math.max(34, v/TA*H));   // pas proportionnel : on plafonne les grandes rubriques
  const cls = g => !hl ? '' : (hl.num.includes(g) ? 'num' : '') + ' ' + (hl.den.includes(g) ? 'den' : '') + ((hl.num.includes(g)||hl.den.includes(g)) ? '' : ' dim');
  // Les deux colonnes ont la même hauteur : les immobilisés et les dettes à long terme prennent la place qui reste
  const COLH = Math.max(...[['liq','cre','sto','imm'],['dct','dlt','csoc','ccr']].map(c=>c.reduce((t,g)=>t+sc(T[g]),0)));
  const hgt = g => g==='imm' ? COLH-['liq','cre','sto'].reduce((t,x)=>t+sc(T[x]),0) : g==='dlt' ? COLH-['dct','csoc','ccr'].reduce((t,x)=>t+sc(T[x]),0) : sc(T[g]);
  const blk = g => hgt(g)<48 ? `<div class="blk ${cls(g)}" style="height:${hgt(g)}px;background:${G[g].c}"><span>${G[g].lb} <small>· ${fmt(T[g])} · ${pc(T[g]/TA*100,1)}</small></span></div>`
    : `<div class="blk ${cls(g)}" style="height:${hgt(g)}px;background:${G[g].c}">${G[g].lb}<small>${fmt(T[g])} · ${pc(T[g]/TA*100,1)}</small></div>`;
  return `<div class="bhead"><div>ACTIF</div><div>PASSIF</div></div>
    <div class="blocks"><div class="bcol a">${['liq','cre','sto','imm'].map(blk).join('')}</div><div class="bcol p">${['dct','dlt','csoc','ccr'].map(blk).join('')}</div></div>
    ${opts.brace?`<div class="brace"><span style="background:var(--circ);color:#fff">Circulants ${fmt(CIRC)}</span><span style="background:var(--dct)">Fonds étrangers ${fmt(DET)}</span>
      <span style="background:var(--csoc)">Capitaux propres ${fmt(CP)}</span><span style="background:var(--perm)">Capital permanent ${fmt(PERM)}</span></div>`:''}
    ${hl?`<div class="legend"><b class="n">▬ vert</b> : numérateur · <b class="d">▬ bleu</b> : dénominateur</div>`:''}`;
}

// Petit schéma du bilan analytique : rubriques utilisées en couleur, les autres en gris, sans chiffres
function mini(num, den, pale){
  // rubriques utilisées en couleur ; pale = true : celles qui ne sont qu'en bas de la division (un total) sont en couleur claire
  const b = (g, tall) => { const n = num.includes(g), d = den.includes(g);
    return `<div class="mb ${tall?'t':''}" title="${G[g].lb}" style="${n||(d&&!pale)?`background:${G[g].c}`:''}"></div>`; };
  return `<div class="mini"><div class="mc">${b('liq')}${b('cre')}${b('sto')}<div class="mg"></div>${b('imm',true)}</div>
    <div class="mc">${b('dct',true)}<div class="mg"></div>${b('dlt')}${b('csoc')}${b('ccr')}</div></div>`;
}

// Jauge : position de la valeur par rapport à la norme
function gauge(v, lo, hi, max, unit='%'){
  const p = x => Math.min(100, Math.max(0, x/max*100));
  return `<div class="gauge"><div class="ok" style="left:${p(lo)}%;width:${p(hi)-p(lo)}%"></div>
    <div class="mk" style="left:${p(v)}%"><span>${unit==='%'?pc(v,1):fmt(v)}</span></div>
    <div class="lb" style="left:${p(lo)}%">${lo}${unit}</div><div class="lb" style="left:${p(hi)}%">${hi}${unit}</div></div>`;
}

function ratioRow(k, cur){
  const r = R[k], den = denOf(r), tot = r.den==='TA' || r.den==='TP';
  return `<div class="rrow3 ${cur?'cur':''}">
    <div><div class="rnm">${r.nm}</div><div class="ratio">${frac(r.num.map(g=>chipG(g)).join(' + '), r.den==='TA'?`<b>Total de l'actif</b>`:r.den==='TP'?`<b>Total du passif</b>`:den.map(g=>chipG(g)).join(' + '))}</div></div>
    <div><div class="ratio">${frac(r.num.map(g=>fmt(T[g])).join(' + '), tot ? fmt(TA) : den.map(g=>fmt(T[g])).join(' + '))}<span class="eq">= ${pc(r.v,1)}</span></div>

}

 { part:'C', title:'La rentabilité',

/* Compte de résultat en cascade (upto = nombre de paliers visibles ; hl = résultat mis en évidence) */
function cascade(upto, hl){
  const rows = [
    ['CAN', CR.can, 'sub0', 0], ['− PRAMV', -CR.pramv, 'sub', 0], ['Bénéfice brut', CR.bb, 'res', 0, 'bb'],
    ['− Charges du personnel', -CR.pers, 'sub', 1], ['− Autres charges d\'exploitation (ACE)', -CR.ace, 'sub', 1], ['EBITDA', CR.ebitda, 'res', 1, 'ebitda'],
    ['− Amortissements', -CR.amort, 'sub', 2], ['EBIT', CR.ebit, 'res', 2, 'ebit'],
    ['− Charges financières', -CR.chfin, 'sub', 3], ['+ Produits financiers', CR.prfin, 'sub', 3], ['Résultat avant impôts', CR.rai, 'res', 3, 'rai'],
    ['− Impôts', -CR.imp, 'sub', 4], ['Résultat net', CR.bn, 'res', 4, 'bn']];
  const colr = {bb:'#2a52be', ebitda:'#6d48b3', ebit:'#0e7c86', rai:'#c98a10', bn:'#2b8352'};
  return `<section class="sec"><h2>Compte de résultat ${Y}</h2><table class="casc">
    ${rows.map(([l,v,k,p,key])=>`<tr class="${k==='res'?'res':k==='sub'?'sub':''} ${p>upto?'hide':''} ${hl&&key===hl?'nu hl':''} ${hl&&l==='CAN'?'de hl':''}"><td>${l}</td><td class="n">${fmt(v)}</td>
      <td class="bar"><div class="bx" style="width:${Math.abs(v)/CR.can*100}%;background:${k==='res'?colr[key]:v<0?'#e7a59a':'#9cc4e8'}"></div></td></tr>`).join('')}</table>
    ${hl?`<div class="legend"><b class="n">▬ vert</b> : numérateur · <b class="d">▬ bleu</b> : dénominateur</div>`:''}</section>`;
}

/* Étapes de ratios : une phase par ratio */
STEPS.forEach(s=>{ if (s.keys){ const fq = FAMQ[s.title[0]];
  s.ph = s.keys.map((k,i)=>({btn: i<s.keys.length-1 ? `${R[s.keys[i+1]].nm} →` : 'Suite →',
    text:`${fq}<br><br><b>${R[k].nm}</b> = ${R[k].nl} ÷ ${R[k].dl}.`}));
  s.unit = 'Ratio';
  if (s.q2) s.ph[s.q2.at].q = s.q2; s.stage = ph => catStage(s, ph); } });
const LAST = STEPS.length-1;

/* ---------- Actions ---------- */
const A = [];
STEPS.forEach((s,i)=>s.ph.forEach((_,p)=>A.push({step:i, ph:p})));
let pos = 0;

/* ---------- Rendu ---------- */
function qBox(key, q){
  const ch = ANS[key];
  const btn = (a,lb) => `<button class="ch ${ch===a?(a===q.ok?'ok':'ko'):''} ${ch?'':'blink'}" data-a="${a}" ${ch?'disabled':''}>${lb}</button>`;
  const fb = ch ? `<div class="fb ${ch===q.ok?'ok':'ko'}">${ch===q.ok?'✓ En effet':'✗ En fait'}, ${q.fb}</div>` : `<div class="hint">Cliquer sur la bonne réponse.</div>`;
  return `<div class="calc q"><div style="font-weight:600;margin-bottom:4px">La question à se poser</div>${q.text}
    <div class="choices" style="flex-wrap:wrap">${q.opts.map(([a,lb])=>btn(a,lb)).join('')}</div>${fb}</div>`;
}
function render(){
  pos = Math.max(0, Math.min(A.length-1, pos));
  const {step, ph} = A[pos], S = STEPS[step], P = S.ph[ph], key = step+'.'+ph;
  document.querySelectorAll('.dot').forEach(b=>{ const i=+b.dataset.s; b.classList.toggle('cur', i===step); b.classList.toggle('done', i<step); });
  document.querySelectorAll('#parts button').forEach(b=>b.classList.toggle('on', b.dataset.p===S.part));
  $('prev').disabled = pos===0;
  $('next').disabled = pos===A.length-1 || (P.q && !ANS[key]);
  $('next').textContent = pos===A.length-1 ? 'Terminé ✓' : P.btn;
  const pn = PARTS.find(p=>p[0]===S.part);
  $('explain').innerHTML = `<div class="stepno">Partie ${pn[0]} · ${pn[1]}</div><h2 class="steptitle">${STEPS.filter(x=>x.part===S.part).indexOf(S)+1}. ${S.title}</h2>
    <p class="steptext">${P.text.replace(/ ([?!;])/g,'&nbsp;$1')}</p>${P.q?qBox(key,P.q):''}`;
  $('stage').innerHTML = S.stage(ph);
  // Défilement automatique vers le nouvel élément (ratio, ligne de calcul…) s'il sort de l'écran
  const nw = $('stage').querySelector('[data-scroll]') || $('stage').querySelector('.rrow3.cur');
  if (nw) requestAnimationFrame(()=>nw.scrollIntoView({behavior:'smooth', block:'nearest'}));
  else window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Navigation ---------- */
function goTo(p){ pos = p; render(); }
function goStep(s){ goTo(A.findIndex(a=>a.step===s)); }
let Z = 1;
try { Z = +localStorage.getItem('analyse-zoom') || 1; } catch(e){}
function applyZoom(){
  Z = Math.round(Math.max(0.8, Math.min(1.6, Z))*10)/10;
  document.documentElement.style.setProperty('--z', Z);
  try { localStorage.setItem('analyse-zoom', Z); } catch(e){}
}
$('parts').innerHTML = PARTS.map(([p,l])=>`<button data-p="${p}">Partie ${p}<small>${l}</small></button>`).join('');
$('dots').innerHTML = STEPS.map((s,i)=>(i>0 && s.part!==STEPS[i-1].part ? '<span class="sep"></span>' : '') + `<button class="dot" data-s="${i}" title="${s.part} · ${s.title}" aria-label="${s.title}"></button>`).join('');
$('parts').addEventListener('click', e=>{ const b=e.target.closest('button'); if (b) goStep(STEPS.findIndex(s=>s.part===b.dataset.p)); });
$('zm').addEventListener('click', ()=>{ Z -= 0.1; applyZoom(); });
$('zp').addEventListener('click', ()=>{ Z += 0.1; applyZoom(); });
$('next').addEventListener('click', ()=>goTo(pos+1));
$('prev').addEventListener('click', ()=>goTo(pos-1));
$('explain').addEventListener('click', e=>{ const b=e.target.closest('.ch'); if (!b || b.disabled) return; const {step,ph}=A[pos]; ANS[step+'.'+ph] = b.dataset.a; render(); });
$('quit').addEventListener('click', ()=>{ window.close(); setTimeout(()=>{ $('quit-msg').style.display='block'; }, 300); });
$('dots').addEventListener('click', e=>{ const b=e.target.closest('.dot'); if (b) goStep(+b.dataset.s); });
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' && !$('next').disabled) goTo(pos+1);
  if (e.key==='ArrowLeft') goTo(pos-1);
});
render();
applyZoom();
</script>
<script src="theorie.js"></script>
</body>
