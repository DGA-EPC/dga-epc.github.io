<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le tableau de financement – théorie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theorie.css">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1e2226; --muted:#6a6f76; --line:#e2ddd2; --soft:#efebe3;
  --charge:#c2671f; --charge-bg:#fcefe3;
  --produit:#2b8352; --produit-bg:#e6f4eb;
  --res:#6d48b3; --res-bg:#efe9f9;
  --passif:#a3333d; --passif-bg:#f8e8ea;
  --bilan:#20394f; --bilan-bg:#e6ecf1;
  --actif:#2a52be; --actif-bg:#e8eefb;
  --accent:#c98a10; --accent-bg:#fff3d6;
  /* les trois secteurs et les liquidités (mêmes couleurs que le schéma Flux.xlsx) */
  --exp:#2f6db5; --exp-bg:#dbe8f6;
  --inv:#3f8f3a; --inv-bg:#dff0d6;
  --fin:#c95a24; --fin-bg:#fbe0d2;
  --liq:#b0418c; --liq-bg:#f4d6ee;
  --nm:#17739e;  --nm-bg:#9fd8f1;     /* non monétaire */
}

/* Fenêtre « Données de l'exercice » */
.btn.data{width:100%;margin-bottom:8px;background:var(--liq-bg);border-color:var(--liq);color:var(--ink)}
.btn.data.on{background:var(--liq);color:#fff}
.dlg{position:fixed;right:18px;top:60px;z-index:80;width:min(600px,calc(100vw - 24px));max-height:calc(100vh - 80px);max-width:calc(100vw - 16px);min-width:320px;min-height:140px;resize:both;overflow:hidden;display:flex;flex-direction:column;background:#fff;border:2px solid var(--liq);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);color:var(--ink)}
.dlg[hidden]{display:none}
.dlg-h{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;background:var(--liq-bg);border-radius:12px 12px 0 0;cursor:move;user-select:none;touch-action:none}
.dlg-h b{flex:1;font-size:13.5px}
.dlg-h button{font:600 12.5px Inter,system-ui,sans-serif;border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;cursor:pointer}
.dlg-h button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dlg-b{flex:1;min-height:0;overflow:auto;padding:8px 10px 10px;font-size:calc(12px * var(--dz,1))}
.dbil{display:grid;grid-template-columns:1fr 1fr;gap:0}
.dbil>div:first-child{border-right:2px solid var(--ink);padding-right:6px}
.dbil>div:last-child{padding-left:6px}
.dt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dt th{font-size:.92em;color:var(--muted);font-weight:600;text-align:right;border-bottom:2px solid var(--ink);padding:2px 3px}
.dt th:first-child{text-align:left;color:var(--ink);font-size:1.05em}
.dt td{padding:1px 3px;border-bottom:1px dotted var(--line);text-align:right;white-space:nowrap}
.dt td:first-child{text-align:left;white-space:normal}
.dt tr.g td{font-weight:700;font-size:.9em;color:var(--muted);border-bottom:0;padding-top:5px}
.dt tr.tot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.dt tr.hl td{background:var(--hl);font-weight:600}
.dinfo{margin-top:8px;font-size:.95em;background:#f6f3ec;border-left:4px solid var(--accent);border-radius:6px;padding:4px 8px}
.dinfo div::before{content:"• "}

/* Repère « Où en est-on dans le tableau ? » */
.plansec{padding:10px 14px 12px}
.plansec h2{margin-bottom:8px}
.plan{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.pg{flex:1 1 130px;border:2px solid var(--c);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--c);background:#fff;opacity:.3;display:flex;flex-direction:column;justify-content:center}
.pg.on{opacity:1;background:var(--cbg)}
.pg.exp{--c:var(--exp);--cbg:var(--exp-bg);flex:2.2 1 280px}
.pg.inv{--c:var(--inv);--cbg:var(--inv-bg)}.pg.fin{--c:var(--fin);--cbg:var(--fin-bg)}.pg.liq{--c:var(--liq);--cbg:var(--liq-bg)}
.pm{display:flex;gap:6px;margin-top:4px}
.pm span{flex:1;text-align:center;border-radius:7px;padding:2px 6px;font-size:12px;font-weight:600;background:#fff;border:1px dashed var(--c);opacity:.55}
.pm span.on{opacity:1;border-style:solid;background:var(--c);color:#fff}

/* Tri des autres charges */
.sortl{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.sorth{font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.sortr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 6px;border-bottom:1px dashed var(--line);border-radius:6px;animation:fadein .4s ease-out}
.sortr .am{text-align:right;font-weight:600}
.sortr .stg{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.sortr.cur{background:var(--hl);font-weight:700}
.sortr.out .lb,.sortr.out .am{text-decoration:line-through;color:var(--muted)}

/* Trois instruments de gestion */
.insg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ins table{width:100%;border-collapse:collapse;font-size:13.5px;animation:fadein .5s ease-out}
.ins th,.ins td{border:1px solid #6b6b6b;padding:6px 8px;text-align:center}
.ins th.t1{background:#7a1f2b;color:#fff;font-weight:600;font-size:14.5px}
.ins th.t2{background:#ecd3d8;font-weight:700;width:50%}
.ins td{text-align:left}
.ins td.big{height:74px;text-align:center}
.ins .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.law{margin-top:12px;border-left:4px solid #7a1f2b;background:#f9eef0;border-radius:6px;padding:8px 12px;font-size:14px}
.def.liq{border-color:var(--liq);background:#fdf5fb}
.def.liq h3{color:var(--liq)}
@media (max-width:1100px){ .insg{grid-template-columns:1fr} }

/* Résumé : du bilan au tableau des flux */
.rs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.rs h4{margin:0 0 4px;text-align:center;font-family:Fraunces,Georgia,serif;font-size:16px}
.rsT{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.rsT>div{display:flex;flex-direction:column;gap:3px;padding:4px}
.rsT>div:first-child{border-right:2px solid var(--ink)}
.rb{border-radius:6px;padding:6px 8px;font-size:13px;font-weight:600;background:#eeece7;color:#9a968c;transition:background .5s,color .5s,box-shadow .3s}
.rb small{display:block;font-weight:500;font-size:11.5px}
.rb.tall{min-height:58px}
.rb.on{color:var(--ink)}
.rb.cur{box-shadow:0 0 0 3px var(--accent)}
.rb.liq.on{background:var(--liq-bg)}.rb.exp.on{background:var(--exp-bg)}.rb.inv.on{background:var(--inv-bg)}.rb.fin.on{background:var(--fin-bg)}.rb.nm.on{background:var(--nm-bg)}
.rb.ad.on{background:repeating-linear-gradient(135deg,var(--exp-bg) 0 8px,var(--inv-bg) 8px 16px)}
.rsarr{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);margin:4px 0 14px}
.rsarr span::before{content:"↑";display:block;font-size:18px;line-height:1}
.rsF{display:flex;flex-direction:column;gap:6px}
.rsF .rb{font-size:13.5px}
.rsF .rb .f{font-weight:500;font-size:12.5px;margin-top:3px}
.rsF .meth{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rsnote{font-size:12.5px;color:var(--muted);margin-top:8px}
.calc.q{background:var(--bilan-bg)}
.ch.ko{background:var(--charge);border-color:var(--charge);color:#fff;opacity:1}
.fb.ko{border-left:4px solid var(--charge)}
.ch.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(32,57,79,0)}50%{box-shadow:0 0 0 5px rgba(201,138,16,.75);background:var(--accent-bg)}}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.new-card{animation:fadein .5s ease-out}

/* Parties */
.parts{display:flex;gap:6px;margin-top:12px}
.parts button{flex:1;font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 4px;cursor:pointer;line-height:1.2}
/* B et C : les deux méthodes du même secteur d'exploitation (même couleur) */
.parts button[data-p="B"],.parts button[data-p="C"]{border:2px solid var(--exp);background:var(--exp-bg)}
.parts button[data-p="B"].on,.parts button[data-p="C"].on{background:var(--exp) !important;border-color:var(--exp) !important}
.parts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.parts button small{display:block;font-weight:500;font-size:10.5px;opacity:.75}
.dots .sep{width:8px;flex:none}

/* Comptes en T */
.t{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px 8px;position:relative;min-width:0;max-width:380px}
.t-head{font-weight:700;font-size:13.5px;text-align:center;padding:0 4px;white-space:normal;line-height:1.2}
.t-body{display:grid;grid-template-columns:1fr 1fr;min-height:46px}
.col{padding:4px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ln{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px;font-size:12px;border-radius:4px;padding:1px 3px}
.ln .lb{color:var(--muted);line-height:1.25;min-width:0}
.ln.q{background:var(--accent-bg);outline:2px dashed var(--accent);outline-offset:-2px;font-weight:700}
.ln.q .am{color:var(--accent);font-size:14px}
.ln.new{background:var(--hl);font-weight:700;animation:pop 1.6s ease-out}
.ln.tot{border-top:1.5px solid var(--ink);margin-top:auto;font-weight:700;border-radius:0}
.ln.tot .lb{color:var(--ink)}

/* Tableau des flux */
.ft{width:100%;max-width:660px;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ft td{padding:5px 10px;border-bottom:1px dashed var(--line)}
.ft td.n{text-align:right;white-space:nowrap;width:120px}
.ft td.neg{color:var(--charge)}
.ft tr.sh td{font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--c,var(--muted));border-bottom:2px solid var(--c,var(--ink));padding-top:12px}
.ft tr.sh:first-child td{padding-top:2px}
.ft tr.sh.sub td{border-bottom:0;font-size:11.5px;padding-bottom:2px}   /* sous-titres (encaissements, achats…) : sans trait */
.ft tr.t td{font-weight:700;border-top:1.5px solid var(--ink)}
.ft tr.cf td{font-weight:800;font-size:15px;background:var(--exp-bg);color:var(--exp);border-top:2px solid var(--ink)}
.ft tr.vl td{font-weight:800;font-size:15px;background:var(--liq-bg);border-top:2px solid var(--ink)}
.ft tr.vl td.neg,.ft tr.cf td.neg{color:inherit}
.ft tr.new td{background:var(--hl);animation:pop 1.6s ease-out}
.ft tr.ok td{color:var(--produit);font-weight:800}

/* Extrait du bilan */
.bx{max-width:760px}
.bx td.up{color:var(--actif);font-weight:600}
.bx td.dn{color:var(--charge);font-weight:600}
.bx tr.hl td{background:var(--hl);font-weight:600}
.side{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:5px;padding:1px 5px;margin-right:4px;vertical-align:1px}
.side.A{background:var(--actif-bg);color:var(--actif)}
.side.P{background:var(--passif-bg);color:var(--passif)}
.fx{display:inline-block;padding:2px 9px;border-radius:7px;font-weight:600;font-size:12px;white-space:nowrap}
.fx.s{background:var(--produit-bg);color:var(--produit)}
.fx.u{background:var(--charge-bg);color:var(--charge)}
.fx.z{background:var(--soft);color:var(--muted)}
.fx.m{background:var(--produit-bg);color:var(--produit)}
.fx.n{background:#ece9f5;color:var(--res)}

/* Compte de résultat */
.crt{display:grid;grid-template-columns:1fr 1fr;max-width:760px;font-size:13.5px;font-variant-numeric:tabular-nums}
.crt>div{display:flex;flex-direction:column}
.crt>div:first-child{border-right:2px solid var(--ink);padding-right:12px}
.crt>div:last-child{padding-left:12px}
.crh{font-weight:700;border-bottom:2px solid var(--ink);padding:3px 4px}
.crr{display:flex;justify-content:space-between;gap:8px;padding:4px;border-bottom:1px dashed var(--line);align-items:center}
.crr span:first-child{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.crr.bn{color:var(--res);font-weight:700}
.crr.hl{background:var(--hl)}
.crr.tot{font-weight:800;border-top:2px solid var(--ink);border-bottom:0;margin-top:auto}

/* Grandes tuiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:660px}
.tile{border-radius:14px;padding:14px 16px;text-align:center;border:2px solid var(--c);background:#fff}
.tile .lb{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tile .big{font-family:Fraunces,Georgia,serif;font-size:36px;font-weight:700;color:var(--c);line-height:1.2;margin:4px 0}
.tile small{color:var(--muted)}
.tile.pop .big{animation:fadein .6s ease-out}

/* Secteurs */
.sects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sect{border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:12px 14px;transition:opacity .3s}
.sect .ico{font-size:26px;margin-bottom:4px}
.sect h4{margin:0 0 6px;color:var(--c);font-size:16px}
.sect p{margin:0 0 6px;font-size:13.5px}
.sect.off{opacity:.15}
.sect.on{box-shadow:0 0 0 2px var(--accent);animation:fadein .5s ease-out}
.eqbar{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:center;animation:fadein .5s ease-out}
.eqb{border:2px solid var(--c);border-radius:10px;padding:8px 14px;text-align:center;font-weight:700;color:var(--c);min-width:120px;font-variant-numeric:tabular-nums;background:#fff}
.eqb small{display:block;font-weight:600;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.eqop{align-self:center;font-size:22px;font-weight:800}

/* Règle sources / utilisations */
.rg{border-collapse:separate;border-spacing:6px;font-size:14px}
.rg th{font-weight:700;padding:4px 10px;font-size:15px}
.rg th.a{color:var(--actif)}.rg th.p{color:var(--passif)}
.rg td{padding:10px 16px;border-radius:10px;text-align:center;font-weight:700;min-width:170px;transition:box-shadow .3s}
.rg td.lb{text-align:right;color:var(--muted);min-width:0;padding:0 4px}
.rg td.src{background:var(--produit-bg);color:var(--produit)}
.rg td.use{background:var(--charge-bg);color:var(--charge)}
.rg td small{display:block;font-weight:500;font-size:12px;color:var(--ink)}
.rg td.on{box-shadow:0 0 0 3px var(--accent)}
.rg.sm td{padding:6px 10px;min-width:120px;font-size:13px}

/* Divers */
.donnee{font-size:14.5px;background:#f6f3ec;border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;margin-bottom:12px}
.dcalc{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.dcalc td{padding:4px 10px;border-bottom:1px dashed #9c9282}
.dcalc td.am{text-align:right;font-weight:600;white-space:nowrap}
.dcalc tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;background:var(--hl)}
.dcalc caption{text-align:left;font-weight:700;padding-bottom:6px}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.def{border:3px solid var(--produit);border-radius:14px;padding:12px 16px;background:#f6fbf7;max-width:660px;animation:fadein .5s ease-out}
.def h3{margin:0 0 6px;font-family:Fraunces,Georgia,serif;color:var(--produit)}
.def .f{font-size:15px;font-weight:700;margin-top:6px}
.qa{animation:fadein .5s ease-out}
.qa p{margin:0 0 6px}
.cards .qa.ok{box-shadow:0 0 0 2px var(--produit)}
.chart.wf text{font-size:12px}
.chart.wf .v{font-size:14px;font-weight:700}
.chart.wf .q{font-size:30px;font-weight:700}
.chart.wf .bar{animation:fadein .6s ease-out}

@media (max-width:1100px){ .split{grid-template-columns:1fr} }
@media print{ .dlg{display:none !important} }
@media (max-width:860px){ .rs{grid-template-columns:1fr} .dlg{top:auto;bottom:120px;right:12px;max-height:65vh} }
@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:12px 12px 90px}
  aside{position:static;max-height:none;overflow:visible}
  .nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(245,243,238,.95);backdrop-filter:blur(6px);padding:10px 12px;border-top:1px solid var(--line)}
  .two,.sects,.tiles{grid-template-columns:1fr}
  .rg td{min-width:0}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="panel">
      <h1>Le tableau de financement</h1>
      <p class="sub">Tableau des flux de trésorerie · méthodes directe et indirecte</p>
      <div class="parts" id="parts"></div>
      <div class="dots" id="dots"></div>
    </div>

    <div class="panel" id="explain"></div>

    <div class="nav-wrap">
      <button class="btn data" id="data-btn" title="Afficher le bilan et le compte de résultat de l'exercice">📋 Données : bilan · compte de résultat</button>
      <div class="nav">
        <button class="btn" id="prev">← Précédent</button>
        <button class="btn primary" id="next">Suite →</button>
      </div>
    </div>

    <div class="nav exit">
      <button class="btn quit" id="quit">Quitter</button>
    </div>
    <p class="note" id="quit-msg" style="display:none;color:#fff">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : fermer l'onglet.</p>
  </aside>

  <main class="stage" id="stage"></main>
</div>
<div class="dlg" id="dlg" hidden><div class="dlg-h" id="dlg-h"><b>📋 NovaNet SA · données de départ</b><button data-tab="b">Bilan</button><button data-tab="r">Résultat</button><button id="dzm" title="Réduire">A−</button><button id="dzp" title="Agrandir">A+</button><button id="dx" title="Fermer">✕</button></div><div class="dlg-b" id="dlg-b"></div></div>
<div class="zoombar"><button id="zm" title="Réduire la taille" aria-label="Réduire la taille">A−</button><button id="zp" title="Agrandir la taille" aria-label="Agrandir la taille">A+</button></div>

<script>
/* ---------- Réglages ---------- */
const Y = new Date().getFullYear() - 1, Y0 = Y - 1;   // exercice analysé (N) : l'année précédente ; N-1 : celle d'avant
const ANS = {};                                    // réponses choisies, clé "étape.phase"
const fmt = n => { const neg=n<0; n=Math.abs(Math.round(n*100)/100); const [i,d]=n.toFixed(2).split('.');
  return (neg?'−':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,"'") + (d!=='00' ? '.'+d : ''); };
const sgn = n => n>0 ? '+'+fmt(n) : fmt(n);
const $ = id => document.getElementById(id);
let CUR = {step:0, ph:0};
const done = () => !!ANS[CUR.step+'.'+CUR.ph];     // la question de la phase en cours a reçu une réponse

/* ---------- L'exemple : NovaNet SA (exercice 57.16) ---------- */
// [clé, compte, N-1, N, A/P]
const BIL = [
  ['cai','Caisse',12300,6450,'A'], ['pos','Poste',46780,62980,'A'], ['tit','Titres',64000,38000,'A'],
  ['cli','Créances clients',46720,74290,'A'], ['duc','− Ducroire',-2000,-3000,'A'],
  ['clin','Clients nets (créances − ducroire)',44720,71290,'A'],
  ['par','Produits à recevoir',5800,2600,'A'], ['sto','Stock de marchandises',86400,42600,'A'],
  ['mob','Mobilier',63000,86100,'A'], ['equ','Équipement',160000,160000,'A'],
  ['ptc','Participations',60000,80000,'A'], ['pre','Prêt à Bongo SA',160000,140000,'A'],
  ['fou','Dettes fournisseurs',48500,42420,'P'], ['div','Dividendes',20000,20000,'P'],
  ['cap','Charges à payer (salaires dus)',4500,2400,'P'], ['ban','Dette bancaire',50000,31000,'P'],

// Lignes d'un tableau jusqu'à la clé "upto" ; à partir de la clé "from" : lignes nouvelles (surlignées)
function trs(rows, upto, from){
  const iu = upto==null ? rows.length-1 : rows.findIndex(r=>r[0]===upto);
  const ifr = from==null ? 1e9 : rows.findIndex(r=>r[0]===from);
  return rows.slice(0, iu+1).map((r,i)=> r.length===2
    ? `<tr class="sh sub"><td colspan="2">${r[1]}</td></tr>`
    : `<tr class="${r[3]||''} ${i>=ifr?'new':''}" ${i===iu&&ifr<1e9?'data-scroll':''}><td>${r[1]}</td><td class="n ${r[2]<0?'neg':''}">${fmt(r[2])}</td></tr>`).join('');
}

// Extrait du bilan : o.hl = lignes surlignées, o.eff = effets affichés (true = tous), o.ask = effets à trouver (?), o.noEff = sans colonne Effet
function bx(ids, o={}){

// Cascade des liquidités : n = nombre de secteurs dévoilés (0 à 3)
function wf(n){
  const S = [[0,123080,'Liquidités','au 1.1','var(--liq)','123\'080'],
             [123080,235530,'Exploitation','(cash flow)','var(--exp)','+112\'450'],
             [146430,235530,'Investissement','','var(--inv)','−89\'100'],
             [107430,146430,'Financement','','var(--fin)','−39\'000'],
             [0,107430,'Liquidités','au 31.12','var(--liq)','107\'430']];
  const base = 245, sc = v => v*205/240000, W = 92, X = i => 34+i*122;
  let g = '';
  S.forEach(([lo,hi,l1,l2,col,val],i)=>{
    const x = X(i), y = base-sc(hi), h = sc(hi-lo), hid = i>=1 && i<=3 && i>n;
    g += hid ? `<rect x="${x}" y="${base-205}" width="${W}" height="205" rx="6" fill="none" stroke="#bbb" stroke-dasharray="6 5"/><text class="q" x="${x+W/2}" y="${base-90}" text-anchor="middle" style="fill:#bbb">?</text>`
             : `<g class="bar"><rect x="${x}" y="${y}" width="${W}" height="${h}" rx="4" style="fill:${col}" opacity=".88"/><text class="v" x="${x+W/2}" y="${y-7}" text-anchor="middle" style="fill:${col}">${val}</text></g>`;
    g += `<text x="${x+W/2}" y="${base+18}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${l1}</text><text x="${x+W/2}" y="${base+33}" text-anchor="middle">${l2}</text>`;
    if (i<4){ const lvl = [123080,235530,146430,107430][i], nextHid = i+1>=1 && i+1<=3 && i+1>n, curHid = hid;
      if (!nextHid && !curHid) g += `<line x1="${x+W}" x2="${X(i+1)}" y1="${base-sc(lvl)}" y2="${base-sc(lvl)}" stroke="#999" stroke-dasharray="3 3"/>`; }
  });
  return `<svg class="chart wf" viewBox="0 0 650 290" style="max-width:680px">${g}<line x1="20" x2="640" y1="${base}" y2="${base}" stroke="var(--ink)" stroke-width="2"/></svg>`;
}

 { part:'E', title:'Du bilan au tableau des flux',
   ph:[{btn:'Les liquidités →', text:`Une vue d'ensemble : comment passe-t-on du <b>bilan</b> (deux années) et du <b>compte de résultat</b> au <b>tableau des flux</b> ?<br><br>Règle des couleurs : <b>même couleur = même secteur</b>.`},

       {btn:'Méthode indirecte →', text:`<b>Bleu</b> : le secteur d'<b>exploitation</b>. Il utilise le reste de l'actif circulant, les dettes à court terme et les charges et produits <b>monétaires</b> (achats, ventes, autres charges et produits).<br><br>Méthode directe : produits monétaires − charges monétaires, corrigés avec les variations du circulant.`},
       {btn:'Investissement →', text:`<b>Bleu foncé</b> : la <b>méthode indirecte</b> part du bénéfice net et corrige les charges et produits <b>non monétaires</b> (amortissements, provisions, exceptionnels).<br><br>Les deux méthodes donnent le même <b>cash flow</b>.`},
       {btn:'Financement →', text:`<b>Vert</b> : les <b>actifs immobilisés</b> vont dans le secteur d'<b>investissement</b>. Tenir compte des amortissements pour retrouver les achats.`},

       {btn:'Suite →', text:`<b>Rayé</b> : les <b>autres dettes</b> dépendent de leur origine : achat d'un immobilisé → investissement ; sinon → exploitation.<br><br>Pour chaque variation du bilan : <b>actif ↑ = utilisation (−)</b>, <b>passif ↑ = source (+)</b>.`}],
   stage: ph => resume(ph) }
];
// Comptes à surligner dans la fenêtre « Données », étape par étape (dans l'ordre des étapes ; une fonction = selon la phase)
const LIQK = ['cai','pos','tit'];
const SEE = [
  ph => ph>=1 ? LIQK : [],                       // A1 : surligné après « Et les liquidités ? »
  LIQK,                                          // A2 fonds de trésorerie
  [],                                            // A3 trois secteurs
  ['sto','fou'],                                 // A4 sources et utilisations
  [],                                            // A5 construction du tableau : le cash flow
  ['amm','ame','vst'],                           // A6 monétaire ou non
  ph => [['ven'],['cli','duc'],['pfi'],['par']][ph],                // B1 encaissements, pas à pas
  ph => [['ach'],['fou'],['fou']][ph],                              // B2 achats
  ph => [['sal'],['cap'],...SORT.map(r=>[r[0]]),[]][ph],             // B3 salaires, charges à payer, puis chaque charge
  ph => [['bn'],['loy'],['amm'],['ame'],['bn','amm','ame']][ph],                              // C1 partir du bénéfice, pas à pas
  ph => [[],['cli','duc'],['par'],['sto'],['fou'],['cap'],['cli','duc','par','sto','fou','cap']][ph],   // C2 circulant, compte par compte
  [],                                            // C3 deux méthodes
  ph => [['mob','amm'],['mob','amm'],['equ','ame'],['ptc'],['pre'],['mob','equ','ptc','pre']][ph],   // D1 investissement, compte par compte
  ph => [['ban'],['ca'],['res','bn'],['div'],['ban','ca','res','div']][ph],                          // D2 financement, compte par compte
  ph => ph===3 ? LIQK : []];                                                                         // D3 tableau complet : liquidités au contrôle
STEPS.forEach((s,i)=>{ if (SEE[i]) s.see = SEE[i]; });
// Repère « Où en est-on dans le tableau ? » en haut des parties B, C et D
STEPS.forEach((s,i)=>{ if (s.plan) return;
  const k = STEPS.filter(x=>x.part===s.part).indexOf(s);
  if (s.part==='B') s.plan = ['dir'];
  if (s.part==='C') s.plan = k===2 ? ['dir','ind'] : ['ind'];
  if (s.part==='D') s.plan = [['inv'],['fin'],['dir','ind','inv','fin','tot'],null][k]; });
function planSec(f){
  const on = k => f.includes(k) ? 'on' : '';
  return `<section class="sec plansec"><h2>Où en est-on dans le tableau ?</h2><div class="plan">
    <div class="pg exp ${f.includes('dir')||f.includes('ind')?'on':''}">1. Secteur d'exploitation → cash flow<div class="pm"><span class="${on('dir')}">B. méthode directe</span><span class="${on('ind')}">C. méthode indirecte</span></div></div>
    <div class="pg inv ${on('inv')}">2. Secteur d'investissement</div><div class="pg fin ${on('fin')}">3. Secteur de financement</div>
    <div class="pg liq ${on('tot')}">= Variation des liquidités</div></div></section>`;
}
const seeOf = () => { const s = STEPS[CUR.step].see; return typeof s==='function' ? s(CUR.ph) : (s||[]); };
const LAST = STEPS.length-1;

/* ---------- Actions ---------- */
const A = [];
STEPS.forEach((s,i)=>s.ph.forEach((_,p)=>A.push({step:i, ph:p})));
let pos = 0;

/* ---------- Rendu ---------- */
function qBox(key, q){
  const ch = ANS[key];
  const btn = (a,lb) => `<button class="ch ${ch===a?(a===q.ok?'ok':'ko'):''} ${ch?'':'blink'}" data-a="${a}" ${ch?'disabled':''}>${lb}</button>`;
  const fb = ch ? `<div class="fb ${ch===q.ok?'ok':'ko'}">${ch===q.ok?'✓ En effet':'✗ En fait'}, ${q.fb}</div>` : `<div class="hint">Cliquer sur la bonne réponse.</div>`;
  return `<div class="calc q"><div style="font-weight:600;margin-bottom:4px">La question à se poser</div>${q.text}
    <div class="choices" style="flex-wrap:wrap">${q.opts.map(([a,lb])=>btn(a,lb)).join('')}</div>${fb}</div>`;
}
function render(){
  pos = Math.max(0, Math.min(A.length-1, pos));
  const {step, ph} = A[pos], S = STEPS[step], P = S.ph[ph], key = step+'.'+ph;
  CUR = {step, ph};
  document.querySelectorAll('#dots .dot').forEach(b=>{ const i=+b.dataset.s; b.classList.toggle('cur', i===step); b.classList.toggle('done', i<step); });
  document.querySelectorAll('#parts button').forEach(b=>b.classList.toggle('on', b.dataset.p===S.part));
  $('prev').disabled = pos===0;
  $('next').disabled = pos===A.length-1 || (P.q && !ANS[key]);
  $('next').textContent = pos===A.length-1 ? 'Terminé ✓' : P.btn;
  const pn = PARTS.find(p=>p[0]===S.part);
  $('explain').innerHTML = `<div class="stepno">Partie ${pn[0]} · ${pn[2]||pn[1]}</div><h2 class="steptitle">${STEPS.filter(x=>x.part===S.part).indexOf(S)+1}. ${S.title}</h2>
    ${P.text?`<p class="steptext">${P.text.replace(/ ([?!;])/g,'&nbsp;$1')}</p>`:''}${P.q?qBox(key,P.q):''}`;
  $('stage').innerHTML = (S.plan ? planSec(S.plan) : '') + S.stage(ph);
  dataRefresh();
  // Défilement automatique vers le nouvel élément s'il sort de l'écran
  const nw = $('stage').querySelector('tr.new[data-scroll]') || $('stage').querySelector('[data-scroll]');
  if (nw) requestAnimationFrame(()=>{ const r = nw.getBoundingClientRect(); if (r.bottom > innerHeight || r.top < 0) nw.scrollIntoView({behavior:'smooth', block:'nearest'}); });
  else window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Navigation ---------- */
function goTo(p){ pos = p; render(); }
function goStep(s){ goTo(A.findIndex(a=>a.step===s)); }
let Z = 1;
try { Z = +localStorage.getItem('flux-zoom') || 1; } catch(e){}
function applyZoom(){
  Z = Math.round(Math.max(0.8, Math.min(1.6, Z))*10)/10;
  document.documentElement.style.setProperty('--z', Z);
  try { localStorage.setItem('flux-zoom', Z); } catch(e){}
}
$('parts').innerHTML = PARTS.map(([p,l])=>`<button data-p="${p}">Partie ${p}<small>${l}</small></button>`).join('');
$('dots').innerHTML = STEPS.map((s,i)=>(i>0 && s.part!==STEPS[i-1].part ? '<span class="sep"></span>' : '') + `<button class="dot" data-s="${i}" title="${s.part} · ${s.title}" aria-label="${s.title}"></button>`).join('');
$('parts').addEventListener('click', e=>{ const b=e.target.closest('button'); if (b) goStep(STEPS.findIndex(s=>s.part===b.dataset.p)); });
$('zm').addEventListener('click', ()=>{ Z -= 0.1; applyZoom(); });
$('zp').addEventListener('click', ()=>{ Z += 0.1; applyZoom(); });
$('next').addEventListener('click', ()=>goTo(pos+1));
$('prev').addEventListener('click', ()=>goTo(pos-1));
$('explain').addEventListener('click', e=>{ const b=e.target.closest('.ch'); if (!b || b.disabled) return; const {step,ph}=A[pos]; ANS[step+'.'+ph] = b.dataset.a; render(); });
// Fenêtre « Données » : ouvrir / fermer, onglets, taille des caractères, déplacer par la barre de titre
$('data-btn').addEventListener('click', ()=>dataOpen());
$('dx').addEventListener('click', ()=>dataOpen(false));
$('dlg').querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ DTAB = b.dataset.tab; dataRefresh(); }));
// A−/A+ : les caractères ET la largeur du cadre suivent (le coin en bas à droite permet aussi de redimensionner à la main)
const dZoom = d => { DZ = Math.round(Math.max(0.8, Math.min(1.8, DZ+d))*10)/10; try { localStorage.setItem('flux-data-zoom', DZ); } catch(e){}
  const w = $('dlg'); w.style.width = Math.min(innerWidth-24, Math.round(600*DZ))+'px'; w.style.height = '';
  const r = w.getBoundingClientRect(); if (r.right > innerWidth-8){ w.style.left = Math.max(8, innerWidth-8-r.width)+'px'; w.style.right = 'auto'; }
  dataRefresh(); };
$('dzm').addEventListener('click', ()=>dZoom(-0.1));
$('dzp').addEventListener('click', ()=>dZoom(0.1));
(function(){ const d = $('dlg'), h = $('dlg-h'); let sx, sy, ox, oy, drag = false;
  h.addEventListener('pointerdown', e=>{ if (e.target.closest('button')) return; const r = d.getBoundingClientRect();
    drag = true; sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointermove', e=>{ if (!drag) return;
    d.style.left = Math.max(0, Math.min(innerWidth-80, ox+e.clientX-sx))+'px'; d.style.top = Math.max(0, Math.min(innerHeight-40, oy+e.clientY-sy))+'px';
    d.style.right = 'auto'; d.style.bottom = 'auto'; });
  h.addEventListener('pointerup', ()=>{ drag = false; });
})();
document.addEventListener('keydown', e=>{ if (e.key==='Escape') dataOpen(false); });
$('quit').addEventListener('click',()=>{ window.close(); setTimeout(()=>{ $('quit-msg').style.display='block'; }, 300); });
$('dots').addEventListener('click', e=>{ const b=e.target.closest('.dot'); if (b) goStep(+b.dataset.s); });
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' && !$('next').disabled) goTo(pos+1);
  if (e.key==='ArrowLeft') goTo(pos-1);
});
render();
applyZoom();
dataOpen(true);   // à l'ouverture de la page : le bilan de départ est affiché
</script>
<script src="theorie.js"></script>
</body>
</html>
