<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finances & comptabilité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b1f;
  --y1:#ff5fa2; --y2:#38bdf8; --y3:#4ade80;      /* *** Couleurs des 3 années *** */
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14); --ink:#f4f2ff; --muted:#b9b4d6;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Poppins,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}

/* Fond animé : bulles de couleur floues */
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;animation:float 18s ease-in-out infinite alternate}
.blob.a{width:520px;height:520px;background:#7c3aed;top:-140px;left:-120px}
.blob.b{width:460px;height:460px;background:#ec4899;bottom:-160px;right:-100px;animation-delay:-6s}
@keyframes float{to{transform:translate(60px,-40px) scale(1.15)}}

.wrap{position:relative;z-index:1;max-width:1260px;margin:0 auto;padding:28px 20px 40px}

/* En-tête */
header{text-align:center;padding:10px 0 30px;animation:drop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.9)}}
.super{display:inline-block;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#e9d5ff;background:rgba(255,255,255,.08);border:1px solid var(--line);padding:6px 14px;border-radius:999px}
h1{margin:14px 0 6px;font-size:calc(clamp(28px,4.4vw,52px) - 2px);font-weight:800;line-height:1.1}
.grad{background:linear-gradient(90deg,#fde047,#fb7185,#c084fc,#38bdf8,#4ade80,#fde047);background-size:300% 100%;
   -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.smile{display:inline-block;animation:bounce 2.2s ease-in-out infinite}
.smile.r{animation-delay:-1.1s}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(12deg)}}


/* Colonnes des années */
.years{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.year{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px 20px;backdrop-filter:blur(10px);
      animation:rise .7s ease-out both;position:relative;overflow:hidden}
.year:nth-child(2){animation-delay:.12s}.year:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
.year::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.year h2{margin:2px 0 14px;font-size:20px;display:flex;align-items:center;gap:10px}
.year h2 .num{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--c);color:#14102b;font-weight:800}
.year h2 .yt{display:flex;align-items:center;gap:3px}   /* carré du numéro collé à « ère année » */
.year h2 small{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}

/* Cartes de chapitre */
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);text-decoration:none;
      background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;cursor:pointer;
      transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}
.chap:hover{transform:translateY(-3px) scale(1.02);background:rgba(255,255,255,.11);border-color:var(--c);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.chap .em{font-size:24px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.08);flex:none;transition:transform .3s}
.chap:hover .em{transform:rotate(-10deg) scale(1.15)}
.chap .tx{flex:1;min-width:0}
.chap .no{font-size:11.5px;font-weight:700;color:var(--c);letter-spacing:.05em}
.chap .ti{font-weight:600;font-size:14.5px;line-height:1.25}
.chap .bd{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.b{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--muted)}
.b.th{background:rgba(56,189,248,.18);color:#7dd3fc}.b.ex{background:rgba(74,222,128,.16);color:#86efac}.b.qz{background:rgba(250,204,21,.18);color:#fde047}
.chap .go{color:var(--muted);font-size:18px;transition:transform .2s}
.chap:hover .go{transform:translateX(4px);color:var(--ink)}
.chap.soon{opacity:.45;cursor:default}
.chap.soon:hover{transform:none;box-shadow:none;border-color:var(--line);background:rgba(255,255,255,.05)}
.chap.lucky{background:linear-gradient(135deg,rgba(253,224,71,.18),rgba(251,146,60,.18));border-color:rgba(253,224,71,.5)}
.gap{height:14px}

/* Fenêtre des parties */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(8,6,20,.7);backdrop-filter:blur(6px);padding:20px}
.modal.open{display:flex}
.panel{width:min(520px,100%);background:#1a1636;border:1px solid var(--line);border-radius:22px;padding:20px 20px 16px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}}
.panel::before{content:"";display:block;height:5px;border-radius:5px;background:var(--c);margin:-6px 0 14px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ph .em{font-size:30px}
.ph h3{margin:0;font-size:19px;flex:1}
.x{background:rgba(255,255,255,.08);border:0;color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:18px;cursor:pointer}
.x:hover{background:rgba(255,255,255,.18)}
.parts{list-style:none;margin:0;padding:0}
.parts a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);padding:12px 14px;margin-bottom:9px;border-radius:14px;
         background:rgba(255,255,255,.06);border:1px solid var(--line);transition:transform .2s,background .2s;animation:slide .4s ease-out both}
.parts a:hover{transform:translateX(6px);background:rgba(255,255,255,.13)}
@keyframes slide{from{opacity:0;transform:translateX(-20px)}}
.parts .ic{font-size:22px}
.parts .pt{flex:1;font-weight:600;font-size:14.5px}

/* Pied de page */
.foot{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:30px}
.quote{max-width:720px;text-align:center;font-style:italic;color:#e9d5ff;font-size:16px;opacity:.9}
.quit{font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#f43f5e,#e11d48);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 8px 24px rgba(244,63,94,.35);transition:transform .2s}
.quit:hover{transform:scale(1.06)}

/* Confirmation de fermeture (conservée) */
.confirm{text-align:center}
.confirm .big{font-size:64px;margin:6px 0}
.confirm p{font-size:17px;font-weight:600;line-height:1.5}
.cbtn{display:flex;justify-content:center;gap:16px;margin-top:14px}
.cbtn button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 24px;cursor:pointer;transition:transform .25s}
.cbtn .yes{background:#f43f5e;color:#fff}.cbtn .yes:hover{transform:translateX(-80px)}
.cbtn .no{background:#22c55e;color:#fff}.cbtn .no:hover{transform:scale(1.4)}
.nodrip{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);font-size:clamp(60px,14vw,200px);font-weight:800;color:#f43f5e;text-shadow:0 0 30px rgba(244,63,94,.7);animation:drip 3s ease-in-out forwards}
@keyframes drip{0%{transform:translateY(-100%) scale(.5);opacity:0}20%{transform:none scale(1.2);opacity:1}40%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}60%{transform:rotate(3deg)}70%{transform:rotate(-3deg)}90%{transform:none;opacity:1}100%{transform:translateY(100vh) scale(.5);opacity:0}}


/* --- Version intermédiaire --- */
.wrap{max-width:1500px;padding:20px 22px 22px}
header{padding:6px 0 20px}
.super{font-size:12px;padding:5px 13px}
h1{margin:10px 0 0;font-size:calc(clamp(24px,3.4vw,44px) - 2px)}
.years{gap:20px}
.year{padding:15px 14px 14px;border-radius:20px}
.year h2{margin:0 0 12px;font-size:18.5px}
.year h2 .num{width:32px;height:32px;border-radius:10px;font-size:15px}
.chap{padding:9px 12px;margin-bottom:9px;border-radius:13px;gap:11px}
.chap .em{font-size:21px;width:37px;height:37px;border-radius:11px}
.chap .ti{font-size:14.5px}
.chap .no{display:inline-block;margin-right:6px;font-size:12px}
.chap .bd{margin-top:4px}
.b{font-size:11px;padding:2px 8px;text-decoration:none}
.b.go1{cursor:pointer;transition:transform .15s,filter .15s}
.b.go1:hover{transform:scale(1.1);filter:brightness(1.35);box-shadow:0 0 0 1px currentColor}
.gap{height:8px}
.foot{flex-direction:row;justify-content:center;gap:24px;margin-top:22px;flex-wrap:wrap}
.quote{font-size:15px;max-width:700px}
.quit{padding:10px 24px}

@media (max-width:960px){ .years{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>

<div class="wrap">
  <header>
    <span class="super">Tout le programme de Finances & Comptabilité</span>
    <h1><span class="smile">😊</span> <span class="grad">Je fais de la compta et c'est ma joie !</span> <span class="smile r">😊</span></h1>
  </header>

  <div class="years" id="programme"></div>

  <div class="foot">
    <div class="quote">« Celui qui veut faire quelque chose trouve un moyen, celui qui ne veut rien faire trouve des excuses ! » · Proverbe arabe</div>
    <button class="quit" onclick="openClose()">✕ Quitter</button>
  </div>
</div>

<!-- Fenêtre des parties d'un chapitre -->
<div class="modal" id="parts"><div class="panel">
  <div class="ph"><span class="em" id="p-em"></span><h3 id="p-ti"></h3><button class="x" onclick="closeModal('parts')">✕</button></div>
  <ul class="parts" id="p-list"></ul>
</div></div>

<!-- Confirmation de fermeture -->
<div class="modal" id="closeConfirm"><div class="panel confirm" style="--c:linear-gradient(90deg,#f43f5e,#fb923c)">
  <div class="ph"><h3>Sérieux là ?</h3><button class="x" onclick="closeModal('closeConfirm')">✕</button></div>
  <div class="big" id="closeEmoji">😱</div>
  <p id="closeMessage"></p>
  <div class="cbtn"><button class="yes" onclick="confirmClose()">OUI</button><button class="no" onclick="closeModal('closeConfirm')">NON</button></div>
</div></div>
<div class="nodrip" id="noDrip">Nooooooon !!!!!</div>

<script>
document.addEventListener('keydown', function(e) {
  if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) e.preventDefault();
});

// =====================================================================
//  LE PROGRAMME — c'est ici qu'on ajoute ou modifie chapitres et sous-chapitres
// ---------------------------------------------------------------------
//  Chapitre simple :          { titre: "14 TVA", lien: "La_Compta_TVA.html" },
//  Chapitre sans page :       { titre: "57 Tableau des flux" },            (affiché « bientôt »)
//  Chapitre avec sous-chapitres (s'ouvrent dans une fenêtre) :
//      { titre: "25 Salaires", fenetre: "25 Salaires - Parties", sous: [
//          { titre: "1. Etablir un décompte", lien: "La_Compta_SalairesDcpte.html" },
//          { titre: "2. Comptabiliser",       lien: "La_Compta_Salaires.html" },
//      ]},
//  ("fenetre" = titre de la fenêtre ; facultatif, sinon on reprend "titre")
//  Facultatif : emoji: "🧾"  pour choisir l'icône (sinon elle est trouvée automatiquement)
//  Espace vide entre deux chapitres :   { espace: true },
//  Le type de chaque partie (théorie, exercice, quiz) est reconnu tout seul :
//      lien qui finit par _th.html → 📘 théorie · lien ou titre avec « quiz » → 🎯 quiz · sinon ✏️ exercice
//  Sur la carte, chaque étiquette est cliquable : s'il n'y a qu'une page de ce type, elle s'ouvre directement ;
//  s'il y en a plusieurs, la fenêtre s'ouvre avec la liste complète. Un clic ailleurs sur la carte ouvre aussi la fenêtre.
// =====================================================================
const PROGRAMME = [
    { annee: "1ère année", chapitres: [
        { titre: "1.1 Introduction à la comptabilité", fenetre: "1 Introduction à la comptabilité", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_Introduction_th.html" },
            { titre: "2. Exercices : Etablir un bilan", lien: "La_Compta_Bilan.html" },
            { titre: "3. Exercice : la nature des comptes", lien: "La_Compta_Nature.html" },
			{ titre: "4. Exercices de journalisation", lien: "La_Compta_Journal.html" },
        ]},
        { titre: "1.2 Clôture des comptes", lien: "La_Compta_cloture_th.html" },
        { titre: "2 et 3 Les intérêts et l'impôt anticipé", fenetre: "2 Intérêts - Parties", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_Interets_th.html" },
			{ titre: "2. Calculer les jours", lien: "La_Compta_Jours.html" },
            { titre: "3. Calculer les intérêts", lien: "La_Compta_Interets.html" },
            { titre: "4. Journaliser", lien: "La_Compta_InteretsJrnl.html" },
        ]},
        { titre: "12 Marchandises", fenetre: "12 Marchandises - Chapitres", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_Marchandises_th.html" },
			{ titre: "2. Comptabilisation", lien: "La_Compta_Marchandises.html" },
            { titre: "3. Calcul du CAN, PRAMV, BB et BN", lien: "La_Compta_CAN.html" },
            { titre: "4. Schéma des prix", lien: "La_Compta_Prix.html" },
            { titre: "5. Etablir un Compte de résultat à 2 degrés", lien: "La_Compta_Resultat2.html" },
        ]},
        { titre: "13 Change", lien: "La_Compta_Change.html" },
        { titre: "14 TVA", lien: "La_Compta_TVA.html" },
    ]},

    { annee: "2ème année", chapitres: [
        { titre: "22 Pertes sur créances et provisions", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_Provisions_th.html" },
            { titre: "2. Exercices de comptabilisation", lien: "La_Compta_Provisions.html" },
        ]},
        { titre: "23 Les amortissements", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_Amortissements_th.html" },
            { titre: "2. Quiz", lien: "La_Compta_Amortissements_quiz.html" },			
            { titre: "3. Exercices de comptabilisation", lien: "La_Compta_Amortissements.html" },
        ]},
        { titre: "24 Les transitoires", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_Transitoires_th.html" },
            { titre: "2. Exercices de comptabilisation", lien: "La_Compta_Transitoires.html" },
        ]},
        { titre: "25 Salaires", fenetre: "25 Salaires - Parties", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_Salaires_th.html" },
            { titre: "2. Quiz", lien: "La_Compta_Salaires_quiz.html" },
            { titre: "3. Etablir un décompte", lien: "La_Compta_SalairesDcpte.html" },
            { titre: "4. Comptabiliser les écritures", lien: "La_Compta_Salaires.html" },
        ]},
        { titre: "35 Clôture d'une raison individuelle", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_cloture_th.html" },
            { titre: "2. Exercices de comptabilisation", lien: "La_Compta_ClotureRI.html" },
            { titre: "3. Quiz de révision", lien: "La_Compta_cloture_quiz.html" },
        ]},
        { titre: "36 La SA (Société anonyme)", fenetre: "36 Les SA - Parties", sous: [
            { titre: "1. Journalisation", lien: "La_Compta_SA-Journal.html" },
            { titre: "2. Etablir un tableau de répartition du bénéfice", lien: "La_Compta_SA-BN.html" },
        ]},
        { titre: "54 Titres", fenetre: "54 Les titres - Parties", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_Titres_th.html" },
            { titre: "2. Journalisation", lien: "La_Compta_Titres.html" },
            { titre: "3. Calcul du rendement des titres", lien: "La_Compta_Titres-Rdmt.html" },
        ]},
        { titre: "55 Immeubles", fenetre: "55 Immeubles - Parties", sous: [
            { titre: "1. Journalisation", lien: "La_Compta_Immeubles.html" },
            { titre: "2. Calcul de rendement", lien: "La_Compta_ImmeubleRdmt.html" },
        ]},
    ]},

    { annee: "3ème année", chapitres: [
        { titre: "37 Règles d'évaluation et réserves latentes", fenetre: "37 Règles d'évaluation et réserves latentes - Parties", sous: [
            { titre: "1. Tableau des réserves latentes", lien: "La_Compta_RL-Tableau.html" },
            { titre: "2. Journalisation de création/dissolution de réserves latentes", lien: "La_Compta_RL-Journal.html" },
        ]},
        { titre: "44 Seuil de rentabilité (point mort)", sous: [
            { titre: "1. Lecture d'un graphique", lien: "La_Compta_PM_Graphique.html" },
            { titre: "2. Réalisation d'un graphique", lien: "La_Compta_PM_GraphAFaire.html" },
            { titre: "3. Problèmes mathématiques", lien: "La_Compta_PM_Calculs.html" },
        ]},
        { titre: "51 Analyse financière", sous: [
            { titre: "1. Rappels théoriques", lien: "La_Compta_Analyse_th.html" },
            { titre: "2. Etablir un bilan analytique", lien: "La_Compta_Analyse_FaireleBilan.html" },		
			{ titre: "3. Analyser un bilan", lien: "La_Compta_Analyse_Ratios.html" },		
        ]},
        { titre: "56 Compte de résultat à 3/4 degrés", fenetre: "56 Comptes de résultat - Parties", sous: [
            { titre: "1. Etablir un Compte de résultat à 2 degrés (Révision)", lien: "La_Compta_Resultat2.html" },
            { titre: "2. Etablir un compte de résultat à 3 degrés", lien: "La_Compta_Resultat3.html" },
            { titre: "3. Etablir un compte de résultat à 4 degrés", lien: "La_Compta_Resultat4.html" },
            { titre: "4. Etablir un compte de résultat avec EBITDA, EBIT, etc.", lien: "La_Compta_EBIT.html" },
        ]},
        { titre: "57 Tableau des flux de trésorerie" },
        { titre: "59 Comptabilité analytique d'exploitation" },
        { espace: true },
        { titre: "Laisser le sort décider de la révision!", lien: "La_Compta_Loterie.html" },
    ]},
];

// ----- Icônes trouvées automatiquement d'après le titre (on peut en ajouter) -----
const ICONES = [
  ['introduction','📒'],['clôture','🔒'],['intérêt','💰'],['marchandise','📦'],['change','💱'],['tva','🧾'],
  ['pertes','💸'],['amortissement','📉'],['transitoire','⏳'],['salaire','👷'],['sa ','🏢'],['société','🏢'],['titres','📈'],
  ['immeuble','🏠'],['évaluation','🔍'],['seuil','⚖️'],['analyse','🔬'],['compte de résultat','📊'],['flux','🌊'],
  ['analytique','🧮'],['sort','🎲']];

// ----- Construction de la page (pas besoin d'y toucher) -----
const COUL = ['var(--y1)','var(--y2)','var(--y3)'];
const icone = ch => ch.emoji || (ICONES.find(([k])=>(ch.titre+' ').toLowerCase().includes(k)) || [,'📘'])[1];
const typeDe = s => /_th\.html$/i.test(s.lien||'') ? ['📘','Théorie','th'] : /quiz/i.test((s.lien||'')+s.titre) ? ['🎯','quiz','qz'] : ['✏️','exercice','ex'];
const decoupe = t => { const m = t.match(/^([\d.]+(?:\s+et\s+[\d.]+)?)\s+(.*)$/); return m ? [m[1], m[2]] : ['', t]; };

(function construirePage(){
  const zone = document.getElementById('programme');
  PROGRAMME.forEach((bloc, iy) => {
    const col = document.createElement('section');
    col.className = 'year'; col.style.setProperty('--c', COUL[iy % 3]);
    const nb = bloc.chapitres.filter(c=>!c.espace).length;
    col.innerHTML = `<h2><span class="yt"><span class="num">${iy+1}</span>${bloc.annee.replace(/^\d+/, '')}</span><small>${nb} thèmes</small></h2>`;
    bloc.chapitres.forEach(ch => {
      if (ch.espace) { col.insertAdjacentHTML('beforeend','<div class="gap"></div>'); return; }
      const [no, ti] = decoupe(ch.titre);
      let badges = '';
      if (ch.sous) {
        const g = {th:[], ex:[], qz:[]}; ch.sous.forEach(sb => g[typeDe(sb)[2]].push(sb));
        // un seul élément du type → lien direct ; plusieurs → la fenêtre s'ouvre (liste complète)
        const bdg = (k, txt) => !g[k].length ? '' : g[k].length===1
          ? `<a class="b ${k} go1" href="${g[k][0].lien}" target="_blank" title="${g[k][0].titre}">${txt}</a>`
          : `<span class="b ${k} go1" data-win="1" title="Voir la liste">${txt}</span>`;
        badges = bdg('th','📘 Théorie') + bdg('ex',`✏️ ${g.ex.length} exercice${g.ex.length>1?'s':''}`) + bdg('qz','🎯 quiz');
      } else if (/sort/i.test(ch.titre)) { badges = `<span class="b qz">🎲 révision au hasard</span>`;
      } else if (ch.lien) { const t = typeDe(ch); badges = `<span class="b ${t[2]}">${t[0]} ${t[1]}</span>`; }
      else badges = `<span class="b">🚧 bientôt</span>`;
      const el = document.createElement(ch.lien ? 'a' : 'div');
      el.className = 'chap' + (ch.lien||ch.sous ? '' : ' soon') + (/sort/i.test(ch.titre) ? ' lucky' : '');
      if (ch.lien) { el.href = ch.lien; el.target = '_blank'; }
      if (ch.sous) { el.setAttribute('role','button'); el.tabIndex = 0;
        el.onclick = e => { const a = e.target.closest('a.go1'); if (a) return; ouvrir(ch, COUL[iy % 3]); }; }
      el.innerHTML = `<span class="em">${icone(ch)}</span><span class="tx"><div class="ti">${no?`<span class="no">${no}</span>`:''}${ti}</div><div class="bd">${badges}</div></span><span class="go">${ch.lien||ch.sous?'›':''}</span>`;
      col.appendChild(el);
    });
    zone.appendChild(col);
  });
})();

function ouvrir(ch, c){
  const m = document.getElementById('parts');
  m.querySelector('.panel').style.setProperty('--c', c);
  document.getElementById('p-em').textContent = icone(ch);
  document.getElementById('p-ti').textContent = ch.fenetre || ch.titre;
  document.getElementById('p-list').innerHTML = ch.sous.map((s,i) => { const t = typeDe(s);
    return `<li><a href="${s.lien}" target="_blank" style="animation-delay:${i*70}ms"><span class="ic">${t[0]}</span><span class="pt">${s.titre}</span><span class="b ${t[2]}">${t[1]}</span></a></li>`; }).join('');
  m.classList.add('open');
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.addEventListener('click', e => { if (e.target.classList.contains('modal')) e.target.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open')); });

function confirmClose(){
  document.getElementById('noDrip').style.display = 'flex';
  setTimeout(() => { window.close(); window.location.href = 'about:blank'; }, 3000);
}
