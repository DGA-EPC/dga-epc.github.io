<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journalisation - Exercice de Comptabilité</title>
    <link rel="stylesheet" href="style.css">
    <!-- Réglages propres à cette page (le reste est dans style.css) -->
    <style>
        header, footer { border-top: 5px solid yellow; border-bottom: 5px solid blue; }
        h4 { margin-bottom: 0px; }
    </style>
</head>
<body>
    <header>
        <h2>Journalisation avec écritures multiples</h2>
        <h1>La SA</h1>
    </header>

    <!-- L'exercice est construit ici par journal.js -->
    <div class="container" id="exercice"></div>

    <script>
    const EXERCICE = {

        // ===== Comptes proposés dans les menus déroulants =====
        comptes: {
            "ACTIF": ["Caisse", "Poste", "Banque", "Créances clients", "Créances AFC", "Stock de marchandises", "Machines", "Véhicules", "Actionnaires", "Participants"],
            "PASSIF": ["Dettes fournisseurs", "Autres dettes", "Dettes AFC", "Dettes AVS", "Dividendes", "Tantièmes", "Capital-actions", "Capital-participations", "Réserve légale sur capital", "Réserve légale sur bénéfice", "Réserve libre", "Bénéfice de l'exercice", "Bénéfice reporté"],
            "MARCHANDISES": ["Ventes de marchandises", "Achats de marchandises"],
            "CHARGES ET PRODUITS": ["Salaires", "Charges sociales", "Loyers", "Electricité", "Frais de véhicules", "Frais d'administration", "ACE", "FAO", "Produits financiers"]
        },

        // ===== Écritures (ajouter les nouvelles à la fin, séparées par une virgule) =====
        // Modèle :  { description: "...", solution: [ { debit: "Compte", credit: "", amount: 100 }, ... ] }
        ecritures: [

        {
            description: "Versement par banque des tantièmes aux administrateurs, 1000, avec retenue AVS de 6.4%.",
            solution: [
                { debit: "Tantièmes", credit: "", amount: 1000 },
                { debit: "", credit: "Banque", amount: 936 },
                { debit: "", credit: "Dettes AVS", amount: 64 }
            ]
        },
        {
            description: "Paiement des dividendes, 2'000 brut, par virement bancaire.\nTenir compte de l'impôt anticipé.",

                { debit: "Dividendes", credit: "", amount: 2000 },
                { debit: "", credit: "Banque", amount: 1300 },
                { debit: "", credit: "Dettes AFC", amount: 700 }
            ]
        },
        {
            description: "Création d'un capital-participation par l'émission de 1'000 bons:\n- Capital émis:\t\tCHF 100'000\n- Prix d'émission:\tCHF     135 par bon.",
            solution: [
                { debit: "Participants", credit: "", amount: 135000 },
                { debit: "", credit: "Capital-participations", amount: 100000 },
                { debit: "", credit: "Réserve légale sur capital", amount: 35000 }

        {

                { debit: "Banque", credit: "Participants", amount: 30000 }
            ]

        {
            description: "Paiement par virement postal des frais d'augmentation de capital (notaire, inscrition au RC, révision), 800.",
            solution: [
                { debit: "FAO", credit: "Poste", amount: 800 }
            ]
        },
        {
            description: "La banque prélève une commission de CHF 125 sur le montant encaissé lors de la libération du capital.",
            solution: [
                { debit: "FAO", credit: "Banque", amount: 125 }
            ]
        },
        {
            description: "Nous versons par poste l'impôt anticipé retenu sur le versement des dividendes, 600.",
                solution: [
                { debit: "Dettes AFC", credit: "Poste", amount: 600 }
            ]
        },
        {
            description: "Trois amis créent une SA avec un capital-actions de 300. Comptabilisez la souscription, puis la libération suivante :\n- Versement bancaire:\t150\n- Apport d'une machine:\t 50\n- Apport de créances:\t 20\n- Apport de véhicules\t 80",

                    { debit: "Actionnaires", credit: "", amount: 300 },
                    { debit: "", credit: "Capital-actions", amount: 300 },
                    { debit: "Banque", credit: "", amount: 150 },
                    { debit: "Machines", credit: "", amount: 50 },
                    { debit: "Créances clients", credit: "", amount: 20 },
                    { debit: "Véhicules", credit: "", amount: 80 },
                    { debit: "", credit: "Actionnaires", amount: 300 }
                ]
        },
        {
            description: "Augmentation du capital-actions par l'émission de 1000 actions nouvelles de 100 de nominal. Prix de vente 120. Le capital est entièrement souscrit.",
            solution: [
                { debit: "Actionnaires", credit: "", amount: 120000 },
                { debit: "", credit: "Capital-actions", amount: 100000 },
                { debit: "", credit: "Réserve légale sur capital", amount: 20000 }
        ]
        },
        {
            description: "Les actionnaires libèrent 80% du capital souscrit à la banque.\nValeur nominale:\t100'000.-\nMontant souscrit:\t250'000.-",
                solution: [
                    { debit: "Banque", credit: "Actionnaires", amount: 330000 }
                ]

            {
                description: "L'AG a accepté la distribution de bénéfice suivante :\nBénéfice de l'exercice\t1000\n+ bénéfice reporté\t  80\n- Réserve légale\t  50\n- Dividende 5%\t\t 300\n- Tantièmes\t\t 100\n- Dons Croix rouge\t  70\n- Superdividende\t 550\nBénéfice à reporter\t  10",

                    { debit: "Bénéfice de l'exercice", credit: "", amount: 1000 },
                    { debit: "Bénéfice reporté", credit: "", amount: 80 },
                    { debit: "", credit: "Dividendes", amount: 850 },
                    { debit: "", credit: "Tantièmes", amount: 100 },
                    { debit: "", credit: "Réserve légale sur bénéfice", amount: 50 },
                    { debit: "", credit: "Autres dettes", amount: 70 },
                    { debit: "", credit: "Bénéfice reporté", amount: 10 }
                ]
         },
            {
                description: "Avant l'augmentation de capital, les actionnaires libèrent à la banque le solde du compte, soit 80'000.-.",
                solution: [
                    { debit: "Banque", credit: "Actionnaires", amount: 80000 }
                ]
            }

                description: "",
                solution: [
                    { debit: "", credit: "", amount:  },
                    { debit: "", credit: "", amount:   }
                ]
            }
            */
        ]
    };
    </script>
