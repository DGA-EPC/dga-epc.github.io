<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les opérations transitoires – théorie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theorie.css">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1e2226; --muted:#6a6f76; --line:#e2ddd2; --soft:#efebe3;
  --charge:#c2671f; --charge-bg:#fcefe3;
  --produit:#2b8352; --produit-bg:#e6f4eb;
  --res:#6d48b3; --res-bg:#efe9f9;
  --passif:#a3333d; --passif-bg:#f8e8ea;
  --bilan:#20394f; --bilan-bg:#e6ecf1;
  --actif:#2a52be; --actif-bg:#e8eefb;
  --accent:#c98a10; --accent-bg:#fff3d6;
  --y1:#e8eefb; --y2:#fff3d6;
}
.calc.q{background:var(--bilan-bg)}
.ch.ko{background:var(--charge);border-color:var(--charge);color:#fff;opacity:1}
.fb.ko{border-left:4px solid var(--charge)}
.tag.at{background:var(--actif-bg);color:var(--actif)}
.tag.pt{background:var(--passif-bg);color:var(--passif)}
.journal td.dt{color:var(--muted);white-space:nowrap}
.journal tr.todo td{opacity:0}
.btn.quiz{background:#037DFF;color:#fff;border-color:#037DFF;text-align:center;text-decoration:none}

/* Ligne du temps */
.tl-years{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;margin-bottom:4px}
.tl-years div:first-child{color:var(--actif)}.tl-years div:last-child{color:var(--accent)}
.tl-track{position:relative;height:62px;border-radius:10px;background:linear-gradient(90deg,var(--y1) 50%,var(--y2) 50%)}
.tl-cut{position:absolute;left:50%;top:-8px;bottom:-8px;border-left:3px dashed var(--passif);z-index:3}
.tl-cut span{position:absolute;bottom:-4px;left:6px;font-size:11px;font-weight:700;color:var(--passif);white-space:nowrap;background:#fff;padding:0 5px;border-radius:5px}
.tl-months{position:absolute;left:0;right:0;bottom:4px;display:grid;grid-template-columns:repeat(24,1fr);font-size:10px;color:var(--muted);text-align:center}
.tl-bar{position:absolute;top:6px;height:28px;border-radius:6px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;padding:0 4px;z-index:2;font-variant-numeric:tabular-nums}
.tl-bar.b1{background:var(--actif)}.tl-bar.b2{background:var(--accent)}
.tl-bar.fix{outline:3px solid #ffe08a;outline-offset:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.tl-mk{position:absolute;top:2px;height:36px;border-left:2px solid var(--ink);z-index:4}
.tl-mk span{position:absolute;top:50%;transform:translateY(-50%);left:5px;font-size:11.5px;font-weight:600;background:#fff;padding:1px 6px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tl-mk.left span{left:auto;right:5px}
/* Texte trop long pour sa case (p. ex. en agrandissant) : on réduit la police, puis on le sort de la case */
.tl-bar span{overflow:hidden;text-overflow:clip}
.tl-bar.out{overflow:visible}
.tl-bar.out span{position:absolute;right:calc(100% + 5px);color:var(--ink);font-size:11.5px !important;background:#fff;padding:1px 6px;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tl-bar.out.b2 span{right:auto;left:calc(100% + 5px)}

/* Exercices et comptes en T */
.years{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.yr{border:2px solid var(--y1);border-radius:12px;padding:10px 12px;transition:opacity .4s}
.yr.y2{border-color:var(--y2)}
.yr.off{opacity:.3}
.yr h3{margin:0 0 8px;font-family:Fraunces,Georgia,serif;font-size:17px}
.yr.y1 h3{color:var(--actif)}.yr.y2 h3{color:var(--accent)}
.t{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px 8px;position:relative;min-width:0}
.t-head{font-weight:700;font-size:13.5px;text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-body{display:grid;grid-template-columns:1fr 1fr;min-height:46px}
.col{padding:4px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ln{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px;font-size:11.5px;border-radius:4px;padding:1px 2px}
.ln .lb{color:var(--muted);line-height:1.25;min-width:0}
.ln.ext .lb{font-style:italic}
.eff .tag{font-size:11.5px}

/* Introduction et résumé */
.yrs3{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;text-align:center}
.yrs3 div{border-radius:12px;padding:14px 8px;background:var(--soft);color:var(--muted)}
.yrs3 div.on{background:var(--y1);color:var(--actif);box-shadow:0 0 0 2px var(--actif)}
.yrs3 b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:14px}
.quad .hd.pt{background:var(--passif-bg);color:var(--passif)}

@media (max-width:1100px){ .years{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:12px 12px 90px}
  aside{position:static;max-height:none;overflow:visible}
  .nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(245,243,238,.95);backdrop-filter:blur(6px);padding:10px 12px;border-top:1px solid var(--line)}
  .two,.quad{grid-template-columns:1fr}
}

.jr-stage{max-width:640px;margin-bottom:16px}
.jr-stage .journal{font-size:13.5px}
.tsign .col{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.tsign .col b{font-size:26px;line-height:1}
.tsign .col b.plus{color:#1f7a3a}.tsign .col b.minus{color:#c2410c}
.tsign .col small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="panel">
      <h1>Les opérations transitoires</h1>
      <p class="sub"><span id="subyrs"></span></p>
      <div class="dots" id="dots"></div>
    </div>

    <div class="panel" id="explain"></div>

    <div class="nav-wrap">
      <div class="nav">
        <button class="btn" id="prev">← Précédent</button>
        <button class="btn primary" id="next">Suivant →</button>
      </div>
    </div>


    <div class="nav exit">

      <button class="btn quit" id="quit">Quitter</button>
    </div>
    <p class="note" id="quit-msg" style="display:none;color:#fff">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : ferme l'onglet.</p>
  </aside>

  <main class="stage" id="stage"></main>
</div>
<div class="zoombar"><button id="zm" title="Réduire la taille" aria-label="Réduire la taille">A−</button><button id="zp" title="Agrandir la taille" aria-label="Agrandir la taille">A+</button></div>

<script>
/* ---------- Données modifiables ---------- */
const V0 = {hon:18000, ass:6000, int:240, rep:600, loyer:4200, lDeb:9, lN:6, cap:40000, taux:6, echJ:30, echM:10, typ:'dette'};
const V = {...V0};
const Y2 = new Date().getFullYear(), Y1 = Y2-1, Y0 = Y1-1;   // années : l'exercice précédent et l'année en cours
const ANS = {};                                              // réponses choisies (par étape)

const AT='Actifs transitoires', PT='Passifs transitoires';
const KIND = {'Honoraires':'produit','Produits financiers':'produit','Assurances':'charge','Frais de véhicules':'charge','Loyers':'charge','Charges financières':'charge',
  [AT]:'actif','Banque':'actif','Créances clients':'actif',[PT]:'passif','Dettes fournisseurs':'passif'};
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const INI = 'JFMAMJJASOND';
const TITLES = ['Le problème','Produit à recevoir','Charge payée d\'avance','Produit reçu d\'avance','Charge à payer',
                'Résumé des 4 situations','À cheval sur deux exercices','Les intérêts courus'];
const LAST = TITLES.length-1;

const fmt = n => { const neg=n<0; n=Math.abs(Math.round(n*100)/100); const [i,d]=n.toFixed(2).split('.');
  return (neg?'−':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,"'") + (d!=='00' ? '.'+d : ''); };
const $ = id => document.getElementById(id);
const d30 = (j,m) => (12-m)*30 + (30-Math.min(j,30));          // jours commerciaux jusqu'au 31.12
const r05 = x => Math.round(x*20)/20;                           // arrondi aux 5 centimes

/* ---------- Les cas ----------
   J : écritures {ph, y, d, c, amt, dt, ext}  ·  open : report à nouveau dans un compte au 1.1
   cp : compte de charge/produit corrigé · want : montant correct dans le résultat Y1    */
function rawCase(step){
  switch(step){
  case 1: { const a=V.hon; return {
    cp:'Honoraires', tr:AT, want:a, hide:true,
    story:`Nous avons effectué des travaux de comptabilité en <b>décembre ${Y1}</b>. Ils seront facturés en <b>janvier ${Y2}</b> : CHF <b>${fmt(a)}</b>.`,
    q:`Au 31.12.${Y1}, manque-t-il ou y a-t-il en trop ${fmt(a)} d'honoraires dans ma compta ${Y1} ?`,
    what:`${fmt(a)} d'honoraires`, ansTag:'manque',
    tl:{bars:[{from:11,to:12,label:'Travaux'}], marks:[{at:12.5,label:'Facture janv.'}], fix:Y1},
    J:[{ph:1,y:Y1,d:AT,c:'Honoraires',amt:a,dt:'31.12'},
       {ph:3,y:Y2,open:AT,side:'d',amt:a},
       {ph:3,y:Y2,d:'Honoraires',c:AT,amt:a,dt:'1.1',ext:1},
       {ph:4,y:Y2,d:'Créances clients',c:'Honoraires',amt:a,dt:'janv.'}],
    ph:[
      {btn:'Corriger au 31.12 →', text:`Le travail est fait en ${Y1}, mais rien n'est comptabilisé : la facture ne partira qu'en janvier.`},
      {btn:'Compléter l\'écriture →', text:`Il <b>manque</b> du produit : on l'ajoute au <b>crédit des Honoraires</b>.<p>Il manque le compte au <b>débit</b> : c'est obligatoirement un <b>Actifs transitoires</b>.`},
      {btn:'Passer au 1.1 →', text:`On inscrit <b>Actifs transitoires</b> au débit, dans le journal et dans le compte.`},
      {btn:'Saisir la facture →', text:`Le compte Honoraires ${Y2} contient maintenant ${fmt(a)} au <b>débit</b>, comme si le produit avait été « enlevé » de ${Y2}. Il attend la facture de janvier.`},
      {btn:'Étape suivante →', text:`En janvier, la facture est saisie normalement. Elle compense l'extourne : pour ces travaux, les Honoraires ${Y2} restent à <b>0</b>. Le produit est compté une seule fois, en ${Y1}.`}]};}
  case 2: { const a=V.ass; return {
    cp:'Assurances', tr:AT, want:0, hide:true,
    story:`Le <b>20 décembre ${Y1}</b>, nous avons payé l'assurance RC pour <b>${Y2}</b> : CHF <b>${fmt(a)}</b>.`,
    q:`Au 31.12.${Y1}, manque-t-il ou y a-t-il en trop ${fmt(a)} d'assurances dans ma compta ${Y1} ?`,
    what:`${fmt(a)} d'assurances`, ansTag:'trop',
    tl:{bars:[{from:12,to:24,label:`Couverture RC ${Y2}`}], marks:[{at:11.65,label:'Paiement 20.12'}], fix:Y2},
    J:[{ph:0,y:Y1,d:'Assurances',c:'Banque',amt:a,dt:'20.12'},
       {ph:1,y:Y1,d:AT,c:'Assurances',amt:a,dt:'31.12'},
       {ph:3,y:Y2,open:AT,side:'d',amt:a},
       {ph:3,y:Y2,d:'Assurances',c:AT,amt:a,dt:'1.1',ext:1}],
    ph:[
      {btn:'Corriger au 31.12 →', text:`Le paiement a été comptabilisé en décembre (Assurances / Banque).`},
      {btn:'Compléter l\'écriture →', text:`Il y a de la charge <b>en trop</b> : on la sort au <b>crédit des Assurances</b>.<p>Il manque le compte au <b>débit</b> : c'est obligatoirement un <b>Actifs transitoires</b>.`},
      {btn:'Passer au 1.1 →', text:`On inscrit <b>Actifs transitoires</b> au débit, dans le journal et dans le compte.`},
      {btn:'Étape suivante →', text:`La charge revient dans l'exercice qu'elle concerne : les Assurances ${Y2} contiennent ${fmt(a)} au débit.`}]};}
  case 3: { const a=V.int; return {
    cp:'Produits financiers', tr:PT, want:0, hide:true,
    story:`Nous avons prêté une somme à un employé. En <b>décembre ${Y1}</b>, il nous a versé les intérêts pour <b>${Y2}</b>&nbsp;:&nbsp;CHF&nbsp;<b>${fmt(a)}</b>.`,
    q:`Au 31.12.${Y1}, manque-t-il ou y a-t-il en trop ${fmt(a)} d'intérêts dans ma compta ${Y1} ?`,
    what:`${fmt(a)} d'intérêts`, ansTag:'trop',
    tl:{bars:[{from:12,to:24,label:`Intérêts ${Y2}`}], marks:[{at:11.6,label:'Encaissement déc.'}], fix:Y2},
    J:[{ph:0,y:Y1,d:'Banque',c:'Produits financiers',amt:a,dt:'déc.'},
       {ph:1,y:Y1,d:'Produits financiers',c:PT,amt:a,dt:'31.12'},
       {ph:3,y:Y2,open:PT,side:'c',amt:a},
       {ph:3,y:Y2,d:PT,c:'Produits financiers',amt:a,dt:'1.1',ext:1}],
    ph:[
      {btn:'Corriger au 31.12 →', text:`L'encaissement a été comptabilisé (Banque / Produits financiers).`},
      {btn:'Compléter l\'écriture →', text:`Il y a du produit <b>en trop</b> : on le sort au <b>débit des Produits financiers</b>.<p>Il manque le compte au <b>crédit</b> : c'est obligatoirement un <b>Passifs transitoires</b>.`},
      {btn:'Passer au 1.1 →', text:`On inscrit <b>Passifs transitoires</b> au crédit, dans le journal et dans le compte.`},
      {btn:'Étape suivante →', text:`Le produit revient dans l'exercice qu'il concerne : les Produits financiers ${Y2} contiennent ${fmt(a)} au crédit.`}]};}
  case 4: { const a=V.rep; return {
    cp:'Frais de véhicules', tr:PT, want:a, hide:true,
    story:`Nous avons fait réparer notre véhicule en <b>décembre ${Y1}</b>. La facture, estimée à CHF <b>${fmt(a)}</b>, nous parviendra en <b>janvier ${Y2}</b>.`,
    q:`Au 31.12.${Y1}, manque-t-il ou y a-t-il en trop ${fmt(a)} de charges dans ma compta ${Y1} ?`,
    what:`${fmt(a)} de frais de véhicules`, ansTag:'manque',
    tl:{bars:[{from:11.3,to:11.9,label:'Rép.'}], marks:[{at:12.5,label:'Facture janv.'}], fix:Y1},
    J:[{ph:1,y:Y1,d:'Frais de véhicules',c:PT,amt:a,dt:'31.12'},
       {ph:3,y:Y2,open:PT,side:'c',amt:a},
       {ph:3,y:Y2,d:PT,c:'Frais de véhicules',amt:a,dt:'1.1',ext:1},
       {ph:4,y:Y2,d:'Frais de véhicules',c:'Autres dettes',amt:a,dt:'janv.'}],
    ph:[
      {btn:'Corriger au 31.12 →', text:`La réparation a eu lieu en ${Y1}, mais la facture n'est pas arrivée : rien n'est comptabilisé. On connaît seulement une <b>estimation</b>.`},
      {btn:'Compléter l\'écriture →', text:`Il <b>manque</b> de la charge : on l'ajoute au <b>débit des Frais de véhicules</b>.<p>Il manque le compte au <b>crédit</b> : c'est obligatoirement un <b>Passifs transitoires</b>.`},
      {btn:'Passer au 1.1 →', text:`On inscrit <b>Passifs transitoires</b> au crédit, dans le journal et dans le compte.<p>Pas Dettes fournisseurs : la facture n'est pas encore reçue et le montant n'est qu'estimé.`},
      {btn:'Saisir la facture →', text:`Le compte Frais de véhicules ${Y2} contient maintenant ${fmt(a)} au <b>crédit</b>. Il attend la facture de janvier.`},
      {btn:'Étape suivante →', text:`En janvier, la facture est saisie normalement et compense l'extourne. Si la facture réelle est différente de l'estimation (p. ex. ${fmt(a+50)}), la différence (${fmt(50)}) tombe dans ${Y2}.`}]};}
  case 6: {
    const n=Math.max(1,V.lN), s=V.lDeb, fin=s-1+n, m26=Math.max(0,Math.min(n,fin-12)), pm=V.loyer/n, a=r05(pm*m26);
    return {
    cp:'Loyers', tr:AT, want:V.loyer-a, 
    story:`En octobre ${Y1}, nous avons payé le loyer de <b>${n} mois</b>, de ${MOIS[(s-1)%12]} à ${MOIS[(fin-1)%12]} : CHF <b>${fmt(V.loyer)}</b>.`,
    q:`Au 31.12.${Y1}, manque-t-il ou y a-t-il en trop des loyers dans ma compta ${Y1} ? Combien ?`,
    what:`${m26} mois de loyer`, ansTag:'trop',
    calc:`<div class="calc"><div style="font-weight:600;margin-bottom:4px">Part qui concerne ${Y2}</div>
      <div class="row"><span>Loyer mensuel : ${fmt(V.loyer)} ÷ ${n}</span><span>${fmt(pm)}</span></div>
      <div class="row"><span>× mois en ${Y2}</span><span>${m26}</span></div>
      <div class="row big"><span>= Loyer payé d'avance</span><span>${fmt(a)}</span></div></div>`,
    tl:{bars:[{from:s-1,to:fin,label:'Loyer', l25:fmt(V.loyer-a), l26:fmt(a)}], marks:[{at:9.5,label:'Paiement oct.'}], fix:Y2},
    J:[{ph:0,y:Y1,d:'Loyers',c:'Banque',amt:V.loyer,dt:'oct.'},
       {ph:1,y:Y1,d:AT,c:'Loyers',amt:a,dt:'31.12'},
       {ph:2,y:Y2,open:AT,side:'d',amt:a},
       {ph:2,y:Y2,d:'Loyers',c:AT,amt:a,dt:'1.1',ext:1}],
    ph:[
      {btn:'Calculer et corriger →', text:`Certaines charges ou produits couvrent une période <b>à cheval sur deux exercices</b>. Le paiement a été comptabilisé en entier en ${Y1} (Loyers / Banque).`},
      {btn:'Passer au 1.1 →', text:`On répartit au <b>prorata</b> du temps : seule la part qui concerne ${Y2} est corrigée. C'est une charge payée d'avance → <b>Actifs transitoires / Loyers</b>.`},
      {btn:'Étape suivante →', text:`Les ${m26} mois payés d'avance reviennent dans les Loyers ${Y2}, l'exercice qu'ils concernent.`}]};}
  case 7: {
    const pret = V.typ==='pret', j=d30(V.echJ,V.echM), a=r05(V.cap*V.taux*j/36000), an=r05(V.cap*V.taux/100);
    const cp = pret?'Produits financiers':'Charges financières', tr = pret?AT:PT, x=(V.echM-1)+(Math.min(V.echJ,30))/30;
    return {
    cp, tr, want:a,
    story: pret ? `Nous avons accordé un prêt de CHF <b>${fmt(V.cap)}</b> à <b>${V.taux} %</b>. Les intérêts sont encaissés une fois par an, à l'échéance du <b>${V.echJ}.${V.echM}</b>.`
                : `Nous avons une dette bancaire de CHF <b>${fmt(V.cap)}</b> à <b>${V.taux} %</b>. Les intérêts sont payés une fois par an, à l'échéance du <b>${V.echJ}.${V.echM}</b>.`,
    q:`Au 31.12.${Y1}, manque-t-il ou y a-t-il en trop des intérêts dans ma compta ${Y1} ? Combien ?`,
    what:`les intérêts du ${V.echJ}.${V.echM} au 31.12 (${j} jours)`, ansTag:'manque',
    calc:`<div class="calc"><div style="font-weight:600;margin-bottom:4px">Intérêts courus</div>
      <div class="row"><span>i = c × t × j ÷ 36'000</span><span></span></div>
      <div class="row"><span>${fmt(V.cap)} × ${V.taux} × ${j} ÷ 36'000</span><span></span></div>
      <div class="row big"><span>= Intérêts courus</span><span>${fmt(a)}</span></div>
      <div style="margin-top:6px;font-size:12.5px">j = jours de la dernière échéance à la clôture, mois de 30 jours (année de 360 jours).</div></div>`,
    tl:{bars:[{from:x,to:12,label:`${j} j · ${fmt(a)}`},{from:12,to:12+x,label:''}], marks:[{at:x,label:`Échéance ${V.echJ}.${V.echM}`},{at:12+x,label:`Échéance ${V.echJ}.${V.echM}`}], fix:Y1},
    J: pret ? [{ph:1,y:Y1,d:AT,c:cp,amt:a,dt:'31.12'},{ph:2,y:Y2,open:AT,side:'d',amt:a},{ph:2,y:Y2,d:cp,c:AT,amt:a,dt:'1.1',ext:1}]
            : [{ph:1,y:Y1,d:cp,c:PT,amt:a,dt:'31.12'},{ph:2,y:Y2,open:PT,side:'c',amt:a},{ph:2,y:Y2,d:PT,c:cp,amt:a,dt:'1.1',ext:1}],
    ph:[
      {btn:'Calculer et corriger →', text:`Entre la dernière échéance et la clôture, des intérêts se sont accumulés sans être ${pret?'encaissés':'payés'} : ce sont les <b>intérêts courus</b>.`},
      {btn:'Passer au 1.1 →', text: pret ? `C'est un <b>produit à recevoir</b> → <b>Actifs transitoires / Produits financiers</b>.` : `C'est une <b>charge à payer</b> → <b>Charges financières / Passifs transitoires</b>.`},
      {btn:'Étape suivante →', text:`Le compte ${cp} ${Y2} contient maintenant ${fmt(a)} au ${pret?'débit':'crédit'}. À l'échéance de ${Y2}, la banque ${pret?'versera':'débitera'} les intérêts d'une année entière (${fmt(an)}). Grâce à l'extourne, seule la part ${Y2} (${fmt(an-a)}) restera dans le compte de ${Y2}.`}]};}
  }
  return null;
}

/* Ajoute la phase « Situation au 1.1 » avant l'extourne */
function getCase(step){
  const c = rawCase(step); if (!c) return c;
  c.p11 = c.hide ? 3 : 2;                                    // phase « Situation au 1.1 »
  c.J.forEach(e=>{ if (!e.open && e.ph>=c.p11) e.ph++; });
  let k = 1; c.J.forEach(e=>{ if (!e.open) e.n = k++; });   // N° du journal
  const x = c.J.find(e=>e.ext), side = c.tr===AT ? 'débit' : 'crédit';
  c.ph.splice(c.p11, 0, {btn:'Extourner →', text:`Le <b>1.1.${Y2}</b>, un nouvel exercice commence.<br><br>
    • Le compte <b>${c.tr}</b> est un compte du bilan : il est rouvert avec son <b>solde à nouveau</b> (sàn) de ${fmt(x.amt)} au ${side}.<br>
    • Le compte <b>${c.cp}</b> est un compte de gestion : il a été viré au compte de résultat ${Y1}, il repart donc <b>vide</b>.<br><br>
    Le transitoire a fait son travail : <b>corriger le résultat ${Y1}.</b> Il faut maintenant l'extourner.`});
  c.ph[c.p11+1].text = `L'<b>extourne</b> est l'écriture <b>inverse</b> de celle du 31.12 : <b>${x.d} / ${x.c}</b> ${fmt(x.amt)}.<br><br>
    Elle solde le compte ${c.tr} (sàn ${fmt(x.amt)} − extourne ${fmt(x.amt)} = 0). ` + c.ph[c.p11+1].text;
  return c;
}

/* ---------- Actions (un clic = une phase) ---------- */
let A = [], pos = 0;
function buildActions(){
  A = [];
  for (let s=0; s<=LAST; s++){ const c=getCase(s); const n = c ? c.ph.length : 1; for (let p=0;p<n;p++) A.push({step:s, ph:p}); }
}
buildActions();

/* ---------- Comptes en T ---------- */
function postings(c, acc, y, ph){
  const P = {d:[], c:[]};
  c.J.forEach(e=>{
    if (e.y!==y || e.ph>ph) return;
    const fresh = e.ph===ph;
    if (e.open){ if (e.open===acc) P[e.side].push({lb:'sàn', amt:e.amt, fresh}); return; }
    if (e.d===acc) P.d.push({lb: e.n, amt:e.amt, fresh, ext:e.ext});
    if (e.c===acc) P.c.push({lb: e.n, amt:e.amt, fresh, ext:e.ext});
  });
  return P;
}
function accountsOf(c, y){
  const L = [c.cp, c.tr];
  c.J.forEach(e=>{ if (e.y!==y) return; [e.d,e.c,e.open].forEach(a=>{ if (a && !L.includes(a)) L.push(a); }); });
  return L;
}
const bal = (P,k) => { const sd=P.d.reduce((s,l)=>s+l.amt,0), sc=P.c.reduce((s,l)=>s+l.amt,0); return (k==='charge'||k==='actif') ? sd-sc : sc-sd; };
function tHTML(acc, P, focus, eff, label){   // label : nom affiché (« ? » tant que le compte est caché)
  const col = arr => arr.map(l=>`<div class="ln ${l.fresh?'fresh':''} ${l.ext?'ext':''}"><span class="lb">${l.lb}</span><span class="am">${fmt(l.amt)}</span></div>`).join('');
  return `<div class="t ${label?'':'k-'+KIND[acc]} ${focus?'focus':''}">
    <div class="t-sides"><span>D</span><span class="t-head" title="${label||acc}">${label||acc}</span><span>C</span></div>
    <div class="t-body"><div class="col d">${col(P.d)}</div><div class="col c">${col(P.c)}</div></div>
    ${eff?`<div class="eff">${eff}</div>`:''}</div>`;
}

/* ---------- Ligne du temps (0 = 1.1 de Y1, 12 = 31.12 de Y1, 24 = 31.12 de Y2) ---------- */
function timeline(tl, ph){
  const pc = x => (Math.max(0,Math.min(24,x))/24*100)+'%';
  let bars = '';
  tl.bars.forEach(b=>{
    const segs = [];
    if (b.from<12) segs.push({f:b.from, t:Math.min(12,b.to), y:Y1, lb: b.to>12 ? (b.l25??b.label) : b.label});
    if (b.to>12)  segs.push({f:Math.max(12,b.from), t:b.to, y:Y2, lb: b.from<12 ? (b.l26??'') : b.label});
    segs.forEach(s=>{ bars += `<div class="tl-bar ${s.y===Y1?'b1':'b2'} ${ph>=1 && tl.fix===s.y ? 'fix':''}" style="left:${pc(s.f)};width:calc(${pc(s.t)} - ${pc(s.f)})" title="${s.lb}"><span>${s.lb}</span></div>`; });
  });
  const marks = tl.marks.map(m=>`<div class="tl-mk ${m.at<12?'left':''}" style="left:${pc(m.at)}"><span>${m.label}</span></div>`).join('');
  return `<div class="tl-years"><div>${Y1}</div><div>${Y2}</div></div>
    <div class="tl-track">${bars}${marks}<div class="tl-cut"><span>31.12 · clôture</span></div>
    <div class="tl-months">${(INI+INI).split('').map(m=>`<span>${m}</span>`).join('')}</div></div>`;
}

/* ---------- Rendu ---------- */
const LET = i => String.fromCharCode(65+i);   // A, B, C…
/* Ajuste les étiquettes de la ligne du temps à la place disponible (taille d'affichage, largeur de la fenêtre) */
function fitTL(){
  document.querySelectorAll('.tl-track').forEach(tr=>{
    tr.querySelectorAll('.tl-bar').forEach(b=>{
      const sp = b.querySelector('span'); if (!sp || !sp.textContent) return;
      b.classList.remove('out'); b.style.justifyContent = ''; let f = 12; sp.style.fontSize = f+'px';
      while (sp.scrollWidth > b.clientWidth - 10 && f > 10.5){ f -= 0.5; sp.style.fontSize = f+'px'; }
      if (sp.scrollWidth > b.clientWidth - 10) b.classList.add('out');
    });
    // étiquettes des traits : à gauche du trait dans l'année de gauche, à droite dans celle de droite ; on change de côté si elles sortent de la ligne
    const T = tr.getBoundingClientRect();
    const outside = r => r.left < T.left || r.right > T.right;
    tr.querySelectorAll('.tl-mk').forEach(m=>{
      const left = m.dataset.side ? m.dataset.side==='left' : m.classList.contains('left');
      m.dataset.side = left ? 'left' : 'right';
      m.classList.toggle('left', left);
      if (outside(m.querySelector('span').getBoundingClientRect())) m.classList.toggle('left', !left);
    });
    const mks = [...tr.querySelectorAll('.tl-mk')].flatMap(m=>[m.getBoundingClientRect(), m.querySelector('span').getBoundingClientRect()]);
    const over = r => mks.some(o=>r.left < o.right + 3 && r.right > o.left - 3);
    // texte sorti d'une case : s'il touche une étiquette, on le pousse plus loin, à gauche (ou à droite) de celle-ci
    tr.querySelectorAll('.tl-bar.out span').forEach(sp=>{
      sp.style.transform = '';
      const r = sp.getBoundingClientRect(), k = r.width / sp.offsetWidth || 1, toLeft = !sp.parentNode.classList.contains('b2');
      const hits = mks.filter(o=>r.left < o.right + 3 && r.right > o.left - 3);
      if (!hits.length) return;
      const d = toLeft ? Math.min(...hits.map(o=>o.left)) - 5 - r.right : Math.max(...hits.map(o=>o.right)) + 5 - r.left;
      sp.style.transform = `translateX(${d/k}px)`;
    });
    // texte d'une case caché par une étiquette ou un trait : on le pousse au bout de la case
    tr.querySelectorAll('.tl-bar:not(.out) span').forEach(sp=>{ if (sp.textContent && over(sp.getBoundingClientRect())) sp.parentNode.style.justifyContent = 'flex-end'; });
  });
}
window.addEventListener('resize', fitTL);

function render(){
  pos = Math.max(0, Math.min(A.length-1, pos));
  const {step, ph} = A[pos];
  const c = getCase(step);
  document.querySelectorAll('.dot').forEach((b,i)=>{ b.classList.toggle('cur', i===step); b.classList.toggle('done', i<step); });
  $('prev').disabled = pos===0;
  $('next').disabled = pos===A.length-1 || (!!c && ph===0 && !ANS[step]);
  $('next').textContent = pos===A.length-1 ? 'Terminé ✓' : c ? c.ph[ph].btn : 'Suivant →';
  if (step===0) renderIntro(); else if (step===5) renderResume(); else renderCase(c, step, ph);
  fitTL();
}

function renderCase(c, step, ph){
  const last = c.ph.length-1;
  // Panneau d'explication
  const ok = c.ansTag, ch = ANS[step];
  const core = ok==='manque' ? `il manque ${c.what} en ${Y1}` : `il y a ${c.what} en trop en ${Y1}`;
  const act = `il faut donc <b>${ok==='manque'?'AJOUTER':'ENLEVER'}</b> ${KIND[c.cp]==='produit'?'le produit':'la charge'}.`;
  const btn = (a,lb) => `<button class="ch ${ch===a?(a===ok?'ok':'ko'):''} ${ch?'':'blink'}" data-a="${a}" ${ch?'disabled':''}>${lb}</button>`;
  const choices = (ph===0 || ch) ? `<div class="choices">${btn('manque','manque')}${btn('trop','est en trop')}</div>` : '';
  const fb = ch ? `<div class="fb ${ch===ok?'ok':'ko'}">${ch===ok?'✓ En effet':'✗ En fait'}, ${core} : ${act}</div>`
           : ph>=1 ? `<div class="fb">Réponse : ${core} : ${act}</div>`
           : `<div class="hint">Cliquer sur la bonne réponse pour continuer.</div>`;
  const qBox = ph>=1 ? '' : `<div class="calc q"><div style="font-weight:600;margin-bottom:4px">La question à se poser</div>${c.q}${choices}${fb}</div>`;
  const rows = c.J.filter(e=>!e.open);
  const hid = c.hide && ph===1, nm = a => hid && a===c.tr ? '?' : a;   // compte transitoire pas encore nommé
  const rv = c.hide && ph===2;                                           // phase où il apparaît : on le met en évidence
  const jr = `<table class="journal"><caption>Journal</caption><tr><th>N°</th><th>Date</th><th>Débit</th><th>Crédit</th><th class="am">Montant</th></tr>
    ${rows.map(e=>`<tr class="${e.ph===ph || (rv && e.ph===1)?'cur':e.ph>ph?'todo':''}"><td>${e.n}</td><td class="dt">${e.dt}${e.ext?' · extourne':''}</td><td>${nm(e.d)}</td><td>${nm(e.c)}</td><td class="am">${fmt(e.amt)}</td></tr>`).join('')}</table>`;
  $('explain').innerHTML = `<h2 class="steptitle">${LET(step)}. ${TITLES[step]}</h2>
    <p class="steptext">${c.ph[ph].text}</p>${qBox}${ph>=1 && c.calc ? c.calc : ''}`;

  // Scène
  const yearCol = y => {
    const on = y===Y1 || ph>=c.p11;
    const accs = accountsOf(c, y);
    const ts = accs.map(acc=>{
      const P = postings(c, acc, y, on?ph:-1);
      const k = KIND[acc], b = bal(P,k);
      let eff = '';
      if (acc===c.cp && on){
        const ok = Math.abs(b - (y===Y1?c.want:b))<0.01;
        eff = y===Y1 ? `Dans le résultat ${Y1} : <span class="tag ${ok?'good':'bad'}">${fmt(b)} ${ok?'✓':'✗'}</span>${ok?'':`<br><span style="color:var(--muted)">attendu : ${fmt(c.want)}</span>`}`
                       : (ph===last ? `Solde ${Y2} : <span class="tag neutral">${fmt(b)}</span>` : '');
      }
      if (y===Y2 && ph===c.p11 && acc===c.cp) eff = `<span class="tag neutral">vide au 1.1</span>`;
      if (y===Y2 && ph===c.p11 && acc===c.tr) eff = `sàn au 1.1 : <span class="tag ${c.tr===AT?'at':'pt'}">${fmt(b)}</span>`;
      if (acc===c.tr && on && !hid && (y===Y1 ? ph>=1 : ph===last)) eff = y===Y1 ? `Au bilan du 31.12 : <span class="tag ${c.tr===AT?'at':'pt'}">${fmt(b)}</span>` : `<span class="tag good">soldé ✓</span>`;
      const focus = (rv && y===Y1 && acc===c.tr) || on && c.J.some(e=>e.y===y && e.ph===ph && (e.d===acc||e.c===acc||e.open===acc));
      return tHTML(acc, P, focus, eff, hid && acc===c.tr ? '?' : '');
    }).join('');
    return `<div class="yr ${y===Y1?'y1':'y2'} ${on?'':'off'}"><h3>Exercice ${y}${y===Y2&&!on?' · dès le 1.1':''}</h3><div class="tg">${ts}</div></div>`;
  };
  $('stage').innerHTML = `
    <section class="sec"><h2>La situation</h2><div class="story">${c.story}</div>${timeline(c.tl, ph)}</section>
    <section class="sec"><h2>Dans la comptabilité</h2><div class="jr-stage">${jr}</div><div class="years">${yearCol(Y1)}${yearCol(Y2)}</div></section>`;
}

function renderIntro(){
  $('explain').innerHTML = `<h2 class="steptitle">${LET(0)}. ${TITLES[0]}</h2>
    <p class="steptext">Le <b>bilan</b> indique la valeur des comptes à la clôture.<br><br>
    Le <b>compte de résultat</b> indique le bénéfice (ou la perte) de l'exercice, p. ex. de ${Y1}. Il ne contient donc que les charges et les produits <b>de ${Y1}</b>, et rien de ${Y0} ou de ${Y2}.<br><br>
    Les opérations transitoires :</p>
    <div class="calc"><div class="row"><span>• au <b>31.12</b> : on corrige les comptes de charges et de produits</span></div>
    <div class="row" style="margin-top:4px"><span>• au <b>1.1</b> suivant : on <b>extourne</b> (écriture inverse)</span></div></div>
    <p class="steptext">En fin d'exercice, on doit se poser la question :</p>
    <div class="calc q">Au 31.12, <b>manque</b>-t-il ou y a-t-il <b>en trop</b> une <b>charge</b> ou un <b>produit</b> dans l'exercice en cours ?</div>`;
  $('stage').innerHTML = `
    <section class="sec"><h2>Un exercice = une année</h2>
      <div class="yrs3"><div><b>${Y0}</b>exercice précédent</div><div class="on"><b>${Y1}</b>le compte de résultat ne contient que les charges et produits de ${Y1}</div><div><b>${Y2}</b>exercice suivant</div></div></section>
    <section class="sec"><h2>Les deux documents de clôture</h2>
      <div class="two"><div class="box"><h4 style="color:var(--bilan)">Bilan au 31.12.${Y1}</h4>Une « photo » : la valeur des comptes le jour de la clôture.</div>
      <div class="box"><h4 style="color:var(--res)">Compte de résultat ${Y1}</h4>Un « film » de l'année : toutes les charges et tous les produits de ${Y1}, et seulement ceux-là.</div></div></section>
    <section class="sec"><h2>À maîtriser pour bien comptabiliser</h2>
      <p class="steptext" style="margin:0 0 10px">Le fonctionnement des comptes de charges et de produits :</p>
      <div class="two">${tSign('Charges','charge','+','−')}${tSign('Produits','produit','−','+')}</div></section>`;
}
// Compte en T avec les signes + et − de chaque côté
const tSign = (name, k, d, c) => `<div class="t k-${k} tsign"><div class="t-sides"><span>D</span><span class="t-head">${name}</span><span>C</span></div>
  <div class="t-body"><div class="col d"><b class="${d==='+'?'plus':'minus'}">${d}</b><small>${d==='+'?'augmente':'diminue'}</small></div>
  <div class="col c"><b class="${c==='+'?'plus':'minus'}">${c}</b><small>${c==='+'?'augmente':'diminue'}</small></div></div></div>`;

function renderResume(){
  $('explain').innerHTML = `<h2 class="steptitle">${LET(5)}. ${TITLES[5]}</h2>
    <p class="note">Cliquer sur une carte pour revoir le cas.</p>`;
  const card = (s,t,ex,d,c) => `<div class="qc" data-go="${s}"><h4>${t}</h4><div class="ex">${ex}</div>
    <div class="ecr"><span>${d} / ${c}</span><span>31.12</span></div></div>`;
  $('stage').innerHTML = `<section class="sec"><h2>Actifs ou passifs transitoires ?</h2>
    <div class="quad">
      <div class="hd at">Actifs transitoires</div><div class="hd pt">Passifs transitoires</div>
      ${card(1,'Produits à recevoir','Le produit manque : on l\'ajoute.','Actifs transitoires','Produit')}
      ${card(3,'Produits reçus d\'avance','Le produit est en trop : on l\'enlève.','Produit','Passifs transitoires')}
      ${card(2,'Charges payées d\'avance','La charge est en trop : on l\'enlève.','Actifs transitoires','Charge')}
      ${card(4,'Charges à payer','La charge manque : on l\'ajoute.','Charge','Passifs transitoires')}
    </div></section>
    <section class="sec"><h2>Moyen mnémotechnique</h2>
      <div class="two"><div class="box"><h4>On est <span class="tag neutral">CONTENT</span> = Actif transitoire</h4>On va recevoir de l'argent (c'est bientôt Noël) ou on a déjà payé une charge (le dentiste c'est dernière nous).</div>
      <div class="box"><h4>On est <span class="tag neutral">PAS CONTENT</span>= Passif transitoire</h4>On a plus rien à recevoir, c'est déjà fait (Noël, c'est fini) ou on doit encore payer (demain : dentiste).</div></div></section>`;
}

/* ---------- Navigation ---------- */
function goTo(p){ pos = p; render(); }
function goStep(s){ goTo(A.findIndex(a=>a.step===s)); }

let Z = 1;
try { Z = +localStorage.getItem('transitoires-zoom') || 1; } catch(e){}
function applyZoom(){
  Z = Math.round(Math.max(0.8, Math.min(1.6, Z))*10)/10;
  document.documentElement.style.setProperty('--z', Z);
  try { localStorage.setItem('transitoires-zoom', Z); } catch(e){}
  fitTL();
}

$('dots').innerHTML = TITLES.map((t,i)=>`<button class="dot" data-s="${i}" title="${LET(i)}. ${t}" aria-label="${LET(i)}. ${t}"></button>`).join('');
$('zm').addEventListener('click', ()=>{ Z -= 0.1; applyZoom(); });
$('zp').addEventListener('click', ()=>{ Z += 0.1; applyZoom(); });
$('next').addEventListener('click', ()=>goTo(pos+1));
$('explain').addEventListener('click', e=>{ const b=e.target.closest('.ch'); if (!b || b.disabled) return; ANS[A[pos].step] = b.dataset.a; render(); });
$('prev').addEventListener('click', ()=>goTo(pos-1));
$('quit').addEventListener('click', ()=>{ window.close(); setTimeout(()=>{ $('quit-msg').style.display='block'; }, 300); });
$('dots').addEventListener('click', e=>{ const b=e.target.closest('.dot'); if (b) goStep(+b.dataset.s); });
$('stage').addEventListener('click', e=>{ const q=e.target.closest('[data-go]'); if (q) goStep(+q.dataset.go); });

document.addEventListener('keydown', e=>{
    if (e.key==='ArrowRight' && !$('next').disabled) goTo(pos+1);
  if (e.key==='ArrowLeft') goTo(pos-1);
});
$('subyrs').textContent = `Clôture au 31.12.${Y1} · extourne au 1.1.${Y2}`;
render();
applyZoom();
</script>
<script>const PAPER = { answer(){ for (let s=1; s<=4; s++){ const c = getCase(s); if (c) ANS[s] = c.ansTag; } } };   // version papier : bonnes réponses</script>
<script src="theorie.js"></script>
