<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Les salaires</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <!-- Réglages propres à cette page (le reste est dans style.css) -->
    <style>
        header, footer { border-top: 5px solid yellow; border-bottom: 5px solid blue; }
        .question { font-size: 1.15em; font-weight: bold; margin-bottom: 15px; }
        .choix { list-style: none; padding: 0; margin: 0; }
        .choix li { margin-bottom: 10px; }
        .choix label { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
        .choix label:hover { background-color: #f4f8fd; }
        .choix input { width: auto; margin: 0; transform: scale(1.3); }
        .choix label.bonne { background-color: #d4edda; border-color: #8fd19e; }
        .choix label.fausse { background-color: #f8d7da; border-color: #f1a5ad; }
        #validate-btn:disabled { opacity: .45; cursor: default; transform: none; }
        /* Fenêtre d'explication (mauvaise réponse) */
        .modal-fond { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
        .modal { background: white; border-radius: 12px; max-width: 520px; width: 100%; padding: 22px 24px; border-top: 6px solid #ff4747; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
        .modal h3 { color: #c0392b; margin-bottom: 10px; }
        .modal .bonne-rep { background-color: #d4edda; color: #155724; padding: 8px 12px; border-radius: 6px; font-weight: bold; margin-bottom: 10px; }
        .modal .modal-btn { text-align: right; margin-top: 15px; }
        #close-btn { background-color: #037DFF; color: white; }
        #close-btn:hover { background-color: #045BB5; }
    </style>
</head>
<body>
    <header>
        <h2>Quiz</h2>
        <h1>Les salaires</h1>
    </header>

    <div class="container">
        <div class="stats">
            <span id="progression"></span>
            <span id="score"></span>
        </div>

        <div id="zone-question">
            <div class="entry-description question" id="question"></div>
            <ul class="choix" id="choix"></ul>
            <div class="feedback correct" id="feedback">✓ Bonne réponse !</div>
            <div class="buttons">
                <button id="quit-btn">Quitter</button>
                <div>
                    <button id="validate-btn" disabled>Valider</button>
                    <button id="next-btn" style="display:none">Suivant</button>
                </div>
            </div>
        </div>

        <div class="completion-message" id="fin"></div>
        <button id="restart-btn">Recommencer</button>
        <p id="quit-msg" style="display:none;text-align:center;color:#721c24">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : fermer l'onglet.</p>
    </div>

    <!-- Fenêtre d'explication en cas de mauvaise réponse -->
    <div class="modal-fond" id="modal">
        <div class="modal">
            <h3>Pas tout à fait…</h3>
            <div class="bonne-rep" id="modal-reponse"></div>
            <div id="modal-explication"></div>
            <div class="modal-btn"><button id="close-btn">Compris</button></div>
        </div>
    </div>

    <script>
    const QUIZ = {

        // ===== Questions (ajouter les nouvelles à la fin, séparées par une virgule) =====
        // La BONNE réponse est toujours écrite EN PREMIER : l'ordre est mélangé à l'affichage.
        // Modèle :  { question: "...", reponses: ["bonne réponse", "fausse 1", "fausse 2", "fausse 3"], explication: "..." }
        questions: [

            {
                question: "Que retire-t-on du salaire brut pour obtenir le salaire net ?",
                reponses: ["Les cotisations aux assurances sociales payées par l'employé", "Les cotisations payées par l'employeur", "Les allocations familiales", "Les frais remboursés"],
                explication: "Les déductions sociales (AVS/AI/APG, AC, AANP, LPP) sont la part de l'employé. Elles sont retenues sur son salaire."
            },
            {
                question: "Dans le décompte de salaire, les allocations familiales…",
                reponses: ["s'ajoutent au salaire", "se déduisent du salaire", "n'y figurent pas", "sont payées par l'employé"],
                explication: "L'entreprise verse les allocations avec le salaire, pour le compte de la caisse ALFA."
            },
            {
                question: "L'AVS/AI/APG se calcule sur le salaire AVS. De quoi s'agit-il ?",
                reponses: ["Tous les montants versés, sauf les allocations familiales et les frais", "Tous les montants versés", "Le salaire brut", "Le salaire net"],
                explication: "Le salaire AVS comprend tout ce qui est versé à l'employé (salaire, primes, commissions, 13e salaire, allocations patronales), sauf les allocations familiales et les remboursements de frais."
            },
            {
                question: "Sur quel salaire calcule-t-on la LPP ?",
                reponses: ["Le salaire coordonné", "Le salaire AVS", "Le salaire net", "Le salaire brut plus les allocations"],
                explication: "Salaire coordonné = salaire AVS − déduction de coordination. L'AVS couvre déjà une partie du salaire."
            },
            {
                question: "Comment calcule-t-on le salaire coordonné ?",
                reponses: ["Salaire AVS − déduction de coordination", "Salaire brut − cotisations sociales", "Salaire net + LPP", "Salaire AVS × taux LPP"],
                explication: "On retire du salaire AVS la déduction de coordination, fixée chaque année par la Confédération."
            },
            {
                question: "Pourquoi l'AC (assurance chômage) a-t-elle un plafond ?",
                reponses: ["Elle n'est prélevée que jusqu'à un salaire maximal", "Elle ne concerne que les bas salaires", "Elle est payée uniquement par l'employeur", "Elle diminue avec l'âge"],
                explication: "Au-delà d'un salaire maximal par mois, on ne prélève plus d'AC sur la partie qui dépasse."
            },
            {
                question: "De quoi dépend le taux LPP ?",
                reponses: ["De l'âge de l'employé", "Du salaire net", "Du nombre d'enfants", "Du canton"],
                explication: "Plus l'employé est âgé, plus le taux LPP est élevé (bonifications de vieillesse)."
            },
            {
                question: "Combien l'employeur paie-t-il pour l'AVS/AI/APG et l'AC ?",
                reponses: ["Le même montant que l'employé, plus les frais d'administration", "La moitié du montant de l'employé", "Le double du montant de l'employé", "Rien, c'est l'employé qui paie tout"],
                explication: "La part patronale est paritaire : égale à celle de l'employé. S'y ajoutent les frais d'administration de la caisse de compensation."
            },
            {
                question: "Combien l'employeur paie-t-il pour la LPP ?",
                reponses: ["Au moins autant que l'employé", "La moitié du montant de l'employé", "Rien", "Toujours le double du montant de l'employé"],
                explication: "La cotisation LPP est au moins paritaire : l'employeur paie au moins la moitié du total."
            },
            {
                question: "Qui paie la prime annuelle d'assurance accidents ?",
                reponses: ["L'entreprise, la prime entière, au début de l'année", "L'employé, chaque mois", "Moitié l'entreprise, moitié l'employé", "L'assureur"],
                explication: "L'entreprise paie toute la prime d'avance (AAP et AANP). Elle récupère ensuite l'AANP sur les salaires."
            },
            {
                question: "Qui supporte finalement l'AANP (accidents non professionnels) ?",
                reponses: ["L'employé, par une retenue sur son salaire", "L'entreprise seule", "La caisse de compensation", "La caisse ALFA"],
                explication: "L'entreprise a avancé la prime. Chaque mois, elle retient l'AANP sur le salaire de l'employé."
            },
            {
                question: "Qui paie réellement les allocations familiales ?",
                reponses: ["La caisse ALFA", "L'entreprise", "L'employé", "L'AVS"],
                explication: "L'entreprise n'est qu'un intermédiaire : elle avance l'argent et la caisse ALFA le lui rembourse."
            },
            {
                question: "Quel est le rôle de l'entreprise pour les allocations familiales ?",
                reponses: ["Elle les verse aux employés puis les « facture » à la caisse ALFA", "Elle les paie de sa poche", "Elle les retient sur le salaire", "Elle n'a aucun rôle"],
                explication: "L'entreprise sert d'intermédiaire entre la caisse ALFA et les employés."
            },
            {
                question: "Les allocations versées dépassent la cotisation due à la caisse ALFA. Que se passe-t-il ?",
                reponses: ["La caisse rembourse la différence à l'entreprise", "L'entreprise paie la différence à la caisse", "L'entreprise paie toute la cotisation", "Rien, les montants s'annulent"],
                explication: "La caisse doit plus à l'entreprise que l'entreprise ne doit à la caisse : la caisse rembourse la différence."
            },
            {
                question: "Pourquoi ne paie-t-on que la différence entre la cotisation ALFA et les allocations ?",
                reponses: ["On compense ce que chacun doit à l'autre", "La loi interdit de payer la cotisation entière", "Les allocations sont gratuites", "L'employé paie le reste"],
                explication: "L'entreprise doit la cotisation, la caisse doit les allocations avancées : un seul paiement règle la différence."
            }

            /* Ajouter d'autres questions ici par la suite
            ,
            {
                question: "",
                reponses: ["", "", "", ""],
                explication: ""
            }
            */
        ]
    };

    // ===== Fonctionnement du quiz (pas besoin de modifier) =====
    const $ = id => document.getElementById(id);
    const melanger = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    let ordre = [], n = 0, score = 0, bonneTexte = '';

    function demarrer() {
        ordre = melanger(QUIZ.questions);
        n = 0; score = 0;
        $('zone-question').style.display = '';
        $('fin').style.display = 'none';
        $('restart-btn').style.display = 'none';
        afficher();
    }

    function afficher() {
        const q = ordre[n];
        bonneTexte = q.reponses[0];
        $('progression').textContent = `Question ${n + 1} / ${ordre.length}`;
        $('score').textContent = `Bonnes réponses : ${score}`;
        $('question').textContent = q.question;
        $('choix').innerHTML = melanger(q.reponses).map((r, i) =>
            `<li><label><input type="radio" name="rep" value="${i}"><span>${r}</span></label></li>`).join('');
        $('choix').querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => { $('validate-btn').disabled = false; }));
        $('feedback').style.display = 'none';
        $('validate-btn').style.display = '';
        $('validate-btn').disabled = true;
        $('next-btn').style.display = 'none';
    }

    function valider() {
        const coche = $('choix').querySelector('input:checked');
        if (!coche) return;
        const q = ordre[n];
        const labels = [...$('choix').querySelectorAll('label')];
        labels.forEach(l => {
            l.querySelector('input').disabled = true;
            if (l.textContent === bonneTexte) l.classList.add('bonne');
        });
        const juste = coche.parentElement.textContent === bonneTexte;
        if (juste) {
            score++;
            $('feedback').style.display = 'block';
        } else {
            coche.parentElement.classList.add('fausse');
            $('modal-reponse').textContent = 'Bonne réponse : ' + bonneTexte;
            $('modal-explication').textContent = q.explication;
            $('modal').style.display = 'flex';
        }
        $('score').textContent = `Bonnes réponses : ${score}`;
        $('validate-btn').style.display = 'none';
        $('next-btn').style.display = '';
        $('next-btn').textContent = (n === ordre.length - 1) ? 'Voir le résultat' : 'Suivant';
    }

    function suivant() {
        n++;
        if (n < ordre.length) { afficher(); return; }
        $('zone-question').style.display = 'none';
        const pct = Math.round(score / ordre.length * 100);
        const msg = pct === 100 ? 'Parfait, les salaires sont maîtrisés !' : pct >= 70 ? 'Très bien, encore un petit effort !' : 'Revoir la théorie des salaires, puis recommencer.';
        $('fin').innerHTML = `<h3>Quiz terminé</h3><p style="font-size:1.3em"><b>${score} / ${ordre.length}</b> bonnes réponses (${pct} %)</p><p>${msg}</p>`;
        $('fin').style.display = 'block';
        $('restart-btn').style.display = 'block';
        $('progression').textContent = '';
    }

    $('validate-btn').addEventListener('click', valider);
    $('next-btn').addEventListener('click', suivant);
    $('restart-btn').addEventListener('click', demarrer);
    $('close-btn').addEventListener('click', () => { $('modal').style.display = 'none'; });
    $('quit-btn').addEventListener('click', () => { window.close(); setTimeout(() => { $('quit-msg').style.display = 'block'; }, 300); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').style.display = 'none'; });

    demarrer();
    </script>
</body>
</html>
