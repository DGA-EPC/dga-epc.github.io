<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les titres – théorie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theorie.css">
<style>


:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1e2226; --muted:#6a6f76; --line:#e2ddd2; --soft:#efebe3;
  --charge:#c2671f; --charge-bg:#fcefe3;
  --produit:#2b8352; --produit-bg:#e6f4eb;
  --res:#6d48b3; --res-bg:#efe9f9;
  --passif:#a3333d; --passif-bg:#f8e8ea;
  --bilan:#20394f; --bilan-bg:#e6ecf1;
  --actif:#2a52be; --actif-bg:#e8eefb;
  --accent:#c98a10; --accent-bg:#fff3d6;
  --y1:#e8eefb; --y2:#fff3d6;
}
.calc.q{background:var(--bilan-bg)}
.ch.ko{background:var(--charge);border-color:var(--charge);color:#fff;opacity:1}
.fb.ko{border-left:4px solid var(--charge)}
.ch.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(32,57,79,0)}50%{box-shadow:0 0 0 5px rgba(201,138,16,.75);background:var(--accent-bg)}}
.tag.at{background:var(--actif-bg);color:var(--actif)}
.tag.pt{background:var(--passif-bg);color:var(--passif)}
.journal td.dt{color:var(--muted);white-space:nowrap}
.journal tr.todo td{opacity:.38}
.btn.quiz{display:flex;align-items:center;justify-content:center;background:#037DFF;color:#fff;border-color:#037DFF;text-align:center;text-decoration:none}

/* Ligne du temps */
.t{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px 8px;position:relative;min-width:0}
.t-head{font-weight:700;font-size:13.5px;text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-body{display:grid;grid-template-columns:1fr 1fr;min-height:46px}
.col{padding:4px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ln{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px;font-size:11.5px;border-radius:4px;padding:1px 2px}
.ln .lb{color:var(--muted);line-height:1.25;min-width:0}
.ln.ext .lb{font-style:italic}
.eff .tag{font-size:11.5px}

/* Introduction et résumé */
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:14px}
.quad .hd.pt{background:var(--passif-bg);color:var(--passif)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:12px 12px 90px}
  aside{position:static;max-height:none;overflow:visible}
  .nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(245,243,238,.95);backdrop-filter:blur(6px);padding:10px 12px;border-top:1px solid var(--line)}
  .two,.quad{grid-template-columns:1fr}
}

/* --- Amortissements --- */
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity .3s,box-shadow .3s}
.card.on{box-shadow:0 0 0 2px var(--accent)}
.card.off{opacity:.45}
.card .lt{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-weight:700;font-size:12px;margin-right:6px}
.card h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center}
.card .ex{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.ecr{display:flex;justify-content:space-between;gap:8px;font-size:13px;background:var(--soft);border-radius:8px;padding:6px 10px;font-weight:600}
.ecr span:last-child{color:var(--muted);font-weight:500}
.vocab tr.cur td{background:var(--hl)}
.tab tr.todo td{color:transparent}
.tab tr.cur td{background:var(--hl);font-weight:700}
.tab tr.cur td.am{color:var(--charge)}
.tab td.am{color:var(--charge)}.bil .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:2px 0}
.bil .row.sub{color:var(--passif)}
.bil .row.tot{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:4px}
.k-fac .t-head{color:var(--passif)}
.t-head{white-space:normal !important;line-height:1.2;overflow:visible !important;text-overflow:clip !important;hyphens:auto;-webkit-hyphens:auto}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){ .split{grid-template-columns:1fr} }

/* --- Bilan et journal --- */
.inv td.am{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.inv td.tg2,.inv td.acc{width:1%;white-space:nowrap}
@keyframes fadein{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.pill.a{background:var(--actif-bg);color:var(--actif)}.pill.p{background:var(--passif-bg);color:var(--passif)}
.pill.acc{background:var(--soft);color:var(--ink)}
.bl{display:grid;grid-template-columns:1fr 1fr;max-width:720px;margin:0 auto}
.bl-title{grid-column:1/-1;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;padding-bottom:4px}
.bl-head.a{color:var(--actif)}.bl-head.p{color:var(--passif);text-align:right}
.bl-side.a{border-right:3px solid var(--ink)}
.br{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;padding:2px 4px;border-radius:4px}
.br.new{animation:pop 1.6s ease-out}
.br.cap{color:var(--res);font-weight:700}
.br.dec{color:var(--charge);font-weight:700}
.bt.bad{color:var(--charge)}
.qa.off{opacity:.25}
.acct td.n{text-align:right;font-variant-numeric:tabular-nums}
.acct th.n{text-align:right}
.rule .pm{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);font-size:22px;font-weight:700}
.rule .pm span:first-child{border-right:2px solid var(--ink)}
.rule .pm small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.plus{color:var(--produit)}.case{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity .3s,box-shadow .3s}
.case.on{box-shadow:0 0 0 2px var(--accent)}.case.off{opacity:.4}
.case p{margin:0 0 8px;font-size:14.5px}
.t-sides .sg{font-weight:700}
.bl-side.p .bg.hl{color:var(--passif)}
.bl-side.dim,.bl-head.dim{opacity:.3}
.t-head{white-space:normal !important;line-height:1.2;overflow:visible !important;text-overflow:clip !important;hyphens:auto;-webkit-hyphens:auto}

/* --- Salaires --- */
.taux{border:3px solid var(--accent);border-radius:14px;padding:12px 16px;background:#fffdf6}
.taux h3{margin:0 0 8px;font-family:Fraunces,Georgia,serif;color:var(--accent);display:flex;justify-content:space-between;align-items:baseline}
.taux h3 small{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:500}
.tt td.n,.tt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt tr.hl td{background:var(--hl);font-weight:600}
.slip td{padding:6px 10px;border-bottom:1px dashed var(--line)}
.slip td.n{text-align:right;white-space:nowrap}
.slip tr.sub td:first-child{border-left:4px solid var(--charge)}
.slip tr.add td.n{color:var(--produit)}.slip tr.sub td.n{color:var(--charge)}.slip tr.pay td.n{color:var(--actif)}
.slip tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.slip tr.cur td{background:var(--hl)}
.chip{display:inline-block;padding:2px 9px;border-radius:7px;font-weight:600;font-size:13px}
.chip.charge{background:var(--charge-bg);color:var(--charge)}
.chip.passif{background:var(--passif-bg);color:var(--passif)}
.chip.actif{background:var(--actif-bg);color:var(--actif)}
.jl2 th.n,.jl2 td.n{text-align:right}
.jl2 td{padding:6px 8px;border-bottom:1px dashed var(--line)}
.jl2 tr.cur td{background:var(--hl)}
.jl2 tr.new td{animation:pop 1.6s ease-out}
.jl2 tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.arrows{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.arw.off{opacity:.12}
.arw .line{height:4px;border-radius:2px;position:relative}
.arw .line::after{content:"";position:absolute;top:-6px;border:8px solid transparent}
.arw.r .line::after{right:-4px;border-left-color:inherit;border-left-width:12px;border-right-width:0}
.arw.l .line::after{left:-4px;border-right-color:inherit;border-right-width:12px;border-left-width:0}
.arw .lab{text-align:center;font-weight:600}
.arw .amt{font-variant-numeric:tabular-nums;font-weight:700}
.arw.new{animation:pop 1.6s ease-out}
.bal{display:flex;flex-direction:column;gap:6px;max-width:520px;margin:14px auto 0;font-size:14px}
.bal .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px}
.bal .row.tot{font-weight:700;border-top:2px solid var(--ink)}
.due{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.due h4{margin:0 0 6px;font-size:14px;color:var(--passif)}
.due .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:13.5px}
.due .row.tot{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:4px}
.due.on{box-shadow:0 0 0 2px var(--accent)}
/* --- Titres --- */
.acrow{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;margin-bottom:10px}
.acrow .t-body{min-height:26px}
.acx{font-size:14px}
.acgrp{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.jr-stage{max-width:760px;margin-bottom:16px}
.lk{display:inline-block;padding:1px 8px;border-radius:7px;border:1.5px solid;font-weight:700}
.code{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;justify-content:center;padding:10px 0}
.cpart{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:170px;text-align:center}
.ctok{font:700 30px/1 'Courier New',monospace;border:3px solid;border-radius:10px;padding:10px 14px;background:#fff}
.clab{font-size:13px;font-weight:600;color:var(--ink)}
.icbar{display:flex;height:40px;border-radius:8px;overflow:hidden;margin-top:10px;color:#fff;font-weight:600;font-size:13px}
.ics{display:flex;align-items:center;justify-content:center;transition:background .4s}
.icdates{position:relative;height:44px;font-size:12px;color:var(--muted);margin-top:6px}
.icdates span{position:absolute;top:0;white-space:nowrap}
.icdates span:nth-child(2){transform:translateX(-50%);text-align:center;color:var(--ink);font-weight:600}
.steps3{display:flex;flex-direction:column;gap:4px;max-width:620px}
.steps3 .calc{margin:6px 0}
/* Action vs Obligation */
.syn{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.syn th,.syn td{padding:8px 10px;border-bottom:1px dashed #9c9282;vertical-align:top;text-align:left}
.syn tr>th:first-child{width:130px;font-weight:600;color:var(--muted);font-size:12.5px}
.syn th.hd{font-family:Fraunces,Georgia,serif;font-size:19px;text-align:center;border-radius:10px 10px 0 0}
.syn th.hd.a{background:var(--actif-bg);color:var(--actif)}.syn th.hd.o{background:var(--produit-bg);color:var(--produit)}
.rems{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;max-width:760px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;text-align:center}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 6px 2px}
.frac>span:last-child{padding:2px 6px 0}
.calc .row.fr{align-items:center}
.syn .code{justify-content:flex-start;gap:8px;padding:0}.syn .ctok{font-size:20px;padding:6px 8px}.syn .clab{font-size:11.5px}.syn .cpart{max-width:110px}
/* Dividendes et intérêts */
.divt{max-width:620px}.divt td{font-size:15px}
/* Donnée et jours */
.donnee{font-size:14.5px;background:#f6f3ec;border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px}
.jours{border-collapse:collapse;font-size:13px;margin-top:4px;width:100%}
.jours td{padding:2px 6px;border-bottom:1px dashed #9c9282}
.jours td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.jours tr.tot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.jnote{font-size:12px;color:var(--muted);margin-top:4px}
/* Pas de surlignage jaune : le pas à pas suffit à montrer les changements */
.jl2 tr.cur td,.slip tr.cur td{background:none}
.jl2 tr.new td{animation:none}
.ln.fresh{animation:none;background:none}
.t.focus{box-shadow:none}
.card.on{box-shadow:0 0 0 2px var(--ink)}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="panel">
      <h1>Les titres</h1>
      <p class="sub">Actions · obligations · Ajustement du compte Titres  · Calcul de rendement</p>
      <div class="dots" id="dots"></div>
    </div>

    <div class="panel" id="explain"></div>

    <div class="nav-wrap">
      <div class="nav">
        <button class="btn" id="prev">← Précédent</button>
        <button class="btn primary" id="next">Suite →</button>
      </div>
    </div>

    <div class="nav exit">
      <button class="btn quit" id="quit">Quitter</button>
    </div>
    <p class="note" id="quit-msg" style="display:none;color:#fff">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : fermer l'onglet.</p>
  </aside>

  <main class="stage" id="stage"></main>
</div>
<div class="zoombar"><button id="zm" title="Réduire la taille" aria-label="Réduire la taille">A−</button><button id="zp" title="Agrandir la taille" aria-label="Agrandir la taille">A+</button></div>

<script>
/* ---------- Réglages ---------- */
const Y = new Date().getFullYear();                 // année en cours (exemples datés)
const IA = 35;                                       // *** Taux de l'impôt anticipé (%) ***
const ANS = {};
const fmt = n => { const neg=n<0; n=Math.abs(Math.round(n*100)/100); const [i,d]=n.toFixed(2).split('.');
  return (neg?'−':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,"'") + (d!=='00' ? '.'+d : ''); };
const $ = id => document.getElementById(id);
const KIND = {'Titres':'actif','Banque':'actif','Créances AFC':'actif','Actifs transitoires':'actif',
  'Produits des titres':'produit','Charges des titres':'charge','Provision pour fluctuation':'passif'};
const PLUS_D = k => k==='actif' || k==='charge';
const chip = a => `<span class="chip ${KIND[a]==='produit'?'actif" style="background:var(--produit-bg);color:var(--produit)':KIND[a]}">${a}</span>`;

/* Couleur de liaison = compte de destination du montant */
const LINK = {'Titres':'#0e7c86', 'Produits des titres':'#c0262d', 'Banque':'#4b5563', 'Créances AFC':'#2a52be', 'Charges des titres':'#c2671f'};
const pill = (acc, txt) => acc ? `<span class="lk" style="color:${LINK[acc]};background:${LINK[acc]}1f;border-color:${LINK[acc]}">${txt}</span>` : txt;

/* ---------- Bordereau (décompte de la banque) ---------- */
function bordHTML(title, rows, curAcc){
  return `<div style="font-weight:700;margin-bottom:6px">${title}</div><table class="slip">${rows.map(r=>`<tr class="${r.k} ${curAcc&&r.to===curAcc?'cur':''}"><td>${r.lb}</td><td class="calc2">${r.calc||''}</td><td class="calc2">${r.to?'→ '+r.to:''}</td><td class="n">${r.to?pill(r.to,fmt(r.amt)):fmt(r.amt)}</td></tr>`).join('')}</table>`;
}

/* ---------- Journal à deux colonnes + comptes en T ---------- */
// J : lignes {ph, n, d|c, amt}  ·  {ph, open:compte, side, amt, lab}
function journalHTML(J, ph, plain){
  let rows = J.filter(e=>!e.open);
  // écriture simple (un compte au débit, un au crédit, même montant) : sur une seule ligne
  const byN = {}; rows.forEach(e=>(byN[e.n+'/'+e.ph] = byN[e.n+'/'+e.ph] || []).push(e));
  rows = Object.values(byN).flatMap(g => g.length===2 && g[0].d && g[1].c && g[0].amt===g[1].amt
    ? [{ph:g[0].ph, n:g[0].n, d:g[0].d, c:g[1].c, amt:g[0].amt, dl:g[0].lk, cl:g[1].lk}]
    : g.map(e=>({...e, dl:e.d&&e.lk, cl:e.c&&e.lk})));
  // couleur du montant = ligne du bordereau d'où il vient (lk), sinon le compte lui-même
  const col = (acc, lk) => { const a = lk || acc; return !plain && LINK[a] ? a : null; };
  let prevN = null;
  return `<table class="jl2"><tr><th>N°</th><th>Compte débité</th><th>Compte crédité</th><th class="n">Débit</th><th class="n">Crédit</th></tr>
    ${rows.map(e=>{ const showN = e.n!==prevN; prevN = e.n;
      return `<tr class="${e.ph>ph?'hide':''}"><td>${showN?e.n:''}</td><td>${e.d||''}</td><td>${e.c||''}</td>
      <td class="n">${e.d?pill(col(e.d,e.dl),fmt(e.amt)):''}</td><td class="n">${e.c?pill(col(e.c,e.cl),fmt(e.amt)):''}</td></tr>`; }).join('')}</table>`;
}
function postings(J, acc, ph){
  const P = {d:[], c:[]};
  J.forEach(e=>{
    if (e.ph>ph) return;
    const fresh = e.ph===ph;
    if (e.open){ if (e.open===acc) P[e.side].push({lb:e.lab||'sàn', amt:e.amt, fresh}); return; }
    if (e.d===acc) P.d.push({lb:e.n, amt:e.amt, fresh});
    if (e.c===acc) P.c.push({lb:e.n, amt:e.amt, fresh});
  });
  return P;
}
const sum = a => a.reduce((s,l)=>s+l.amt,0);
const bal = (acc,P) => PLUS_D(KIND[acc]) ? sum(P.d)-sum(P.c) : sum(P.c)-sum(P.d);
function tHTML(acc, P, focus, eff, label){
  const k = KIND[acc], pd = PLUS_D(k);
  const col = arr => arr.map(l=>`<div class="ln ${l.fresh?'fresh':''}"><span class="lb">${l.lb}</span><span class="am">${fmt(l.amt)}</span></div>`).join('');
  return `<div class="t k-${k} ${focus?'focus':''}">
    <div class="t-sides"><span>D <b class="sg ${pd?'plus':'minus'}">${pd?'+':'−'}</b></span><span class="t-head" title="${label||acc}">${label||acc}</span><span><b class="sg ${pd?'minus':'plus'}">${pd?'−':'+'}</b> C</span></div>
    <div class="t-body"><div class="col d">${col(P.d)}</div><div class="col c">${col(P.c)}</div></div>
    ${eff?`<div class="eff">${eff}</div>`:''}</div>`;
}
function compta(J, accs, ph, eff, plain){
  const ts = accs.map(acc=>{ const P = postings(J, acc, ph);
    const focus = J.some(e=>e.ph===ph && !e.open && (e.d===acc||e.c===acc));
    return tHTML(acc, P, focus, eff ? eff(acc,P,ph) : ''); }).join('');
  return `<section class="sec"><h2>Dans la comptabilité</h2><div class="jr-stage">${journalHTML(J, ph, plain)}</div><div class="tg">${ts}</div></section>`;
}

/* ---------- Comptabilisation pas à pas : ligne du journal, puis report dans les comptes ---------- */
function mergeRows(J){
  const byN = {}; J.forEach(e=>(byN[e.n] = byN[e.n] || []).push(e));
  return Object.values(byN).flatMap(g => g.length===2 && g[0].d && g[1].c && g[0].amt===g[1].amt
    ? [{n:g[0].n, d:g[0].d, c:g[1].c, amt:g[0].amt, dl:g[0].lk, cl:g[1].lk, q:g[0].q, qtext:g[0].qtext}]
    : g.map(e=>({...e, dl:e.d&&e.lk, cl:e.c&&e.lk})));
}
const sensTxt = (acc, side) => { const k = KIND[acc], plus = (side==='d')===PLUS_D(k);
  return `${plus?'augmentation':'diminution'} d'${k==='charge'?'une':'un'} ${k}`; };
// une étape par ligne du journal : la ligne et le report dans le(s) compte(s) en même temps
// une ligne avec q : la question est posée d'abord, la ligne s'affiche une fois la réponse donnée
let ANSWERED = false;
function microSteps(R){
  return R.map((e,i)=>{
    const part = s => `<b>${e[s]}</b> au ${s==='d'?'débit':'crédit'} (${sensTxt(e[s],s)})`;
    return {row:i, q:e.q, text: e.q ? e.qtext : `${[e.d&&part('d'), e.c&&part('c')].filter(Boolean).join(', ')} : ${fmt(e.amt)}.`};
  });
}
const effK = (S, k) => k - (k>0 && S[k-1].q && !ANSWERED ? 1 : 0);   // étapes réellement affichées
function comptaK(J, accs, k, plain, unknown){   // unknown : compte affiché « ? » (tant que la question n'est pas répondue)
  const R = mergeRows(J), S = microSteps(R); k = effK(S, k);
  const done = S.slice(0,k), last = done[done.length-1];
  const maxRow = last ? last.row : -1;
  const col = (acc, lk) => { const a = lk || acc; return !plain && LINK[a] ? a : null; };
  let prevN = null;
  const jr = `<table class="jl2"><tr><th>N°</th><th>Compte débité</th><th>Compte crédité</th><th class="n">Débit</th><th class="n">Crédit</th></tr>
    ${R.map((e,i)=>{ const showN = e.n!==prevN; prevN = e.n;
      return `<tr class="${i>maxRow?'hide':''} ${last&&i===last.row?'cur':''}"><td>${showN?e.n:''}</td><td>${e.d||''}</td><td>${e.c||''}</td>
      <td class="n">${e.d?pill(col(e.d,e.dl),fmt(e.amt)):''}</td><td class="n">${e.c?pill(col(e.c,e.cl),fmt(e.amt)):''}</td></tr>`; }).join('')}</table>`;
  const P = {}; accs.forEach(a=>P[a]={d:[],c:[]});
  done.forEach((s,j)=>{ const e = R[s.row]; ['d','c'].forEach(sd=>{ if (e[sd]) P[e[sd]][sd].push({lb:e.n, amt:e.amt, fresh:j===k-1}); }); });
  const cur = last ? [R[last.row].d, R[last.row].c] : [];
  const ts = accs.map(a=>tHTML(a, P[a], cur.includes(a), '', a===unknown ? '?' : '')).join('');
  return `<section class="sec"><h2>Dans la comptabilité</h2><div class="jr-stage">${jr}</div><div class="tg">${ts}</div></section>`;
}

/* Achat / vente : la donnée seule, puis le bordereau ligne par ligne ; au total, journal et comptes vides, puis pas à pas */
function bordStep(o){
  const nL = o.lines.length, cs = microSteps(mergeRows(o.J));
  const ph = [{btn:'Le bordereau →', text:o.intro},
    ...o.lines.map((l,i)=>({btn: i===nL-1 ? 'Comptabiliser →' : 'Suite →', text:l.text, q:l.q})),
    ...cs.map(s=>({btn:'Suite →', text:s.text, q:s.q}))];
  // une ligne du bordereau avec q n'apparaît qu'une fois la réponse donnée ;
  // la destination d'une ligne liée à une écriture avec question (qto) n'apparaît qu'après cette écriture
  const qIdx = cs.findIndex(s=>s.q);
  const stage = p => { const k = p>=nL ? effK(cs, p-nL) : -1;
    const vis = i => i < p-1 || (i===p-1 && (!o.lines[i].q || ANSWERED));
    const showTo = l => p>=nL && (!l.qto || k>qIdx);
    return `<section class="sec"><h2>La donnée</h2><div class="donnee">${o.donnee}</div></section>
    ${p>=1 ? `<section class="sec"><h2>Le bordereau · d'où viennent les montants</h2>${bordHTML(o.title, o.lines.map((l,i)=>({...l, k:l.k+(vis(i)?'':' hide'), to: showTo(l) ? l.to : null})))}</section>` : ''}
    ${p>=nL ? comptaK(o.J, o.accs, p-nL) : ''}`; };
  return {title:o.name, ph, stage};
}

/* Détail du calcul des jours (mois de 30 jours, année de 360 jours) */
function joursHTML(j1, m1, j2, m2, ans=0, y1='', note=''){
  const p = n => String(n).padStart(2,'0');
  let m = m2-m1, d = j2-j1; if (d<0){ d += 30; m -= 1; }
  const L = [];
  if (ans) L.push([`du ${j1}.${p(m1)}.${y1} au ${j1}.${p(m1)}.${y1+ans}`, `${ans} ans × 360`, ans*360]);
  if (m) L.push([`du ${j1}.${p(m1)} au ${j1}.${p(m1+m)}`, `${m} mois × 30`, m*30]);
  if (d) L.push([`du ${j1}.${p(m1+m)} au ${j2}.${p(m2)}`, `${d} jours`, d]);
  return `<table class="jours">${L.map(([a,b,c])=>`<tr><td>${a}</td><td>${b}</td><td class="n">${fmt(c)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td></td><td class="n">${fmt(L.reduce((x,l)=>x+l[2],0))} jours</td></tr></table>${note?`<div class="jnote">${note}</div>`:''}`;
}

      text:`La banque <b>retient</b> ses frais.`},
     {k:'tot', lb:'= Total crédité', amt:VEN_O.tot, to:'Banque',
      text:`Le <b>total</b> est crédité sur notre compte bancaire : ${fmt(VEN_O.tot)}.<br><br>Écriture composée, ligne par ligne. D'abord le total reçu, puis le prix moins les frais : ${fmt(VEN_O.prix-VEN_O.frais)}.`}],
   J:[{n:1,d:'Banque',amt:VEN_O.tot},{n:1,c:'Titres',amt:VEN_O.prix-VEN_O.frais},
      {n:1,c:'Produits des titres',amt:VEN_O.ic, qtext:`Les intérêts courus de ${fmt(VEN_O.ic)} reçus de l'acheteur.`,
       q:{text:'Les intérêts courus reçus de l\'acheteur sont crédités…', opts:[['t','au compte Titres'],['p','aux Produits des titres']], ok:'p',
          fb:'ce sont des intérêts gagnés pendant que nous possédions l\'obligation : un <b>produit des titres</b>.'}}],
   accs:['Banque','Titres','Produits des titres'] }),

 { title:'Clôture : valeur en bourse',
   ph:[{btn:'Corriger →', text:`À la clôture, on compare le solde du compte Titres à la <b>valeur en bourse</b> des titres.<br><br>Cas A : la bourse a baissé.`,
        q:{text:'La valeur en bourse est plus basse que la valeur comptable. Faut-il corriger ?', opts:[['o','oui, obligatoirement'],['c','au choix']], ok:'o',
           fb:', il faut <b>obligatoirement abaisser</b> la valeur comptable : les titres ne valent plus que 800.'}},
       {btn:'Cas B →', text:`La moins-value de 200 est une charge : <b>Charges des titres / Titres</b> 200. Le compte Titres vaut maintenant 800.`},
       {btn:'Les possibilités →', text:`Cas B : la bourse a monté.`,
        q:{text:'La valeur en bourse est plus élevée que la valeur comptable. Faut-il corriger ?', opts:[['o','oui, obligatoirement'],['c','au choix']], ok:'c',
           fb:'on a <b>le choix</b> entre trois possibilités.'}},
       {btn:'B2 →', text:`<b>B1 : ne passer aucune écriture.</b> Les titres restent à 1'000 alors qu'ils valent 1'300 : on crée automatiquement une <b>réserve latente</b> (cachée) de 300.`},
       {btn:'B3 →', text:`<b>B2 : ajuster la valeur comptable à la hausse.</b> La plus-value de 300 est un produit : <b>Titres / Produits des titres</b> 300.`},
       {btn:'Suite →', text:`<b>B3 : ajuster à la hausse, mais annuler le produit</b> en créant une provision. Le bilan montre la valeur en bourse, mais le bénéfice ne change pas.<br>• Titres / Produits des titres 300<br>• Produits des titres / Provision pour fluctuation 300`}],
   stage: ph => {
     // Cas A (phases 0-1) ; une fois terminé, reste affiché sans mise en évidence (ph 9)
     const pa = ph<=1 ? ph : 9;
     const casA = `<section class="sec"><h2>Cas A · la bourse baisse</h2><div class="donnee">Solde du compte Titres : <b>1'000</b>. Valeur en bourse au 31.12 : <b>800</b>.</div></section>
       ${compta([{ph:0,open:'Titres',side:'d',amt:1000,lab:'spb'},{ph:1,n:1,d:'Charges des titres',amt:200},{ph:1,n:1,c:'Titres',amt:200}],['Titres','Charges des titres'],pa,
         (acc,P,p)=> acc==='Titres' ? `Solde : <span class="tag ${p>=1?'good':'bad'}">${fmt(bal(acc,P))}</span> · bourse : <b>800</b>` : '', true)}`;
     if (ph<2) return casA;
     // Cas B (phases 2-5)
     const pb = ph-2;
     const J = pb<2 ? [{ph:0,open:'Titres',side:'d',amt:1000,lab:'spb'}]
       : pb===2 ? [{ph:0,open:'Titres',side:'d',amt:1000,lab:'spb'},{ph:2,n:1,d:'Titres',amt:300},{ph:2,n:1,c:'Produits des titres',amt:300}]
       : [{ph:0,open:'Titres',side:'d',amt:1000,lab:'spb'},{ph:3,n:1,d:'Titres',amt:300},{ph:3,n:1,c:'Produits des titres',amt:300},{ph:3,n:2,d:'Produits des titres',amt:300},{ph:3,n:2,c:'Provision pour fluctuation',amt:300}];
     const accs = pb<2 ? ['Titres'] : pb===2 ? ['Titres','Produits des titres'] : ['Titres','Produits des titres','Provision pour fluctuation'];
     const cards = `<section class="sec"><h2>Cas B · la bourse monte</h2><div class="donnee">Solde du compte Titres : <b>1'000</b>. Valeur en bourse au 31.12 : <b>1'300</b>.</div>
       <div class="cards" style="margin-top:12px">
       ${[['B1','Aucune écriture','réserve latente de 300'],['B2','Ajuster à la hausse','Titres / Produits des titres'],['B3','Ajuster et provisionner','+ Produits des titres / Provision pour fluctuation']].map(([k,t,x],i)=>`<div class="card ${pb>=1?(pb===i+1?'on':''):'off'}"><h4>${k} · ${t}</h4><div class="ex">${x}</div></div>`).join('')}</div></section>`;
     return casA + cards + compta(J, accs, pb, (acc,P)=> acc==='Titres' ? `Solde : <span class="tag neutral">${fmt(bal(acc,P))}</span> · bourse : <b>1'300</b>` : '', true); } },

 { title:'Clôture : les intérêts courus',
   ph:[{btn:'Les jours →', text:`À la clôture, il faut encore tenir compte des <b>intérêts courus</b> sur les obligations : les intérêts gagnés depuis la dernière échéance, mais pas encore encaissés.`},
       {btn:'L\'intérêt →', text:`On compte les jours de l'échéance à la clôture (mois de 30 jours ; le 31.12 compte comme le 30).`},
       {btn:'Comptabiliser →', text:`Intérêt couru = nominal × taux × jours, divisé par 36'000.`},
       ...microSteps(mergeRows(CL_JR)).map(s=>({btn:'Suite →', text:s.text, q:s.q}))],
   stage: ph => `<section class="sec"><h2>La donnée</h2><div class="donnee">Obligations : <b>${fmt(OB.nom)}</b> à <b>${OB.taux}&nbsp;%</b>, échéance le <b>${OB.ech}</b>.</div></section>
     ${ph>=1 ? `<section class="sec"><h2>Les jours et les intérêts courus</h2><div class="steps3">
       <div class="calc"><b>Nombre de jours</b><div class="row big"><span>de l'échéance à la clôture = du ${OB.ech} au 31.12 = 15 + 8 × 30 + 30</span><span>${CL_J} jours</span></div></div>
       ${ph>=2 ? `<div class="calc"><b>Intérêt couru</b><div class="row big fr"><span class="frac"><span>${fmt(OB.nom)} × ${OB.taux} × ${CL_J}</span><span>36'000</span></span><span>${fmt(CL_IC)}</span></div></div>` : ''}</div></section>` : ''}
     ${ph>=3 ? comptaK(CL_JR, ['Actifs transitoires','Produits des titres'], ph-2, true, ANSWERED ? null : 'Actifs transitoires') : ''}` },

 { title:'Rendement d\'actions',
   ph:[{btn:'Capital engagé →', text:`Le <b>taux de rendement</b> mesure ce qu'un placement rapporte par année, en % du capital engagé.`},
       {btn:'Les gains →', text:`On commence par le <b>capital engagé</b> : le prix d'achat.`},
       {btn:'Les jours →', text:`Les gains sont les dividendes encaissés et la plus-value ou la moins-value (différence entre le prix de vente et le prix d'achat).`},
       {btn:'Annualiser →', text:`Combien de jours a duré le placement ? Mois de 30 jours, année de 360 jours.`},
       {btn:'Le taux →', text:`Le placement a duré ${fmt(JOURS)} jours. Pour comparer, on calcule le gain <b>sur une année</b> (360 jours).`,
        q:{text:'Pourquoi utiliser le gain annualisé ?', opts:[['t','C\'est la loi'],['a','Un taux est toujours annuel']], ok:'a',
           fb:'un taux d\'intérêt ou de rendement est toujours pour <b>une année</b> : 5% = 5.- par an.'}},
       {btn:'Suite →', text:`Taux de rendement = gain annualisé × 100, divisé par le capital engagé.`}],
   stage: ph => `<section class="sec"><h2>La donnée</h2><div class="donnee">${fmt(RA.nb)} actions achetées le <b>5.03.${Y-4}</b> au cours de <b>${RA.achat}</b>, vendues le <b>15.06.${Y-1}</b> au cours de <b>${RA.vente}</b>.<br>
       Dividendes versés par action : ${RA.div.map((d,i)=>`${Y-4+i} : <b>${d.toFixed(2)}</b>`).join(' · ')}.</div></section>
     <section class="sec" ${ph<1?'style="display:none"':''}><h2>Calcul du rendement</h2><div class="steps3">
       ${ph>=1?`<div class="calc"><b>1. Capital engagé</b><div class="row"><span>${fmt(RA.nb)} × ${RA.achat}</span><span>${fmt(RA_cap)}</span></div></div>`:''}
       ${ph>=2?`<div class="calc"><b>2. Gains</b>${RA.div.map((d,i)=>`<div class="row"><span>Dividende ${Y-4+i} : ${fmt(RA.nb)} × ${d.toFixed(2)}</span><span>${fmt(d*RA.nb)}</span></div>`).join('')}
         <div class="row"><span>Plus-value à la revente : ${fmt(RA.nb)} × (${RA.vente} − ${RA.achat})</span><span>${fmt(RA_pv)}</span></div><div class="row big"><span>Gain total sur ${ph>=3?fmt(JOURS):'?'} jours</span><span>${fmt(RA_gain)}</span></div></div>`:''}
       ${ph>=3?`<div class="calc"><b>3. Nombre de jours</b><div class="row big"><span>${JOURS_TXT}</span><span>${fmt(JOURS)} jours</span></div></div>`:''}
       ${ph>=4?`<div class="calc"><b>4. Gain annualisé</b><div class="row big fr"><span class="frac"><span>${fmt(RA_gain)} × 360</span><span>${fmt(JOURS)}</span></span><span>${fmt(RA_an)}</span></div></div>`:''}
       ${ph>=5?`<div class="calc q"><b>5. Taux de rendement</b><div class="row big fr"><span class="frac"><span>${fmt(RA_an)} × 100</span><span>${fmt(RA_cap)}</span></span><span>${(Math.round(RA_r*100)/100).toFixed(2)}&nbsp;%</span></div></div>`:''}</div></section>` },

 { title:'Rendement d\'obligations',
   ph:[{btn:'Capital engagé →', text:`Même calcul pour des obligations.`},
       {btn:'La revente →', text:`Le capital engagé est le prix d'achat : nominal × cours.`},
       {btn:'Les jours →', text:`À la revente, le cours est plus bas qu'à l'achat : c'est une <b>perte</b>.`},
       {btn:'Annualiser →', text:`Combien de jours a duré le placement ? Mois de 30 jours, année de 360 jours.`},
       {btn:'L\'intérêt →', text:`La perte est ramenée à <b>une année</b> (360 jours).`},
       {btn:'Le total →', text:`S'ajoute l'<b>intérêt annuel</b> : ${RO.taux}&nbsp;% du nominal.`},
       {btn:'Le taux →', text:`Le gain annualisé est l'intérêt annuel moins la perte annualisée.`},
       {btn:'Suite →', text:`Le taux de rendement est plus bas que le taux d'intérêt de ${RO.taux}&nbsp;% : l'obligation a été achetée au-dessus du pair (${RO.achat}&nbsp;%) et vendue plus bas.`}],
   stage: ph => `<section class="sec"><h2>La donnée</h2><div class="donnee">Obligations à <b>${RO.taux}&nbsp;%</b> pour <b>${fmt(RO.nom)}</b> de nominal, achetées le <b>5.03.${Y-4}</b> au cours de <b>${RO.achat}&nbsp;%</b>, vendues le <b>15.06.${Y-1}</b> au cours de <b>${RO.vente}&nbsp;%</b>.</div></section>
     <section class="sec" ${ph<1?'style="display:none"':''}><h2>Calcul du rendement</h2><div class="steps3">
       ${ph>=1?`<div class="calc"><b>1. Capital engagé</b><div class="row"><span>${fmt(RO.nom)} × ${RO.achat} %</span><span>${fmt(RO_cap)}</span></div></div>`:''}
       ${ph>=2?`<div class="calc"><b>2. ${RO_pv<0?'Perte':'Gain'} à la revente</b><div class="row"><span>${fmt(RO.nom)} × (${RO.vente} − ${RO.achat}) %</span><span>${fmt(RO_pv)}</span></div></div>`:''}
       ${ph>=3?`<div class="calc"><b>3. Nombre de jours</b><div class="row big"><span>${JOURS_TXT}</span><span>${fmt(JOURS)} jours</span></div></div>`:''}
       ${ph>=4?`<div class="calc"><b>4. Gain/Perte à la revente annualisé</b>
         <div class="row fr"><span>${RO_pv<0?'Perte':'Gain'} annualisé${RO_pv<0?'e':''} : <span class="frac"><span>${fmt(RO_pv)} × 360</span><span>${fmt(JOURS)}</span></span></span><span>${fmt(RO_pvan)}</span></div>
         ${ph>=5?`<div class="row"><span>+ Intérêt annuel : ${RO.taux} % de ${fmt(RO.nom)}</span><span>${fmt(RO_int)}</span></div>`:''}
         ${ph>=6?`<div class="row big"><span>= Gain annualisé</span><span>${fmt(RO_an)}</span></div>`:''}</div>`:''}
       ${ph>=7?`<div class="calc q"><b>5. Taux de rendement</b><div class="row big fr"><span class="frac"><span>${fmt(RO_an)} × 100</span><span>${fmt(RO_cap)}</span></span><span>${(Math.round(RO_r*100)/100).toFixed(2)}&nbsp;%</span></div></div>`:''}</div></section>` }
];
const LAST = STEPS.length-1;

/* ---------- Actions ---------- */
const A = [];
STEPS.forEach((s,i)=>s.ph.forEach((_,p)=>A.push({step:i, ph:p})));
let pos = 0;

/* ---------- Rendu ---------- */
function qBox(key, q){
  const ch = ANS[key];
  const btn = (a,lb) => `<button class="ch ${ch===a?(a===q.ok?'ok':'ko'):''} ${ch?'':'blink'}" data-a="${a}" ${ch?'disabled':''}>${lb}</button>`;
  const fb = ch ? `<div class="fb ${ch===q.ok?'ok':'ko'}">${ch===q.ok?'✓ En effet':'✗ En fait'}, ${q.fb}</div>` : `<div class="hint">Cliquer sur la bonne réponse.</div>`;
  return `<div class="calc q"><div style="font-weight:600;margin-bottom:4px">La question à se poser</div>${q.text}
    <div class="choices" style="flex-wrap:wrap">${q.opts.map(([a,lb])=>btn(a,lb)).join('')}</div>${fb}</div>`;
}
const LET = i => String.fromCharCode(65+i);   // A, B, C…
function render(){
  pos = Math.max(0, Math.min(A.length-1, pos));
  const {step, ph} = A[pos], S = STEPS[step], P = S.ph[ph], key = step+'.'+ph;
  document.querySelectorAll('.dot').forEach((b,i)=>{ b.classList.toggle('cur', i===step); b.classList.toggle('done', i<step); });
  $('prev').disabled = pos===0;
  $('next').disabled = pos===A.length-1 || (P.q && !ANS[key]);
  $('next').textContent = pos===A.length-1 ? 'Terminé ✓' : P.btn;
  $('explain').innerHTML = `<h2 class="steptitle">${LET(step)}. ${S.title}</h2>
    <p class="steptext">${P.text}</p>${P.q?qBox(key,P.q):''}`;
  ANSWERED = !!ANS[key];
  $('stage').innerHTML = S.stage(ph);
}

/* ---------- Navigation ---------- */
function goTo(p){ pos = p; render(); }
function goStep(s){ goTo(A.findIndex(a=>a.step===s)); }
let Z = 1;
try { Z = +localStorage.getItem('titres-zoom') || 1; } catch(e){}
function applyZoom(){
  Z = Math.round(Math.max(0.8, Math.min(1.6, Z))*10)/10;
  document.documentElement.style.setProperty('--z', Z);
  try { localStorage.setItem('titres-zoom', Z); } catch(e){}
}
$('dots').innerHTML = STEPS.map((s,i)=>`<button class="dot" data-s="${i}" title="${LET(i)}. ${s.title}" aria-label="${LET(i)}. ${s.title}"></button>`).join('');
$('zm').addEventListener('click', ()=>{ Z -= 0.1; applyZoom(); });
$('zp').addEventListener('click', ()=>{ Z += 0.1; applyZoom(); });
$('next').addEventListener('click', ()=>goTo(pos+1));
$('prev').addEventListener('click', ()=>goTo(pos-1));
$('explain').addEventListener('click', e=>{ const b=e.target.closest('.ch'); if (!b || b.disabled) return; const {step,ph}=A[pos]; ANS[step+'.'+ph] = b.dataset.a; render(); });
$('quit').addEventListener('click', ()=>{ window.close(); setTimeout(()=>{ $('quit-msg').style.display='block'; }, 300); });
$('dots').addEventListener('click', e=>{ const b=e.target.closest('.dot'); if (b) goStep(+b.dataset.s); });
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' && !$('next').disabled) goTo(pos+1);
  if (e.key==='ArrowLeft') goTo(pos-1);
});
render();
applyZoom();
</script>
<script src="theorie.js"></script>
</body>
</html>
