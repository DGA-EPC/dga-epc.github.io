<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journalisation - Exercice de Comptabilité</title>
    <link rel="stylesheet" href="style.css">
    <!-- Réglages propres à cette page (le reste est dans style.css) -->
    <style>
        header, footer { border-top: 10px solid #24f400; border-bottom: 6px solid #ffff00; }
        h4 { margin-bottom: 0px; }
    </style>
</head>
<body>
    <header>
        <h2>Journalisation avec écritures multiples</h2>
        <h1>Les immeubles</h1>
        <h4>Sauf indication contraire, il s'agit d'<strong>immeubles locatifs</strong></h4>
    </header>

    <!-- L'exercice est construit ici par journal.js -->
    <div class="container" id="exercice"></div>

    <script>
    const EXERCICE = {

        // ===== Comptes proposés dans les menus déroulants =====
        comptes: {
            "ACTIF": ["Caisse", "Poste", "Banque", "Créances clients", "Autres créances", "Stock de marchandises", "Machines", "Véhicules", "Immeubles", "FAC sur immeubles"],
            "PASSIF": ["Dettes fournisseurs", "Autres dettes", "Dette hypothécaire", "Capital", "Privé"],
            "MARCHANDISES": ["Ventes de marchandises", "Achats de marchandises"],
            "CHARGES ET PRODUITS": ["Salaires", "Charges sociales", "Loyers", "Electricité", "Entretien et réparations", "Frais d'administration", "Assurances", "Amortissements", "Charges financières", "Produits financiers", "Charges d'immeubles", "Produits d'immeubles", "Charges exceptionnelles", "Produits exceptionnels"]
        },

        // ===== Écritures (ajouter les nouvelles à la fin, séparées par une virgule) =====
        // Modèle :  { description: "...", solution: [ { debit: "Compte", credit: "", amount: 100 }, ... ] }
        ecritures: [
        {
            description: "Vente d'un immeuble 1'200. Il figure dans nos comptes pour une valeur amortie de 800 (amortissements directs). Le montant est viré à la poste.",
            solution: [
                { debit: "Poste", credit: "", amount: 1200 },
                { debit: "", credit: "Immeubles", amount: 1200 },
                { debit: "Immeubles", credit: "Produits exceptionnels", amount: 400 }
            ]
        },
        {
            description: "Paiement de l'annuité hypothécaire trimestrielle:\nAmortissement\tCHF 1'500.-\nIntérêts\tCHF   800.-\n\Annuité\t\tCHF 2'300.-",
            solution: [
                { debit: "Dette hypothécaire", credit: "", amount: 1500 },
                { debit: "Charges d'immeubles", credit: "", amount: 800 },
                { debit: "", credit: "Banque", amount: 2300 }
            ]
        },
        {
            description: "Encaissement des loyers des appartements locatifs, CHF 700.",
            solution: [
                { debit: "Banque", credit: "Produits d'immeubles", amount: 700 }
            ]
        },
        {
            description: "Paiement par poste des frais de notaire pour l'acquisition d'un nouvel immeuble, CHF 5'000.-.",
            solution: [
                { debit: "Immeubles", credit: "Poste", amount: 5000 }
            ]
        },
        {
            description: "Tenir compte d'un loyer de 900 pour l'appartement qu'occupe le propriétaire de l'entreprise dans notre immeuble. ",
            solution: [
                { debit: "Privé", credit: "Produits d'immeubles", amount: 900 }
            ]
        },
        {
            description: "Paiement du salaire du concierge de notre immeuble locatif :\nSalaire brut\t\tCHF 450\nRetenue pour le loyer\tCHF 150\nVersé par poste\t\tCHF 300",
            solution: [
                { debit: "Charges d'immeubles", credit: "", amount: 450 },
                { debit: "", credit: "Produits d'immeubles", amount: 150 },
                { debit: "", credit: "Poste", amount: 300 }
            ]
        },
        {
            description: "Amortissement constant et indirect de l'immeuble commercial, 300.",
            solution: [
                { debit: "Amortissements", credit: "FAC sur immeubles", amount: 300 }
            ]
        },
        {
            description: "Amortissement constant et direct de l'immeuble locatif, 400",
            solution: [
                { debit: "Charges d'immeubles", credit: "Immeubles", amount: 400 }
            ]
        },
        {
            description: "Paiement par poste des charges d'électricité :\npour l'immeuble locatif:\tCHF   600\npour l'entreprise\t\tCHF   800\nTotal\t\t\t\tCHF 1'400",
            solution: [
                { debit: "Charges d'immeubles", credit: "", amount: 600 },
                { debit: "Electricité", credit: "", amount: 800 },
                { debit: "", credit: "Poste", amount: 1400 }
            ]
        },
        {
            description: "Reprise de dette hypothécaire lors de l'achat d'un immeuble, 800",
            solution: [
                { debit: "Autres dettes", credit: "Dette hypothécaire", amount: 800 }
            ]
        },
        {
            description: "Comptabilisation des frais de ramoneur pour notre immeuble, 300",
            solution: [
                { debit: "Charges d'immeubles", credit: "Autres dettes", amount: 300 }
            ]
        },
        {
            description: "Paiement par banque de diverses assurances :\n- RC d'entreprise\t300\n- ECAB*\t\t\t100\n- RC du patron\t\t 60\n- Total\t\t\t460\n\n*ECAB = assurance incendie pour les immeubles (Etablissement cantonal d'assurance bâtiment).",
            solution: [
                { debit: "", credit: "Banque", amount: 460 },
                { debit: "Assurances", credit: "", amount: 300 },
                { debit: "Charges d'immeubles", credit: "", amount: 100 },
                { debit: "Privé", credit: "", amount: 60 }
            ]
        },
        {
            description: "Paiement de l'annuité hypothécaire trimestrielle de CHF 5'000.-.\nDette hypotécaire : CHF 800'000.-. Intérêts : 1.5%",
            solution: [
                { debit: "Dette hypothécaire", credit: "", amount: 2000 },
                { debit: "Charges d'immeubles", credit: "", amount: 3000 },
                { debit: "", credit: "Banque", amount: 5000 }
            ]
        }

    
            /* Ajouter d'autres écritures ici par la suite
            ,
            {
                description: """,
                solution: [
                    { debit: "", credit: "", amount:  },
                    { debit: "", credit: "", amount:   }
                ]
            }
            */
        ]
    };
    </script>
    <script src="journal.js"></script>
</body>
</html>
