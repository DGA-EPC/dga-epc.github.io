<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les amortissements – théorie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theorie.css">
<style>

:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1e2226; --muted:#6a6f76; --line:#e2ddd2; --soft:#efebe3;
  --charge:#c2671f; --charge-bg:#fcefe3;
  --produit:#2b8352; --produit-bg:#e6f4eb;
  --res:#6d48b3; --res-bg:#efe9f9;
  --passif:#a3333d; --passif-bg:#f8e8ea;
  --bilan:#20394f; --bilan-bg:#e6ecf1;
  --actif:#2a52be; --actif-bg:#e8eefb;
  --accent:#c98a10; --accent-bg:#fff3d6;
  --y1:#e8eefb; --y2:#fff3d6;
}
.calc.q{background:var(--bilan-bg)}
.ch.ko{background:var(--charge);border-color:var(--charge);color:#fff;opacity:1}
.fb.ko{border-left:4px solid var(--charge)}
.ch.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(32,57,79,0)}50%{box-shadow:0 0 0 5px rgba(201,138,16,.75);background:var(--accent-bg)}}
.tag.at{background:var(--actif-bg);color:var(--actif)}
.tag.pt{background:var(--passif-bg);color:var(--passif)}
.journal td.dt{color:var(--muted);white-space:nowrap}
.journal tr.todo td{opacity:0}
.btn.quiz{display:flex;align-items:center;justify-content:center;background:#037DFF;color:#fff;border-color:#037DFF;text-align:center;text-decoration:none}

/* Ligne du temps */
.t{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px 8px;position:relative;min-width:0}
.t-head{font-weight:700;font-size:13.5px;text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-body{display:grid;grid-template-columns:1fr 1fr;min-height:46px}
.col{padding:4px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ln{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px;font-size:11.5px;border-radius:4px;padding:1px 2px}
.ln .lb{color:var(--muted);line-height:1.25;min-width:0}
.ln.ext .lb{font-style:italic}
.eff .tag{font-size:11.5px}

/* Introduction et résumé */
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:14px}
.quad .hd.pt{background:var(--passif-bg);color:var(--passif)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:12px 12px 90px}
  aside{position:static;max-height:none;overflow:visible}
  .nav-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(245,243,238,.95);backdrop-filter:blur(6px);padding:10px 12px;border-top:1px solid var(--line)}
  .two,.quad{grid-template-columns:1fr}
}

/* --- Amortissements --- */
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity .3s,box-shadow .3s}
.card.on{box-shadow:0 0 0 2px var(--accent)}
.card.off{opacity:.45}
.card .lt{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-weight:700;font-size:12px;margin-right:6px}
.card h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center}
.card .ex{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.ecr{display:flex;justify-content:space-between;gap:8px;font-size:13px;background:var(--soft);border-radius:8px;padding:6px 10px;font-weight:600}
.ecr span:last-child{color:var(--muted);font-weight:500}
.vocab tr.cur td{background:var(--hl)}
.tab tr.todo td{color:transparent}
.tab tr.cur td{background:var(--hl);font-weight:700}
.tab tr.cur td.am{color:var(--charge)}
.tab td.am{color:var(--charge)}.bil .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:2px 0}
.bil .row.sub{color:var(--passif)}
.bil .row.tot{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:4px}
.k-fac .t-head{color:var(--passif)}
.t-head{white-space:normal !important;line-height:1.2}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){ .split{grid-template-columns:1fr} }

.jr-stage{max-width:640px;margin-bottom:16px}
.jr-stage .journal{font-size:13.5px}
/* Amortir = diminuer : une situation par ligne */
.sits{display:flex;flex-direction:column;gap:12px}
.sit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:14px;align-items:center;animation:fadein .5s ease-out}
.sit .card{height:100%}
.sit .t2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sit .wait{border:2px dashed var(--line);border-radius:10px;height:100%;min-height:70px;display:grid;place-items:center;color:var(--muted);font-size:13px}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:1100px){ .sit{grid-template-columns:1fr} }
/* Encadré de l'exemple */
.exbox{border:2px solid var(--accent);background:var(--accent-bg);border-radius:10px;padding:8px 14px;margin-bottom:12px;font-size:15px}
.exbox b{color:var(--ink)}
/* Deux exercices */
.yr{font-size:12.5px;font-weight:700;color:var(--bilan);margin:14px 0 6px;padding-top:8px;border-top:1px dashed var(--line)}
.yr:first-of-type{border-top:0;margin-top:4px;padding-top:0}
.bils{display:flex;gap:14px;flex-wrap:wrap}
.bils .bil{flex:1;min-width:240px;animation:fadein .5s ease-out}
/* Vente : les deux cas l'un après l'autre */
.t.k-inc .t-head{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="panel">
      <h1>Les amortissements</h1>
      <p class="sub">Perte de valeur des immobilisations</p>
      <div class="dots" id="dots"></div>
    </div>

    <div class="panel" id="explain"></div>

    <div class="nav-wrap">
      <div class="nav">
        <button class="btn" id="prev">← Précédent</button>
        <button class="btn primary" id="next">Suivant →</button>
      </div>
    </div>

    <div class="nav exit">
      <button class="btn quit" id="quit">Quitter</button>
    </div>
    <p class="note" id="quit-msg" style="display:none;color:#fff">Le navigateur ne permet pas de fermer cette fenêtre automatiquement : fermer l'onglet.</p>
  </aside>

  <main class="stage" id="stage"></main>
</div>
<div class="zoombar"><button id="zm" title="Réduire la taille" aria-label="Réduire la taille">A−</button><button id="zp" title="Agrandir la taille" aria-label="Agrandir la taille">A+</button></div>

<script>
/* ---------- Réglages ---------- */
const Y0 = new Date().getFullYear();          // année d'acquisition = année en cours
const VA = 20000;                              // valeur d'acquisition des exemples
const ANS = {};                                // réponses choisies (par étape)

const KIND = {'Véhicules':'actif','Véhicules (ancien)':'actif','Véhicules (nouveau)':'actif','Banque':'actif',
  'Amortissements':'charge','Charges exceptionnelles':'charge','Produits exceptionnels':'produit','FAC s/Véhicules':'fac',
  'Dette bancaire':'passif','Liquidités':'actif','Pertes sur créances':'charge','Créances clients':'actif','Ducroire':'fac','Mobilier':'actif'};
const fmt = n => { const neg=n<0; n=Math.abs(Math.round(n*100)/100); const [i,d]=n.toFixed(2).split('.');
  return (neg?'−':'') + i.replace(/\B(?=(\d{3})+(?!\d))/g,"'") + (d!=='00' ? '.'+d : ''); };
const r2 = x => Math.round(x*100)/100;
const $ = id => document.getElementById(id);
const COL = {am:'#c2671f', vr:'#2a52be', deg:'#c98a10'};

/* ---------- Tableaux d'amortissement ---------- */
function tableau(mode){
  const R = []; let vr = VA, cum = 0;
  if (mode==='const'){
    for (let i=1;i<=5;i++){ const a = VA*0.2; cum += a; vr = VA-cum; R.push({an:i, base:VA, a, cum, vr}); }
  } else {
    for (let i=1;i<=6;i++){
      const base = vr, a = i===6 ? vr : r2(base*0.4*(i===1?0.5:1));
      if (mode==='deg1' && i>5) break;
      if (mode==='deg1'){ const a1 = i===5 ? vr : r2(base*0.4); cum = r2(cum+a1); vr = r2(VA-cum); R.push({an:i, base, a:a1, cum, vr}); continue; }
      cum = r2(cum+a); vr = r2(VA-cum); R.push({an:i, base, a, cum, vr});
    }
  }
  return R;
}
const TC = tableau('const'), TD = tableau('deg'), TD1 = tableau('deg1');   // deg1 : dégressif dès le 1er janvier

function tabHTML(R, upto){
  return `<table class="tab"><tr><th>Année</th><th>Valeur de calcul</th><th>Amortissement</th><th>Cumul</th><th>Valeur résiduelle</th></tr>
    ${R.map(r=>`<tr class="${r.an===upto?'cur':r.an>upto?'todo':''}"><td>${r.an} · ${Y0+r.an-1}</td><td>${fmt(r.base)}</td><td class="am">${fmt(r.a)}</td><td>${fmt(r.cum)}</td><td class="vr">${fmt(r.vr)}</td></tr>`).join('')}</table>`;
}

/* Graphique en barres : amortissement et valeur résiduelle par année */
function barChart(R, upto){
  const W=900, H=300, L=60, B=34, T=26, n=R.length, gw=(W-L-10)/n, sc=v=>(H-B-T)*v/VA;
  let g = '';
  [0,5000,10000,15000,20000].forEach(v=>{ const y=H-B-sc(v); g+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#e2ddd2"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`; });
  R.forEach((r,i)=>{
    const x = L + i*gw + gw*0.14, bw = gw*0.34, on = r.an<=upto, op = on?1:0;   // années suivantes : barres invisibles
    g += `<rect x="${x}" y="${H-B-sc(r.a)}" width="${bw}" height="${sc(r.a)}" rx="3" fill="${COL.am}" opacity="${op}"/>`;
    g += `<rect x="${x+bw+3}" y="${H-B-sc(r.vr)}" width="${bw}" height="${Math.max(sc(r.vr),0.5)}" rx="3" fill="${COL.vr}" opacity="${op}"/>`;
    g += `<text x="${L+i*gw+gw/2}" y="${H-B+16}" text-anchor="middle">Année ${r.an}</text>`;
    if (r.an===upto) g += `<text x="${x+bw/2}" y="${H-B-sc(r.a)-5}" text-anchor="middle" style="fill:${COL.am};font-weight:700">${fmt(r.a)}</text><text x="${x+bw*1.5+3}" y="${H-B-sc(r.vr)-5}" text-anchor="middle" style="fill:${COL.vr};font-weight:700">${fmt(r.vr)}</text>`;
  });
  g += `<g class="lg"><rect x="${L}" y="4" width="12" height="12" rx="2" fill="${COL.am}"/><text x="${L+18}" y="14">amortissement</text>
        <rect x="${L+140}" y="4" width="12" height="12" rx="2" fill="${COL.vr}"/><text x="${L+158}" y="14">valeur résiduelle</text></g>
        <text x="${W-6}" y="${H-4}" text-anchor="end">année</text><text x="4" y="14">CHF</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* Graphique en barres : amortissement annuel constant vs dégressif, côte à côte */
function compareChart(){
  const W=900, H=300, L=60, B=34, T=30, n=5, MAX=8000, gw=(W-L-10)/n, sc=v=>(H-B-T)*v/MAX;
  let g = '';
  [0,2000,4000,6000,8000].forEach(v=>{ const y=H-B-sc(v); g+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#e2ddd2"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`; });
  for (let i=0;i<n;i++){
    const x = L + i*gw + gw*0.14, bw = gw*0.34, c = TC[i].a, d = TD1[i].a;
    g += `<rect x="${x}" y="${H-B-sc(c)}" width="${bw}" height="${sc(c)}" rx="3" fill="${COL.vr}"/>`;
    g += `<rect x="${x+bw+3}" y="${H-B-sc(d)}" width="${bw}" height="${sc(d)}" rx="3" fill="${COL.deg}"/>`;
    g += `<text x="${x+bw/2}" y="${H-B-sc(c)-5}" text-anchor="middle" style="fill:${COL.vr};font-weight:700">${fmt(c)}</text>`;
    g += `<text x="${x+bw*1.5+3}" y="${H-B-sc(d)-5}" text-anchor="middle" style="fill:${COL.deg};font-weight:700">${fmt(d)}</text>`;
    g += `<text x="${L+i*gw+gw/2}" y="${H-B+16}" text-anchor="middle">Année ${i+1}</text>`;
  }
  g += `<g class="lg"><rect x="${L}" y="4" width="12" height="12" rx="2" fill="${COL.vr}"/><text x="${L+18}" y="14">constant 20 %</text>
        <rect x="${L+140}" y="4" width="12" height="12" rx="2" fill="${COL.deg}"/><text x="${L+158}" y="14">dégressif 40 %</text></g>
        <text x="${W-6}" y="${H-4}" text-anchor="end">année</text><text x="4" y="14">CHF</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ---------- Comptes en T ---------- */
function postings(J, acc, ph){
  const P = {d:[], c:[]};
  J.forEach(e=>{
    if (e.ph>ph) return;
    const fresh = e.ph===ph;
    if (e.open){ if (e.open===acc) P[e.side].push({lb:e.lab||'sàn', amt:e.amt, fresh}); return; }
    if (e.d===acc) P.d.push({lb:e.n, amt:e.amt, fresh});
    if (e.c===acc) P.c.push({lb:e.n, amt:e.amt, fresh});
  });
  return P;
}
const short = a => a.replace(/ \((ancien|nouveau)\)/,'');
const sum = arr => arr.reduce((s,l)=>s+l.amt,0);
function tHTML(acc, P, focus, eff, name){
  name = name || acc;
  const col = arr => arr.map(l=>`<div class="ln ${l.fresh?'fresh':''}"><span class="lb">${l.lb}</span><span class="am">${typeof l.amt==='string'?l.amt:fmt(l.amt)}</span></div>`).join('');
  return `<div class="t k-${name==='?'?'inc':KIND[acc]} ${focus?'focus':''}">
    <div class="t-sides"><span>D</span><span class="t-head" title="${name}">${name}</span><span>C</span></div>
    <div class="t-body"><div class="col d">${col(P.d)}</div><div class="col c">${col(P.c)}</div></div>
    ${eff?`<div class="eff">${eff}</div>`:''}</div>`;
}

/* ---------- Les étapes ---------- */
const S_SENS = [   // lettre, titre, exemple, débit [compte, effet], crédit [compte, effet], compte amorti
  ['a','Amortissement d\'une dette','Rembourser partiellement une dette (bancaire).',['Dette bancaire','diminue'],['Liquidités','diminue'],'Dette bancaire'],
  ['b','Amortissement d\'une créance','Effacer la facture d\'un client qui ne paiera pas.',['Pertes sur créances','augmente'],['Créances clients','diminue'],'Créances clients'],
  ['c','Amortissement d\'une perte','Utiliser une provision pour diminuer une charge.',['Ducroire','diminue'],['Pertes sur créances','diminue'],'Pertes sur créances'],
  ['d','Amortissement d\'une immobilisation','Comptabiliser la perte de valeur.',['Amortissements','augmente'],['Mobilier','diminue'],'Mobilier']];
const S_TXT = [
  `La dette diminue : <b>Dette bancaire</b> au débit. Le paiement diminue les <b>Liquidités</b> : au crédit.`,
  `La perte est une charge : <b>Pertes sur créances</b> au débit. La créance disparaît : <b>Créances clients</b> au crédit.`,
  `La provision (<b>Ducroire</b>) est utilisée : elle diminue au débit. La charge <b>Pertes sur créances</b> diminue : au crédit.`,
  `La perte de valeur est une charge : <b>Amortissements</b> au débit. La valeur du <b>Mobilier</b> diminue : au crédit.`];
const S_Q = [`Première situation : on rembourse une partie d'une dette bancaire. Quelle écriture ?`,
  `Deuxième situation : un client ne paiera pas sa facture. Quelle écriture ?`,
  `Troisième situation : on utilise une provision, le ducroire, pour couvrir une perte. Quelle écriture ?`,
  `Quatrième situation : une immobilisation perd de la valeur. Quelle écriture ?`];
const sensT = ([acc,eff], side) => tHTML(acc, {d: side==='d'?[{lb:eff, amt:eff==='diminue'?'−':'+'}]:[], c: side==='c'?[{lb:eff, amt:eff==='diminue'?'−':'+'}]:[]}, false, '');

const CAUSES = [['⚙️','L\'utilisation','L\'usure : plus on s\'en sert, plus elle s\'use.'],
  ['⏳','Le temps qui passe','La mode, l\'évolution technologique (obsolescence : l\'objet devient obsolète), la fin d\'un droit (brevet).'],
  ['⛏️','L\'épuisement','Les ressources s\'épuisent : mine, gravière.']];

const STEPS = [
 { title:'Amortir = diminuer',
   ph:[{btn:'Réponse →', text:`En allemand : <i>Abschreibungen</i>.<br><br>« Amortir » veut dire <b>diminuer</b>. Le mot s'utilise dans <b>4 situations</b> différentes.<br><br>${S_Q[0]}`},
       {btn:'Situation b →', text:S_TXT[0]},
       {btn:'Réponse →', text:S_Q[1]},
       {btn:'Situation c →', text:S_TXT[1]},
       {btn:'Réponse →', text:S_Q[2]},
       {btn:'Situation d →', text:S_TXT[2]},
       {btn:'Réponse →', text:S_Q[3]},
       {btn:'Suite →', text:S_TXT[3]},
       {btn:'Suite →', text:`Dans ce chapitre, on s'intéresse au sens <b>d)</b> : l'amortissement d'une <b>immobilisation</b>.<br><br>L'amortissement est une <b>charge</b> (au débit) qui diminue la valeur de l'actif (au crédit).`}],
   stage: ph => `<section class="sec"><h2>Les 4 sens du mot « amortir »</h2><div class="sits">
     ${S_SENS.filter((_,k)=>ph>=2*k).map(([l,t,ex,d,c],k)=>`<div class="sit"><div class="card ${ph===8?(l==='d'?'on':'off'):(ph>>1)===k?'on':''}"><h4><span class="lt">${l}</span>${t}</h4><div class="ex">${ex}</div></div>
       ${ph>=2*k+1?`<div class="t2">${sensT(d,'d')}${sensT(c,'c')}</div>`:`<div class="wait">Quelle écriture ?</div>`}</div>`).join('')}</div></section>` },

 { title:'Pourquoi perdre de la valeur ?',
   ph:[{btn:'Cause suivante →', text:`Une immobilisation (machine, véhicule, mobilier…) est utilisée pendant plusieurs années. Chaque année, elle perd une partie de sa valeur : c'est cette perte qu'on comptabilise.<br><br>Première cause : l'<b>utilisation</b>.`},
       {btn:'Cause suivante →', text:`Deuxième cause : le <b>temps qui passe</b>.`},
       {btn:'Attention →', text:`Troisième cause : l'<b>épuisement</b> des ressources.`},
       {btn:'Suite →', text:`Un terrain ne s'use pas : on ne l'amortit pas.`}],
   stage: ph => `<section class="sec"><h2>Les causes de la perte de valeur</h2><div class="cards">
     ${CAUSES.filter((_,k)=>ph>=k).map(([ic,t,ex],k)=>`<div class="card ${ph===k?'on':''}" style="animation:fadein .5s ease-out"><div class="ico">${ic}</div><h4>${t}</h4><div class="ex">${ex}</div></div>`).join('')}
     </div></section>
     ${ph>=3?`<section class="sec"><h2>Attention</h2><div class="calc" style="margin:0">En comptabilité, on <b>n'amortit pas les terrains</b> : ils ne s'usent pas.</div></section>`:''}` },

 { title:'Le vocabulaire',
   ph:[{btn:'Suite →', text:`Les mots à connaître pour parler de la valeur d'une immobilisation.`}],
   stage: ph => `<section class="sec"><h2>Les mots à connaître</h2><table class="vocab">
       <tr class="cur"><td>Valeur d'acquisition</td><td>Valeur d'achat, au prix de revient d'achat (PRA).</td></tr>
       <tr class="cur"><td>Cumul d'amortissements</td><td>Le total des amortissements effectués.</td></tr>
       <tr class="cur"><td>Valeur résiduelle<br><span style="font-weight:400;color:var(--muted)">(Buchwert)</span></td><td> = valeur d'acquisition − total des amortissements.<p>On dit aussi <b>Valeur comptable</b> ou encore <b>valeur amortie.</b></td></tr>
       <tr><td>Valeur intrinsèque</td><td>Valeur matérielle (p. ex. la valeur de l'or d'une bague).</td></tr>
       <tr><td>Valeur vénale<br><span style="font-weight:400;color:var(--muted)">(Verkehrswert)</span></td><td>Valeur du marché : le prix auquel on pourrait la vendre.</td></tr></table></section>` },

 { title:'Amortissement constant', tab:'const' },
 { title:'Amortissement dégressif', tab:'deg' },

 { title:'Quel taux utiliser ?',
   ph:[{btn:'Suite →', text:`Les deux méthodes appliquées au même véhicule de ${fmt(VA)}, acheté le 1<sup>er</sup> janvier (pas de prorata).`,
        q:{text:'Quelle méthode amortit le plus au début ?', opts:[['const','constant'],['deg','dégressif']], ok:'deg',
           fb:'le <b>dégressif</b> amortit davantage les premières années (8\'000 contre 4\'000 la 1<sup>re</sup> année), puis de moins en moins.'}}],
   extra: () => ANS['5.0'] ? `<div class="calc">En comptabilité, on applique le <b>principe de prudence</b> : on devrait amortir le plus vite possible.<br><br>L'<b>AFC</b> (Administration fédérale des contributions) fixe un <b>taux maximum</b> autorisé pour chaque type d'immobilisation.</div>` : '',
   stage: () => `<section class="sec"><h2>Amortissement annuel : constant ou dégressif</h2>${compareChart()}</section>` },

 { title:'Amortissement direct', cpt:{
   accs:['Véhicules','Amortissements'], y2:2,
   J:[{ph:0,open:'Véhicules',side:'d',amt:VA,lab:'Achat'},
      {ph:1,d:'Amortissements',c:'Véhicules',amt:4000,dt:`31.12.${Y0}`},
      {ph:2,y:2,open:'Véhicules',side:'d',amt:16000,lab:'sàn'},
      {ph:3,y:2,d:'Amortissements',c:'Véhicules',amt:4000,dt:`31.12.${Y0+1}`}],
   eff:(acc,P,on)=> !on ? '' : acc==='Véhicules' ? `Au bilan : <span class="tag at">${fmt(sum(P.d)-sum(P.c))}</span>` : `Au compte de résultat : <span class="tag bad">${fmt(sum(P.d))}</span>`,
   bilan: ph => `<div class="bils"><div class="bil"><h4>Bilan au 31.12.${Y0}</h4><div class="grp">Immobilisés</div>
      <div class="row"><span>Véhicules</span><span>${fmt(ph>=1?16000:VA)}</span></div></div>
      ${ph>=3?`<div class="bil"><h4>Bilan au 31.12.${Y0+1}</h4><div class="grp">Immobilisés</div>
      <div class="row"><span>Véhicules</span><span>12'000</span></div></div>`:''}</div>`},
   ph:[{btn:'Amortir au 31.12 →', text:`Un véhicule est acheté ${fmt(VA)} début ${Y0}. Il est amorti de 20 % (constant), soit 4'000 par an.`},
       {btn:'Exercice suivant →', text:`Le compte de l'immobilisation est <b>crédité directement</b> du montant de l'amortissement.<br><br>Au bilan, on ne voit plus que la valeur résiduelle (16'000) : la <b>valeur d'acquisition n'apparaît plus</b>.`},
       {btn:'Amortir au 31.12 →', text:`Le 1<sup>er</sup> janvier ${Y0+1}, on rouvre les comptes. Véhicules repart avec le solde à nouveau : <b>16'000</b>.<br><br>Le compte Amortissements est une charge : il repart à zéro.`},
       {btn:'Suite →', text:`Deuxième amortissement : 4'000. La valeur au bilan baisse à <b>12'000</b>.<br><br>On ne voit toujours pas la valeur d'acquisition ni le cumul des amortissements.`}],
   extra: ph => ph<1 ? '' : `<div class="calc"><div style="font-weight:600;margin-bottom:4px">Autres exemples</div>
      <div class="row"><span>Amortissements / Machines</span></div><div class="row"><span>Amortissements / Immeuble commercial</span></div>
      <div class="row"><span>Charges d'immeuble / Immeuble locatif</span></div></div>` },

 { title:'Amortissement indirect', cpt:{
   accs:['Véhicules','FAC s/Véhicules','Amortissements'], y2:2,
   J:[{ph:0,open:'Véhicules',side:'d',amt:VA,lab:'Achat'},
      {ph:1,d:'Amortissements',c:'FAC s/Véhicules',amt:4000,dt:`31.12.${Y0}`},
      {ph:2,y:2,open:'Véhicules',side:'d',amt:VA,lab:'sàn'},{ph:2,y:2,open:'FAC s/Véhicules',side:'c',amt:4000,lab:'sàn'},
      {ph:3,y:2,d:'Amortissements',c:'FAC s/Véhicules',amt:4000,dt:`31.12.${Y0+1}`}],
   eff:(acc,P,on)=> !on ? '' : acc==='Véhicules' ? `Au bilan : <span class="tag at">${fmt(sum(P.d))}</span>` : acc==='Amortissements' ? `Au compte de résultat : <span class="tag bad">${fmt(sum(P.d))}</span>` : `Au bilan (en moins) : <span class="tag pt">${fmt(sum(P.c))}</span>`,
   bilan: ph => { const b = (y, fac) => `<div class="bil"><h4>Bilan au 31.12.${y}</h4><div class="grp">Immobilisés</div>
      <div class="row"><span>Véhicules</span><span>${fmt(VA)}</span></div>
      ${fac?`<div class="row sub"><span>− FAC s/Véhicules</span><span>−${fmt(fac)}</span></div><div class="row tot"><span>= Valeur résiduelle</span><span>${fmt(VA-fac)}</span></div>`:''}</div>`;
      return `<div class="bils">${b(Y0, ph>=1?4000:0)}${ph>=3?b(Y0+1, 8000):''}</div>`; }},
   ph:[{btn:'Amortir au 31.12 →', text:`Le même véhicule de ${fmt(VA)}, amorti de 4'000.`},
       {btn:'Exercice suivant →', text:`L'amortissement est viré dans un compte « passif » : le <b>FAC</b> (fonds d'amortissements cumulés). Le compte Véhicules garde sa valeur d'acquisition.<br><br>Au bilan, le FAC figure <b>sous le compte d'actif, en moins</b> : on voit la valeur d'acquisition, le cumul et la valeur résiduelle.`},
       {btn:'Amortir au 31.12 →', text:`Le 1<sup>er</sup> janvier ${Y0+1}, on rouvre les comptes : Véhicules <b>${fmt(VA)}</b> (inchangé) et FAC <b>4'000</b>.<br><br>Le compte Amortissements est une charge : il repart à zéro.`},
       {btn:'Suite →', text:`Deuxième amortissement : le FAC passe à <b>8'000</b>, il <b>cumule</b> les amortissements.<br><br>Au bilan : ${fmt(VA)} − 8'000 = <b>12'000</b>. La valeur d'acquisition reste visible.`}],
   extra: ph => ph<1 ? '' : `<div class="calc"><div style="font-weight:600;margin-bottom:4px">Autres exemples</div>
      <div class="row"><span>Amortissements / FAC s/Machines</span></div><div class="row"><span>Amortissements / FAC s/Immeuble commercial</span></div>
      <div class="row"><span>Charges d'immeuble / FAC s/Immeuble locatif</span></div></div>` },

 { title:'Vente d\'une immobilisation', cases:[
   { label:'Immobilisation amortie de façon directe',
     data:`Nous achetons un nouveau véhicule, CHF 30'000. L'ancien est vendu CHF 5'000. Il figure dans les comptes pour CHF 4'000. Paiements par banque.`,
     cpt:{
     accs:['Véhicules (ancien)','Véhicules (nouveau)','Banque','Produits exceptionnels'], hide:{acc:'Produits exceptionnels', until:3},
     J:[{ph:0,open:'Véhicules (ancien)',side:'d',amt:4000},
        {ph:1,d:'Véhicules (nouveau)',c:'Banque',amt:30000,dt:'achat'},
        {ph:2,d:'Banque',c:'Véhicules (ancien)',amt:5000,dt:'vente'},
        {ph:3,d:'Véhicules (ancien)',c:'Produits exceptionnels',amt:1000,dt:'gain'}],
     eff:(acc,P,on,ph)=> acc==='Véhicules (ancien)' ? (ph>=3?`<span class="tag good">soldé ✓</span>`: ph===0 ? `Valeur comptable : <span class="tag at">4'000</span>` : '') : ''},
     ph:[{btn:'Acheter le nouveau →', text:`Lors de la vente d'une immobilisation, il faut <b>mettre à zéro</b> les comptes du bilan qui la concernent.<br><br>Premier cas : l'immobilisation est amortie de façon <b>directe</b>.`},
         {btn:'Vendre l\'ancien →', text:`Le nouveau véhicule est comptabilisé normalement. (Dans le journal, c'est le même compte Véhicules : on sépare l'ancien et le nouveau pour y voir plus clair.)`},
         {btn:'Comptabiliser la différence →', text:`La vente est créditée au compte Véhicules. Il reste un solde de 1'000 au <b>crédit</b> : le compte n'est pas à zéro.`,
          q:{text:`Prix de vente 5'000, valeur comptable 4'000 : gain ou perte ?`, opts:[['gain','gain'],['perte','perte']], ok:'gain',
             fb:`le véhicule est vendu plus cher que sa valeur comptable (5'000 > 4'000) : c'est un <b>GAIN</b> de 1'000 → <b>Produits exceptionnels</b>.`}},
         {btn:'Cas 2 : indirect →', text:`Le gain est crédité aux <b>Produits exceptionnels</b>. Le compte de l'ancien véhicule est soldé.`}] },
   { label:'Immobilisation amortie de façon indirecte',
     data:`Nous achetons un nouveau véhicule, CHF 30'000. L'ancien est vendu CHF 5'000. Les comptes de l'ancien : Véhicules 28'000 et FAC 22'000. Paiements par banque.`,
     cpt:{
     accs:['Véhicules (ancien)','FAC s/Véhicules','Véhicules (nouveau)','Banque','Charges exceptionnelles'], hide:{acc:'Charges exceptionnelles', until:4},
     J:[{ph:0,open:'Véhicules (ancien)',side:'d',amt:28000},{ph:0,open:'FAC s/Véhicules',side:'c',amt:22000},
        {ph:1,d:'Véhicules (nouveau)',c:'Banque',amt:30000,dt:'achat'},
        {ph:2,d:'Banque',c:'Véhicules (ancien)',amt:5000,dt:'vente'},
        {ph:3,d:'FAC s/Véhicules',c:'Véhicules (ancien)',amt:22000,dt:'FAC'},
        {ph:4,d:'Charges exceptionnelles',c:'Véhicules (ancien)',amt:1000,dt:'perte'}],
     eff:(acc,P,on,ph)=> acc==='Véhicules (ancien)' && ph>=4 ? `<span class="tag good">soldé ✓</span>` : acc==='FAC s/Véhicules' && ph>=3 ? `<span class="tag good">soldé ✓</span>` : ''},
     ph:[{btn:'Acheter le nouveau →', text:`Deuxième cas : l'immobilisation est amortie de façon <b>indirecte</b>.<br><br>Sa valeur comptable est de 28'000 − 22'000 = <b>6'000</b>.`},
         {btn:'Vendre l\'ancien →', text:`Le nouveau véhicule est comptabilisé normalement.`},
         {btn:'Virer le FAC →', text:`La vente est créditée au compte Véhicules.`},
         {btn:'Comptabiliser la différence →', text:`Le FAC est viré au compte de l'immobilisation : il est soldé. Le compte Véhicules (ancien) a encore un solde de 1'000 au <b>débit</b>.`,
          q:{text:`Prix de vente 5'000, valeur comptable 6'000 : gain ou perte ?`, opts:[['gain','gain'],['perte','perte']], ok:'perte',
             fb:`le véhicule est vendu moins cher que sa valeur comptable (5'000 < 6'000) : c'est une <b>PERTE</b> de 1'000 → <b>Charges exceptionnelles</b>.`}},
         {btn:'Terminé', text:`La perte est débitée aux <b>Charges exceptionnelles</b>. Les comptes de l'ancien véhicule (Véhicules et FAC) sont à zéro.`}] }] }
];

/* Phases des tableaux : 0 = formules, puis une année par clic */
function tabStep(mode){
  const R = mode==='const' ? TC : TD, n = R.length;
  const ph = [{btn:'1er amortissement →', text: mode==='const'
      ? `Chaque année, le montant de l'amortissement est <b>identique</b>.`
      : `Chaque année, le montant de l'amortissement <b>diminue</b> (sauf la dernière année).`}];
  R.forEach((r,i)=>{
    let t;
    const vr = `<br>Valeur résiduelle = ${fmt(r.vr+r.a)} − ${fmt(r.a)} = <b>${fmt(r.vr)}</b>`;
    if (mode==='const') t = `Amortissement = ${fmt(VA)} × 20 % = <b>${fmt(r.a)}</b>` + vr + (r.vr===0?'<br><br>Après 5 ans, le véhicule est entièrement amorti.':'');
    else if (r.an===1) t = `Le véhicule est acheté le 30 juin : on n'amortit que <b>6 mois</b> la première année.<br>Amortissement = ${fmt(r.base)} × 40 % × 6/12 = <b>${fmt(r.a)}</b>` + vr;
    else if (r.an===n) t = `Dernière année : on amortit <b>tout le solde</b> restant, soit <b>${fmt(r.a)}</b>. La valeur résiduelle tombe à 0.` + vr;
    else t = `La valeur de calcul est la <b>valeur résiduelle</b> de l'année précédente : ${fmt(r.base)}.<br>Amortissement = ${fmt(r.base)} × 40 % = <b>${fmt(r.a)}</b>` + vr;
    ph.push({btn: i===n-1 ? 'Suite →' : `Amortissement ${r.an+1} →`, text:t});
  });
  return ph;
}
STEPS.forEach(s=>{ if (s.tab) s.ph = tabStep(s.tab); });
// Parties à plusieurs cas : phases mises bout à bout
STEPS.forEach(s=>{ if (s.cases){ s.ph = []; s.cases.forEach((c,k)=>{ c.start = s.ph.length; c.k = k; s.ph.push(...c.ph); }); } });
const caseOf = (S, ph) => S.cases ? S.cases.filter(c=>c.start<=ph).pop() : null;
// N° du journal : numérotation des écritures de chaque étape
STEPS.forEach(s=>[s.cpt, ...(s.cases||[]).map(c=>c.cpt)].forEach(C=>{ if (C){ let k = 1; C.J.forEach(e=>{ if (!e.open) e.n = k++; }); } }));
const LAST = STEPS.length-1;
const LET = i => String.fromCharCode(65+i);   // A, B, C…

/* ---------- Actions ---------- */
const A = [];
STEPS.forEach((s,i)=>s.ph.forEach((_,p)=>A.push({step:i, ph:p})));
let pos = 0;

/* ---------- Rendu ---------- */
let QKEY = null;   // clé de la question affichée : « étape.phase »
function qBox(step, q){
  const ch = ANS[QKEY];
  const btn = (a,lb) => `<button class="ch ${ch===a?(a===q.ok?'ok':'ko'):''} ${ch?'':'blink'}" data-a="${a}" ${ch?'disabled':''}>${lb}</button>`;
  const fb = ch ? `<div class="fb ${ch===q.ok?'ok':'ko'}">${ch===q.ok?'✓ En effet':'✗ En fait'}, ${q.fb}</div>` : `<div class="hint">Cliquer sur la bonne réponse.</div>`;
  return `<div class="calc q"><div style="font-weight:600;margin-bottom:4px">La question à se poser</div>${q.text}
    <div class="choices">${q.opts.map(([a,lb])=>btn(a,lb)).join('')}</div>${fb}</div>`;
}

function render(){
  pos = Math.max(0, Math.min(A.length-1, pos));
  const {step, ph} = A[pos], S = STEPS[step], P = S.ph[ph];
  document.querySelectorAll('.dot').forEach((b,i)=>{ b.classList.toggle('cur', i===step); b.classList.toggle('done', i<step); });
  $('prev').disabled = pos===0;
  $('next').disabled = pos===A.length-1 || (P.q && !ANS[step+'.'+ph]);
  $('next').textContent = pos===A.length-1 ? 'Terminé ✓' : P.btn;

  // cas en cours (parties à plusieurs cas) : phase locale lp
  const CS = caseOf(S, ph), p0 = CS ? CS.start : 0, p1 = CS ? CS.start + CS.ph.length : S.ph.length, lp = ph - p0;
  const C = CS ? CS.cpt : S.cpt;
  // question : affichée sur sa phase et sur les suivantes (du même cas) si elle a été répondue
  const qi = S.ph.findIndex((x,i)=>x.q && i>=p0 && i<p1);
  QKEY = qi>=0 ? step+'.'+qi : null;
  const q = qi>=0 && (ph===qi || (ph>qi && ANS[QKEY])) ? qBox(step, S.ph[qi].q) : '';
  $('explain').innerHTML = `<h2 class="steptitle">${LET(step)}. ${S.title}</h2>
    <p class="steptext">${P.text}</p>${q}${S.extra?S.extra(ph):''}${S.tab?formules(S.tab):''}`;

  // scène
  if (S.tab){
    const R = S.tab==='const' ? TC : TD;
    const ex = S.tab==='const' ? `<b>Exemple :</b> véhicule de ${fmt(VA)}, durée d'utilisation 5 ans, amortissement constant 20 %.`
      : `<b>Exemple :</b> véhicule de ${fmt(VA)}, acheté le <b>30 juin ${Y0}</b>, taux dégressif 40 %.`;
    $('stage').innerHTML = `<section class="sec"><h2>Tableau d'amortissement</h2><div class="exbox">${ex}</div>${tabHTML(R, ph)}</section>
      <section class="sec"><h2>Graphique</h2>${barChart(R, ph)}</section>`;
  } else if (S.cases){
    // les cas l'un après l'autre : les cas déjà vus restent affichés, complets
    $('stage').innerHTML = S.cases.filter(c=>c.start<=ph).map(c=>{
      const cur = c===CS, l = cur ? lp : c.ph.length;
      return `<section class="sec ${cur?'':'done'}" id="cas${c.k}"><h2>Cas ${c.k+1} · ${c.label}</h2>
        <div class="exbox"><b>Donnée :</b> ${c.data}</div>${compta(c.cpt, l)}</section>`;
    }).join('');
    if (lp===0 && CS.k>0) $('cas'+CS.k).scrollIntoView({behavior:'smooth', block:'start'});
  } else if (C){
    $('stage').innerHTML = `<section class="sec"><h2>Dans la comptabilité</h2>${compta(C, lp)}</section>`
      + (C.bilan ? `<section class="sec"><h2>Au bilan</h2>${C.bilan(lp)}</section>` : '');
  } else {
    $('stage').innerHTML = S.stage(ph);
  }
}

/* Journal et comptes en T d'une écriture C à la phase locale lp */
function compta(C, lp){
  // compte du gain / de la perte : nommé « ? » tant que l'écriture n'est pas passée
  const nm = a => C.hide && a===C.hide.acc && lp<C.hide.until ? '?' : a;
  const rows = C.J.filter(e=>!e.open);
  const jr = `<table class="journal"><caption>Journal</caption><tr><th>N°</th><th>Débit</th><th>Crédit</th><th class="am">Montant</th></tr>
    ${rows.map(e=>`<tr class="${e.ph===lp?'cur':e.ph>lp?'todo':''}"><td>${e.n}</td><td>${e.ph>lp?'':short(nm(e.d))}</td><td>${e.ph>lp?'':short(nm(e.c))}</td><td class="am">${e.ph>lp?'':fmt(e.amt)}</td></tr>`).join('')}</table>`;
  const row = (J, on) => `<div class="tg">${C.accs.map(acc=>{
    const Pp = postings(J, acc, lp);
    const focus = J.some(e=>e.ph===lp && (e.d===acc||e.c===acc||e.open===acc));
    return tHTML(acc, Pp, focus, C.eff ? C.eff(acc,Pp,on,lp) : '', nm(acc));
  }).join('')}</div>`;
  const J1 = C.J.filter(e=>!e.y), J2 = C.J.filter(e=>e.y===2);
  const ts = C.y2 ? `<div class="yr">Exercice ${Y0}</div>${row(J1, lp>=1)}${lp>=C.y2?`<div class="yr">Exercice ${Y0+1}</div>${row(J2, lp>=3)}`:''}` : row(C.J, true);
  return `<div class="jr-stage">${jr}</div>${ts}`;
}

function formules(mode){
  return mode==='const'
    ? `<div class="calc"><div style="font-weight:600;margin-bottom:4px">Calculs</div>
        <div class="row"><span><b>Taux = 100 : nombre d'années.</b><p>Comme ici : 100 : 5 = 20 %</span></div>
        <div class="row"><span>Amortissement = valeur d'achat : nb d'années</span></div>
		<div class="row"><span>ou</span></div>
        <div class="row"><span>Amortissement = <b>valeur d'acquisition</b> × taux</span></div></div>`
    : `<div class="calc"><div style="font-weight:600;margin-bottom:4px">Calculs</div>
        <div class="row"><span><b>Taux = taux constant × 2</b><p>Comme ici : 20 % × 2 = 40 %</span></div>
        <div class="row"><span>Amortissement = <b>valeur résiduelle</b> × taux</span></div></div>`;
}

/* ---------- Navigation ---------- */
function goTo(p){ pos = p; render(); }
function goStep(s){ goTo(A.findIndex(a=>a.step===s)); }

let Z = 1;
try { Z = +localStorage.getItem('amortissements-zoom') || 1; } catch(e){}
function applyZoom(){
  Z = Math.round(Math.max(0.8, Math.min(1.6, Z))*10)/10;
  document.documentElement.style.setProperty('--z', Z);
  try { localStorage.setItem('amortissements-zoom', Z); } catch(e){}
}
$('dots').innerHTML = STEPS.map((s,i)=>`<button class="dot" data-s="${i}" title="${LET(i)}. ${s.title}" aria-label="${LET(i)}. ${s.title}"></button>`).join('');
$('zm').addEventListener('click', ()=>{ Z -= 0.1; applyZoom(); });
$('zp').addEventListener('click', ()=>{ Z += 0.1; applyZoom(); });
$('next').addEventListener('click', ()=>goTo(pos+1));
$('prev').addEventListener('click', ()=>goTo(pos-1));
$('explain').addEventListener('click', e=>{ const b=e.target.closest('.ch'); if (!b || b.disabled || !QKEY) return; ANS[QKEY] = b.dataset.a; render(); });
$('quit').addEventListener('click', ()=>{ window.close(); setTimeout(()=>{ $('quit-msg').style.display='block'; }, 300); });
$('dots').addEventListener('click', e=>{ const b=e.target.closest('.dot'); if (b) goStep(+b.dataset.s); });
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' && !$('next').disabled) goTo(pos+1);
  if (e.key==='ArrowLeft') goTo(pos-1);
});
render();
applyZoom();
</script>
<script src="theorie.js"></script>
</body>
